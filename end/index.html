<style>
:root{--bg:#f2f3f7;--card:#fff;--ink:#141c2e;--muted:#636b7e;--line:#e1e4ec;--pri:#1b2a4a;--pri2:#2b4170;--gold:#b8893a;--gold2:#f5ecdc;--ok:#1d7a46;--okb:#e3f3e9;--ko:#b42318;--kob:#fdecea;--wa:#9a5b06;--wab:#fdf3e1}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
button,input,select,textarea{font:inherit}
.app{display:grid;grid-template-columns:236px minmax(0,1fr);min-height:100vh}
.side{background:var(--pri);color:#e7ebf4;padding:14px 10px;position:sticky;top:0;height:100vh;overflow-y:auto}
.brand{display:flex;gap:10px;align-items:center;padding:4px 6px 14px;border-bottom:1px solid rgba(255,255,255,.12);margin-bottom:10px}
.logo{width:42px;height:42px;border-radius:50%;background:var(--gold);color:var(--pri);display:grid;place-items:center;font-weight:800;letter-spacing:.5px;flex:none;font-size:14px}
.brand b{display:block;font-size:15px}.brand small{opacity:.7;font-size:12px;display:block}
.nav a{display:flex;gap:10px;align-items:center;padding:9px 10px;border-radius:8px;color:inherit;text-decoration:none;cursor:pointer;font-size:14.5px}
.nav a:hover{background:rgba(255,255,255,.08)}.nav a.on{background:var(--gold);color:var(--pri);font-weight:700}
.nav .grp{font-size:11px;text-transform:uppercase;letter-spacing:1px;opacity:.55;margin:12px 10px 4px}
.who{font-size:12.5px;opacity:.8;padding:8px 10px;border-top:1px solid rgba(255,255,255,.12);margin-top:10px}
.main{min-width:0;padding:18px 22px 90px}
.top{display:flex;align-items:center;gap:10px;margin-bottom:14px;flex-wrap:wrap}
.top h1{font-size:21px;margin:0;flex:1;min-width:0}
.pill{font-size:12px;padding:4px 9px;border-radius:99px;background:#e9ecf2;color:var(--muted);white-space:nowrap}
.pill.g{background:var(--okb);color:var(--ok)}.pill.r{background:var(--kob);color:var(--ko)}.pill.w{background:var(--wab);color:var(--wa)}
.btn{border:1px solid var(--line);background:#fff;color:var(--ink);padding:8px 13px;border-radius:9px;cursor:pointer;white-space:nowrap}
.btn:hover{border-color:#c5cad3}.btn.p{background:var(--pri);border-color:var(--pri);color:#fff}.btn.g{background:var(--gold);border-color:var(--gold);color:#fff;font-weight:700}
.btn.d{color:var(--ko);border-color:#f2c4bf}.btn.sm{padding:5px 9px;font-size:13px}.btn:disabled{opacity:.5;cursor:default}
.grid{display:grid;gap:12px}.g4{grid-template-columns:repeat(4,minmax(0,1fr))}.g3{grid-template-columns:repeat(3,minmax(0,1fr))}.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px;min-width:0;margin-bottom:12px}
.grid>.card{margin-bottom:0}
.card h3{margin:0 0 10px;font-size:15px}
.kpi .v{font-size:22px;font-weight:800;margin-top:2px;overflow-wrap:anywhere}.kpi .l{font-size:12.5px;color:var(--muted)}.kpi .s{font-size:12px;color:var(--muted);margin-top:3px}
.kpi.dark{background:var(--pri);color:#fff;border-color:var(--pri)}.kpi.dark .l,.kpi.dark .s{color:#c7d0e4}
table{width:100%;border-collapse:collapse}th,td{text-align:left;padding:8px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-size:12px;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.4px}
td.n,th.n{text-align:right;white-space:nowrap}tr.click{cursor:pointer}tr.click:hover td{background:#f8f9fb}tr.del td{color:#9aa0ad;text-decoration:line-through}
.tag{display:inline-block;font-size:11.5px;padding:2px 8px;border-radius:99px;background:#eef0f4;color:#475467;white-space:nowrap}
.tag.g{background:var(--okb);color:var(--ok)}.tag.r{background:var(--kob);color:var(--ko)}.tag.w{background:var(--wab);color:var(--wa)}.tag.b{background:#e7eefb;color:#1f4fa3}
.code{font-family:ui-monospace,Menlo,monospace;font-weight:700;letter-spacing:.3px}
.bar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
.bar input,.bar select{padding:8px 10px;border:1px solid var(--line);border-radius:9px;background:#fff;min-width:0;max-width:100%}
.grow{flex:1;min-width:140px}
.muted{color:var(--muted)}.small{font-size:13px}.b{font-weight:700}
.empty{padding:26px;text-align:center;color:var(--muted)}
.alert{padding:10px 12px;border-radius:9px;background:#eef0f4;margin:0 0 10px;font-size:14px}.alert.g{background:var(--okb)}.alert.r{background:var(--kob)}.alert.w{background:var(--wab)}
.modal-bg{position:fixed;inset:0;background:rgba(10,16,30,.45);display:flex;align-items:flex-start;justify-content:center;padding:4vh 10px;z-index:50;overflow-y:auto}
.modal{background:#fff;border-radius:14px;max-width:700px;width:100%;padding:18px;box-shadow:0 20px 50px rgba(0,0,0,.25)}
.modal h2{margin:0 0 12px;font-size:19px}
.f{display:grid;gap:10px;grid-template-columns:repeat(2,minmax(0,1fr))}.f .full{grid-column:1/-1}
.f label{font-size:12.5px;color:var(--muted);display:block;margin-bottom:3px}
.f input,.f select,.f textarea{width:100%;padding:9px 10px;border:1px solid var(--line);border-radius:9px;background:#fff}
.f input[readonly]{background:#f5f6f9}
.act{display:flex;gap:8px;justify-content:flex-end;margin-top:14px;flex-wrap:wrap}
.toast{position:fixed;left:50%;bottom:84px;transform:translateX(-50%);background:#141c2e;color:#fff;padding:10px 16px;border-radius:10px;z-index:80;font-size:14px;max-width:92vw}
.hbar{height:8px;background:#eceef2;border-radius:9px;overflow:hidden;min-width:60px}.hbar i{display:block;height:100%;background:var(--gold)}
.login{min-height:100vh;display:grid;place-items:center;background:linear-gradient(160deg,#1b2a4a,#2b4170);padding:16px}
.login .box{background:#fff;border-radius:16px;padding:24px;width:100%;max-width:380px}
.login .logo{margin:0 auto 10px;width:62px;height:62px;font-size:18px}
.tabbar{display:none}.menu-btn{display:none}
.diff{font-size:12px;background:#f6f7fa;border-radius:6px;padding:4px 6px;margin-top:3px;white-space:pre-wrap;overflow-wrap:anywhere}
@media (max-width:900px){.g4{grid-template-columns:repeat(2,minmax(0,1fr))}.g3{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:760px){
 .app{grid-template-columns:minmax(0,1fr)}.side{display:none}.side.open{display:block;position:fixed;inset:0 22% 0 0;z-index:60;height:100%;box-shadow:0 0 0 100vmax rgba(0,0,0,.4)}
 .main{padding:12px 12px 96px}.top h1{font-size:18px}
 .g2,.g3{grid-template-columns:minmax(0,1fr)}.f{grid-template-columns:minmax(0,1fr)}
 .tabbar{display:grid;grid-template-columns:repeat(5,1fr);position:fixed;left:0;right:0;bottom:0;background:#fff;border-top:1px solid var(--line);z-index:40;padding-bottom:env(safe-area-inset-bottom)}
 .tabbar a{display:flex;flex-direction:column;align-items:center;font-size:11px;padding:7px 2px;color:var(--muted);cursor:pointer}.tabbar a.on{color:var(--pri);font-weight:700}.tabbar a span{font-size:19px}
 table.resp thead{display:none}table.resp tr{display:block;border:1px solid var(--line);border-radius:10px;margin-bottom:8px;padding:6px 8px;background:#fff}
 table.resp td{display:flex;justify-content:space-between;gap:10px;border:0;padding:4px 2px;text-align:right}table.resp td::before{content:attr(data-l);color:var(--muted);font-size:12.5px;text-align:left}
 table.resp td.n{white-space:normal}
 .menu-btn{display:inline-flex}
}
@media print{.side,.tabbar,.top .btn,.bar,.no-print{display:none!important}.main{padding:0}.card{break-inside:avoid}}
</style>
</head>
<body>
<div id="root"><div class="login"><div class="box" style="text-align:center">Chargement…</div></div></div>
<script>
'use strict';
/* =====================  END — Dons des volontaires  ===================== */
const VERSION = 'V1.0';
const ADMIN_EMAIL = 'moayepos@gmail.com';
const FB_CFG = { apiKey:"AIzaSyCFIEAfd7ssJHbUWUYjCCqcgQ5HmUh9XFI", authDomain:"moayes-industrie.firebaseapp.com",
  databaseURL:"https://moayes-industrie-default-rtdb.europe-west1.firebasedatabase.app", projectId:"moayes-industrie" };
const ROOT = 'end';
const ROLES = { admin:'Administrateur', tresorier:'Trésorier général', adjointe:'Trésorière adjointe', cac:'Commissaire aux comptes', gm:'Grand Maître' };
const PERM = {
  noms:    ['admin','tresorier','adjointe','cac'],
  membres: ['admin','tresorier'],
  saisie:  ['admin','tresorier','adjointe'],
  suppr:   ['admin','tresorier'],
  journal: ['admin','cac'],
  users:   ['admin'],
};
const can = p => !!(ME && PERM[p].includes(ME.role));
const DEVISES = { XOF:['Franc CFA (BCEAO)',1], XAF:['Franc CFA (BEAC)',1], EUR:['Euro',655.957], USD:['Dollar américain',0], GBP:['Livre sterling',0], CAD:['Dollar canadien',0], CHF:['Franc suisse',0], GHS:['Cedi ghanéen',0], NGN:['Naira nigérian',0], GNF:['Franc guinéen',0], MAD:['Dirham marocain',0], AUTRE:['Autre devise',0] };
const MODES = ['Wave','Orange Money','MTN Mobile Money','Moov Money','Virement bancaire','Western Union / transfert','Espèces','Chèque','Autre'];

/* ---------- utilitaires ---------- */
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const num = v => { const n = parseFloat(String(v ?? '').replace(/[\s  ]/g,'').replace(',','.')); return isFinite(n) ? n : 0; };
const F = n => Math.round(num(n)).toLocaleString('fr-FR').replace(/[   ]/g,' ');
const FCFA = n => F(n) + ' F';
const F2 = n => (Math.round(num(n) * 100) / 100).toLocaleString('fr-FR', { maximumFractionDigits: 2 }).replace(/[   ]/g,' ');
const today = () => new Date().toISOString().slice(0,10);
const dfr = d => d ? d.split('-').reverse().join('/') : '';
const dtfr = t => t ? new Date(t).toLocaleString('fr-FR', { dateStyle:'short', timeStyle:'short' }) : '';
const vals = o => Object.values(o || {});
function toast(t){ document.querySelectorAll('.toast').forEach(x => x.remove()); const d = document.createElement('div'); d.className = 'toast'; d.textContent = t; document.body.appendChild(d); setTimeout(() => d.remove(), 2800); }
function enLettres(n){
  n = Math.round(Math.abs(num(n))); if (n === 0) return 'zéro';
  const U = ['','un','deux','trois','quatre','cinq','six','sept','huit','neuf','dix','onze','douze','treize','quatorze','quinze','seize','dix-sept','dix-huit','dix-neuf'];
  const D = ['','dix','vingt','trente','quarante','cinquante','soixante','soixante','quatre-vingt','quatre-vingt'];
  const cent = x => { let s = ''; const c = Math.floor(x/100), r = x % 100;
    if (c) s = (c > 1 ? U[c] + ' cent' + (r === 0 ? 's' : '') : 'cent');
    if (r){ let t; if (r < 20) t = U[r]; else { const d = Math.floor(r/10), u = r % 10;
      if (d === 7 || d === 9) t = D[d] + (d === 7 && u === 1 ? ' et ' : '-') + U[10+u];
      else t = D[d] + (u === 1 && d !== 8 ? ' et un' : u ? '-' + U[u] : (d === 8 ? 's' : '')); }
      s += (s ? ' ' : '') + t; }
    return s; };
  let s = '', rest = n;
  for (const [v, w] of [[1e9,'milliard'],[1e6,'million'],[1e3,'mille']]){ const q = Math.floor(rest / v); rest %= v; if (!q) continue;
    if (w === 'mille') s += (q === 1 ? 'mille' : cent(q).replace(/(cent|vingt)s$/,'$1') + ' mille') + ' ';
    else s += cent(q) + ' ' + w + (q > 1 ? 's' : '') + ' '; }
  if (rest) s += cent(rest);
  return s.trim();
}

/* ---------- état ---------- */
let AUTH = null, ME = null, DB = null, LISTENERS = [];
const S = { membres:{}, prive:{}, groupes:{}, dons:{}, journal:[], users:{}, ready:{} };
let VIEW = 'tableau', ARG = null, ONLINE = true;
const nomDe = code => { const p = S.prive[code]; return p ? [p.nom, p.prenoms].filter(Boolean).join(' ') : ''; };
const libMembre = code => can('noms') && nomDe(code) ? `<span class="code">${esc(code)}</span> — ${esc(nomDe(code))}` : `<span class="code">${esc(code)}</span>`;
const txtMembre = code => can('noms') && nomDe(code) ? `${code} — ${nomDe(code)}` : code;
const groupeDe = id => S.groupes[id] || { nom:'(sans groupe)' };
const donsActifs = () => vals(S.dons).filter(d => !d.supprime);
const ref = p => DB.ref(ROOT + (p ? '/' + p : ''));

/* ---------- journal (ne peut pas être effacé : règle Firebase « ajout seulement ») ---------- */
function journal(action, cible, avant, apres){
  const clean = o => o == null ? null : JSON.parse(JSON.stringify(o));
  return ref('journal').push({ t: Date.now(), uid: AUTH.uid, qui: ME.nom || AUTH.email, role: ME.role, action, cible, avant: clean(avant), apres: clean(apres) }).catch(e => console.warn('journal', e));
}
async function compteur(nom){
  const r = await ref('compteurs/' + nom).transaction(v => (v || 0) + 1);
  if (!r.committed) throw new Error('compteur');
  return r.snapshot.val();
}

/* ---------- Firebase ---------- */
function fbInit(){
  if (typeof firebase === 'undefined'){ $('#root').innerHTML = `<div class="login"><div class="box"><h3>Pas de connexion</h3><p>Impossible de charger le service. Vérifiez internet puis rouvrez l'application.</p><button class="btn p" onclick="location.reload()">Réessayer</button></div></div>`; return; }
  firebase.apps.length || firebase.initializeApp(FB_CFG);
  DB = firebase.database();
  DB.ref('.info/connected').on('value', s => { ONLINE = s.val() !== false; const el = $('#netpill'); if (el){ el.className = 'pill ' + (ONLINE ? 'g' : 'w'); el.textContent = ONLINE ? '● En ligne' : '● Hors ligne'; } });
  firebase.auth().onAuthStateChanged(async u => {
    stopListeners(); AUTH = u; ME = null;
    if (!u){ renderLogin(); return; }
    try {
      let snap = await DB.ref(ROOT + '/roles/' + u.uid).once('value'), r = snap.val();
      if (!r && (u.email || '').toLowerCase() === ADMIN_EMAIL){
        r = { role:'admin', nom:'Moaye (administrateur)', email:u.email, actif:true, cree:Date.now() };
        await DB.ref(ROOT + '/roles/' + u.uid).set(r);
      }
      if (!r || !r.actif){ renderBlocked(r ? 'Votre compte a été désactivé par l\'administrateur.' : 'Ce compte n\'a pas encore de rôle. Demandez à l\'administrateur de vous l\'attribuer.'); return; }
      ME = r; startListeners(); render();
    } catch(e){ renderBlocked('Accès refusé par la base de données. L\'administrateur doit installer les règles de sécurité (voir le guide).<br><span class="small muted">' + esc(e.code || e.message) + '</span>'); }
  });
}
function listen(path, fn, q){
  const r = q ? q(ref(path)) : ref(path);
  const cb = r.on('value', s => { fn(s.val()); S.ready[path] = true; scheduleRender(); }, e => console.warn(path, e));
  LISTENERS.push(() => r.off('value', cb));
}
function stopListeners(){ LISTENERS.forEach(f => { try { f(); } catch(e){} }); LISTENERS = []; for (const k of ['membres','prive','groupes','dons','users']) S[k] = {}; S.journal = []; S.ready = {}; }
function startListeners(){
  listen('membres', v => S.membres = v || {});
  listen('groupes', v => S.groupes = v || {});
  listen('dons', v => S.dons = v || {});
  if (can('noms')) listen('prive', v => S.prive = v || {});
  if (can('journal')) listen('journal', v => S.journal = vals(v).sort((a, b) => b.t - a.t), r => r.orderByChild('t').limitToLast(1500));
  if (can('users')) listen('roles', v => S.users = v || {});
}
let rT = null; function scheduleRender(){ clearTimeout(rT); rT = setTimeout(() => { if (!$('.modal-bg')) render(); }, 60); }

/* ---------- connexion ---------- */
function renderLogin(msg){
  $('#root').innerHTML = `<div class="login"><div class="box"><div class="logo">END</div>
    <h2 style="text-align:center;margin:0">École de Navigation Divine</h2><p class="muted small" style="text-align:center;margin:4px 0 14px">Dons des volontaires — accès réservé à l'administration</p>
    ${msg ? `<div class="alert r">${msg}</div>` : ''}
    <div class="f" style="grid-template-columns:1fr"><div><label>E-mail</label><input id="l_e" type="email" autocomplete="username"></div>
    <div><label>Mot de passe</label><input id="l_p" type="password" autocomplete="current-password" onkeydown="if(event.key==='Enter')login()"></div></div>
    <div class="act" style="justify-content:space-between"><button class="btn sm" onclick="oubli()">Mot de passe oublié</button><button class="btn p" onclick="login()">Se connecter</button></div>
    <p class="small muted" style="margin-top:14px">Première utilisation par l'administrateur : <a href="#" onclick="premierAdmin();return false">créer le compte administrateur</a>.</p>
    <p class="small muted" style="text-align:center">${VERSION}</p></div></div>`;
}
function renderBlocked(msg){
  $('#root').innerHTML = `<div class="login"><div class="box"><div class="logo">END</div><div class="alert w">${msg}</div><p class="small muted">${esc(AUTH && AUTH.email)}</p><div class="act"><button class="btn" onclick="firebase.auth().signOut()">Se déconnecter</button><button class="btn p" onclick="location.reload()">Réessayer</button></div></div></div>`;
}
const authErr = e => ({ 'auth/invalid-credential':'E-mail ou mot de passe incorrect.', 'auth/wrong-password':'Mot de passe incorrect.', 'auth/user-not-found':'Aucun compte avec cet e-mail.', 'auth/invalid-email':'E-mail invalide.', 'auth/too-many-requests':'Trop d\'essais. Patientez quelques minutes.', 'auth/network-request-failed':'Pas de connexion internet.', 'auth/email-already-in-use':'Cet e-mail a déjà un compte.', 'auth/weak-password':'Mot de passe trop court (8 caractères minimum).', 'auth/operation-not-allowed':'La connexion par e-mail n\'est pas activée dans Firebase (voir le guide, étape 1).', 'auth/requires-recent-login':'Par sécurité, reconnectez-vous puis recommencez.' }[e && e.code] || ('Erreur : ' + (e && (e.code || e.message))));
async function login(){
  const e = $('#l_e').value.trim(), p = $('#l_p').value;
  if (!e || !p) return toast('E-mail et mot de passe');
  try { await firebase.auth().signInWithEmailAndPassword(e, p); } catch(err){ renderLogin(authErr(err)); $('#l_e').value = e; }
}
async function oubli(){
  const e = ($('#l_e') && $('#l_e').value.trim()) || prompt('Votre e-mail :'); if (!e) return;
  try { await firebase.auth().sendPasswordResetEmail(e); toast('E-mail de réinitialisation envoyé'); } catch(err){ toast(authErr(err)); }
}
function premierAdmin(){
  modal(`<h2>Créer le compte administrateur</h2><p class="small">Réservé à l'adresse <b>${ADMIN_EMAIL}</b>. Les autres comptes seront créés ensuite par l'administrateur, depuis le menu « Utilisateurs ».</p>
    <div class="f"><div class="full"><label>E-mail</label><input id="a_e" value="${ADMIN_EMAIL}" readonly></div><div><label>Mot de passe (8 caractères min.)</label><input id="a_p" type="password"></div><div><label>Confirmer</label><input id="a_p2" type="password"></div></div>
    <div class="act"><button class="btn" onclick="closeModal()">Annuler</button><button class="btn p" onclick="creerAdmin()">Créer</button></div>`);
}
async function creerAdmin(){
  const p = $('#a_p').value; if (p.length < 8) return toast('8 caractères minimum'); if (p !== $('#a_p2').value) return toast('Les mots de passe diffèrent');
  try { await firebase.auth().createUserWithEmailAndPassword(ADMIN_EMAIL, p); closeModal(); toast('Compte administrateur créé'); } catch(e){ toast(authErr(e)); }
}

/* ---------- navigation ---------- */
const MENU = () => [
  ['Suivi', [['tableau','📊','Tableau de bord'],['dons','💝','Dons'],['rapports','📈','Rapports']]],
  ['Registre', [['membres','👥','Membres'],['groupes','🏘','Groupes']]],
  ['Contrôle', [...(can('journal') ? [['journal','🕘','Journal']] : []), ...(can('users') ? [['utilisateurs','🔐','Utilisateurs']] : []), ['compte','👤','Mon compte'],['aide','❓','Mode d\'emploi']]],
];
const TABS = [['tableau','📊','Accueil'],['dons','💝','Dons'],['membres','👥','Membres'],['rapports','📈','Rapports'],['__menu','☰','Menu']];
function go(v, a){ VIEW = v; ARG = a ?? null; const s = $('.side'); if (s) s.classList.remove('open'); render(); scrollTo(0, 0); }
window.__back = () => { if ($('.modal-bg')){ closeModal(); return true; } if (VIEW !== 'tableau'){ go('tableau'); return true; } return false; };
function render(){
  if (!ME) return;
  const items = MENU().flatMap(g => g[1]);
  const titre = (items.find(m => m[0] === VIEW) || [,,'Fiche'])[2];
  const body = (VIEWS[VIEW] || VIEWS.tableau)(ARG);
  $('#root').innerHTML = `<div class="app">
    <aside class="side"><div class="brand"><div class="logo">END</div><div><b>Dons des volontaires</b><small>École de Navigation Divine</small></div></div>

function modal(html){ closeModal(); const d = document.createElement('div'); d.className = 'modal-bg'; d.innerHTML = `<div class="modal">${html}</div>`; d.addEventListener('mousedown', e => { if (e.target === d) closeModal(); }); document.body.appendChild(d); }
function closeModal(){ document.querySelectorAll('.modal-bg').forEach(x => x.remove()); if (ME) render(); }
const val = id => { const e = document.getElementById(id); return e ? e.value.trim() : ''; };
const opts = (arr, sel) => arr.map(x => Array.isArray(x) ? `<option value="${esc(x[0])}" ${x[0] === sel ? 'selected' : ''}>${esc(x[1])}</option>` : `<option ${x === sel ? 'selected' : ''}>${esc(x)}</option>`).join('');
const tbl = (head, rows, empty) => rows.length ? `<table class="resp"><thead><tr>${head.map(h => `<th class="${h[1] || ''}">${h[0]}</th>`).join('')}</tr></thead><tbody>${rows.join('')}</tbody></table>` : `<div class="empty">${empty}</div>`;
const groupesTries = () => Object.entries(S.groupes).sort((a, b) => (a[1].nom || '').localeCompare(b[1].nom || ''));
const pays = () => [...new Set([...vals(S.membres).map(m => m.pays), ...vals(S.groupes).map(g => g.pays)].filter(Boolean))].sort();

/* ---------- filtres communs ---------- */
const FL = { d1:'', d2:'', pays:'', groupe:'', camp:'' };
function filtresHTML(){
  return `<div class="bar no-print"><input type="date" value="${FL.d1}" onchange="FL.d1=this.value;render()" title="Du"><input type="date" value="${FL.d2}" onchange="FL.d2=this.value;render()" title="Au">
  <select onchange="FL.pays=this.value;render()"><option value="">Tous pays</option>${opts(pays(), FL.pays)}</select>
  <select onchange="FL.groupe=this.value;render()"><option value="">Tous groupes</option>${opts(groupesTries().map(([k, g]) => [k, g.nom]), FL.groupe)}</select>
  <select onchange="FL.camp=this.value;render()"><option value="">Toutes campagnes</option>${opts(campagnes(), FL.camp)}</select>
  ${FL.d1 || FL.d2 || FL.pays || FL.groupe || FL.camp ? `<button class="btn sm" onclick="Object.assign(FL,{d1:'',d2:'',pays:'',groupe:'',camp:''});render()">Effacer</button>` : ''}</div>`;
}
function donsFiltres(){
  return donsActifs().filter(d => (!FL.d1 || d.date >= FL.d1) && (!FL.d2 || d.date <= FL.d2) && (!FL.groupe || d.groupe === FL.groupe) && (!FL.camp || d.objet === FL.camp)
    && (!FL.pays || ((S.membres[d.code] || {}).pays || groupeDe(d.groupe).pays) === FL.pays));
}
function parGroupe(L){
  const o = {};
  for (const d of L){ const g = o[d.groupe] || (o[d.groupe] = { id: d.groupe, total: 0, nb: 0, codes: new Set() }); g.total += num(d.fcfa); g.nb++; g.codes.add(d.code); }
  return Object.values(o).sort((a, b) => b.total - a.total);
}
function parMembre(L){
  const o = {};
  for (const d of L){ const m = o[d.code] || (o[d.code] = { code: d.code, groupe: d.groupe, total: 0, nb: 0, dernier: '' }); m.total += num(d.fcfa); m.nb++; if (d.date > m.dernier) m.dernier = d.date; }
  return Object.values(o).sort((a, b) => b.total - a.total);
}

const VIEWS = {};
VIEWS.tableau = () => {
  const L = donsFiltres(), tot = L.reduce((s, d) => s + num(d.fcfa), 0), G = parGroupe(L), M = parMembre(L);
  const actifs = vals(S.membres).filter(m => m.statut !== 'inactif').length;

  const charge = !S.ready.dons ? '<div class="alert">Chargement des données…</div>' : '';
  return `${charge}${filtresHTML()}
  <div class="grid g4" style="margin-bottom:12px">
    <div class="card kpi dark"><div class="l">Total général</div><div class="v">${FCFA(tot)}</div><div class="s">${L.length} don(s)</div></div>
    <div class="card kpi"><div class="l">Cotisants</div><div class="v">${M.length}</div><div class="s">sur ${actifs} membre(s) actif(s)</div></div>
    <div class="card kpi"><div class="l">Groupes contributeurs</div><div class="v">${G.length}</div><div class="s">sur ${Object.keys(S.groupes).length} groupe(s)</div></div>
    <div class="card kpi"><div class="l">Don moyen</div><div class="v">${FCFA(L.length ? tot / L.length : 0)}</div></div>
  </div>
  <div class="card"><h3>Classement des groupes</h3>${tbl([['#'],['Groupe'],['Pays'],['Cotisants','n'],['Total','n'],['Part']], G.map((g, i) => `<tr class="click" onclick="go('groupe','${esc(g.id)}')"><td>${i + 1}</td><td><b>${esc(groupeDe(g.id).nom)}</b></td><td>${esc(groupeDe(g.id).pays || '')}</td><td class="n">${g.codes.size}</td><td class="n b">${FCFA(g.total)}</td><td><div class="hbar"><i style="width:${g.total / max * 100}%"></i></div><span class="small muted">${tot ? Math.round(g.total / tot * 100) : 0} %</span></td></tr>`), 'Aucun don sur la période.')}</div>
  <div class="card"><h3>Derniers dons</h3>${tbl([['Date'],['Reçu'],['Membre'],['Groupe'],['Montant','n']], L.sort((a, b) => (b.date + b.recu).localeCompare(a.date + a.recu)).slice(0, 10).map(d => `<tr class="click" onclick="ficheDon('${d.id}')"><td>${dfr(d.date)}</td><td>${esc(d.recu)}</td><td>${libMembre(d.code)}</td><td>${esc(groupeDe(d.groupe).nom)}</td><td class="n b">${FCFA(d.fcfa)}</td></tr>`), 'Aucun don.')}
  ${can('saisie') ? '<div class="act"><button class="btn g" onclick="editDon()">+ Nouveau don</button></div>' : ''}</div>`;
};

/* ----- dons ----- */

VIEWS.dons = () => {
  const q = DQ.toLowerCase();
  let L = DSUP ? vals(S.dons).filter(d => d.supprime) : donsFiltres();
  if (q) L = L.filter(d => (d.code + ' ' + (d.recu || '') + ' ' + (d.ref || '') + ' ' + (d.mode || '') + ' ' + (can('noms') ? nomDe(d.code) : '')).toLowerCase().includes(q));
  L.sort((a, b) => (b.date + b.recu).localeCompare(a.date + a.recu));

  return `${filtresHTML()}<div class="bar"><input class="grow" placeholder="🔍 Code, ${can('noms') ? 'nom, ' : ''}reçu, référence" value="${esc(DQ)}" oninput="DQ=this.value;clearTimeout(window._dq);window._dq=setTimeout(()=>{render();const i=document.querySelector('.bar .grow');i.focus();i.setSelectionRange(i.value.length,i.value.length)},300)">

  <div class="card"><div class="small muted" style="margin-bottom:6px">${L.length} don(s) · ${FCFA(tot)}</div>${tbl([['Date'],['Reçu'],['Membre'],['Groupe'],['Origine','n'],['FCFA','n'],['Mode']], L.map(d => `<tr class="click ${d.supprime ? 'del' : ''}" onclick="ficheDon('${d.id}')"><td>${dfr(d.date)}</td><td>${esc(d.recu)}</td><td>${libMembre(d.code)}</td><td>${esc(groupeDe(d.groupe).nom)}</td><td class="n">${d.devise !== 'XOF' ? F2(d.montant) + ' ' + esc(d.devise) : ''}</td><td class="n b">${FCFA(d.fcfa)}</td><td>${esc(d.mode)}</td></tr>`), DSUP ? 'Aucun don supprimé.' : 'Aucun don.')}</div>`;
};
function ficheDon(id){
  const d = S.dons[id]; if (!d) return;
  const edit = can('suppr') || (ME.role === 'adjointe' && d.saisiPar === AUTH.uid);
  modal(`<h2>Don ${esc(d.recu)} ${d.supprime ? '<span class="tag r">Supprimé</span>' : ''}</h2>
  <table>${[['Date', dfr(d.date)], ['Membre', libMembre(d.code)], ['Groupe', esc(groupeDe(d.groupe).nom)], ['Montant d\'origine', F2(d.montant) + ' ' + esc(d.devise)], ['Taux', d.devise === 'XOF' ? '—' : '1 ' + esc(d.devise) + ' = ' + F2(d.taux) + ' F'], ['Montant en FCFA', '<b>' + FCFA(d.fcfa) + '</b>'], ['Mode', esc(d.mode)], ['Référence', esc(d.ref || '')], ['Objet / campagne', esc(d.objet || '')], ['Saisi par', esc(d.saisiNom || '') + ' — ' + dtfr(d.cree)], ...(d.modifNom ? [['Dernière modification', esc(d.modifNom) + ' — ' + dtfr(d.modifie)]] : []), ...(d.supprime ? [['Supprimé par', esc(d.supprNom) + ' — ' + dtfr(d.supprLe)], ['Motif', esc(d.motif)]] : [])].map(([a, b]) => `<tr><td class="muted small">${a}</td><td>${b}</td></tr>`).join('')}</table>
  <div class="act">${can('noms') ? `<button class="btn" onclick="recu('${id}')">🖨 Reçu</button>` : ''}${!d.supprime && can('suppr') ? `<button class="btn d" onclick="supprDon('${id}')">Supprimer</button>` : ''}${!d.supprime && edit ? `<button class="btn p" onclick="editDon('${id}')">Modifier</button>` : ''}<button class="btn" onclick="closeModal()">Fermer</button></div>`);
}
function membresOptions(sel){
  return vals(S.membres).sort((a, b) => a.code.localeCompare(b.code)).map(m => `<option value="${esc(m.code)}" ${m.code === sel ? 'selected' : ''}>${esc(txtMembre(m.code))}${m.statut === 'inactif' ? ' (inactif)' : ''}</option>`).join('');
}
function editDon(id){
  if (!vals(S.membres).length) return toast(can('membres') ? 'Créez d\'abord un membre' : 'Aucun membre enregistré');
  const d = id ? S.dons[id] : { date: today(), devise: 'XOF', taux: 1, mode: 'Wave' };
  modal(`<h2>${id ? 'Modifier le don ' + esc(d.recu) : 'Nouveau don'}</h2><div class="f">
    <div class="full"><label>Membre (code) *</label><select id="d_code" onchange="majGroupe()"><option value="">— Choisir —</option>${membresOptions(d.code)}</select></div>
    <div><label>Groupe (automatique)</label><input id="d_grp" readonly value="${esc(d.code ? groupeDe((S.membres[d.code] || {}).groupe).nom : '')}"></div>
    <div><label>Date *</label><input id="d_date" type="date" value="${d.date}"></div>
    <div><label>Montant (devise d'origine) *</label><input id="d_mt" inputmode="decimal" value="${esc(d.montant ?? '')}" oninput="majFcfa()"></div>
    <div><label>Devise</label><select id="d_dev" onchange="majTaux()">${opts(Object.entries(DEVISES).map(([k, v]) => [k, k + ' — ' + v[0]]), d.devise)}</select></div>
    <div><label>Taux (1 unité = … F CFA)</label><input id="d_tx" inputmode="decimal" value="${esc(d.taux ?? 1)}" oninput="majFcfa()"></div>
    <div><label>Montant en FCFA</label><input id="d_fcfa" readonly value="${esc(d.fcfa ? F(d.fcfa) : '')}"></div>
    <div><label>Mode de paiement</label><select id="d_mode">${opts(MODES, d.mode)}</select></div>
    <div><label>Référence de la transaction</label><input id="d_ref" value="${esc(d.ref || '')}"></div>
    <div class="full"><label>Objet / campagne</label><input id="d_obj" list="camps" value="${esc(d.objet || '')}" placeholder="ex. Cotisation annuelle 2026"><datalist id="camps">${campagnes().map(c => `<option value="${esc(c)}">`).join('')}</datalist></div></div>
    <div class="act"><button class="btn" onclick="closeModal()">Annuler</button><button class="btn p" id="d_ok" onclick="saveDon('${id || ''}')">Enregistrer</button></div>`);
  if (!id) majTaux(); else majFcfa();
}
function dernierTaux(dev){ const L = vals(S.dons).filter(x => x.devise === dev && num(x.taux)).sort((a, b) => b.date.localeCompare(a.date)); return L.length ? num(L[0].taux) : DEVISES[dev][1]; }
function majTaux(){ const dev = val('d_dev'); $('#d_tx').value = dernierTaux(dev) || ''; $('#d_tx').readOnly = dev === 'XOF' || dev === 'XAF'; majFcfa(); }
function majFcfa(){ const v = num(val('d_mt')) * num(val('d_tx')); $('#d_fcfa').value = v ? F(v) : ''; }
function majGroupe(){ const m = S.membres[val('d_code')]; $('#d_grp').value = m ? groupeDe(m.groupe).nom : ''; }
async function saveDon(id){
  const code = val('d_code'), m = S.membres[code], montant = num(val('d_mt')), taux = num(val('d_tx')), dev = val('d_dev');
  if (!m) return toast('Choisissez le membre'); if (montant <= 0) return toast('Montant invalide'); if (taux <= 0) return toast('Indiquez le taux de conversion');
  const champs = { code, groupe: m.groupe || '', date: val('d_date') || today(), montant, devise: dev, taux, fcfa: Math.round(montant * taux), mode: val('d_mode'), ref: val('d_ref'), objet: val('d_obj') };
  $('#d_ok').disabled = true;
  try {
    if (id){
      const avant = S.dons[id], apres = Object.assign({}, avant, champs, { modifie: Date.now(), modifPar: AUTH.uid, modifNom: ME.nom });
      await ref('dons/' + id).set(apres); journal('Modification d\'un don', 'don ' + avant.recu, avant, apres);
    } else {
      const n = await compteur('recu'), k = ref('dons').push().key;
      const don = Object.assign({ id: k, recu: 'R-' + String(n).padStart(5, '0'), cree: Date.now(), saisiPar: AUTH.uid, saisiNom: ME.nom }, champs);
      await ref('dons/' + k).set(don); journal('Enregistrement d\'un don', 'don ' + don.recu, null, don);
      toast('Don ' + don.recu + ' enregistré : ' + FCFA(don.fcfa));
    }
    closeModal();
  } catch(e){ $('#d_ok').disabled = false; toast('Refusé : ' + (e.code || e.message)); }
}
function supprDon(id){
  const d = S.dons[id];
  modal(`<h2>Supprimer le don ${esc(d.recu)}</h2><p class="small">Le don sort des totaux mais reste visible (barré) dans l'historique et le journal.</p><div class="f"><div class="full"><label>Motif obligatoire *</label><textarea id="s_m"></textarea></div></div>
  <div class="act"><button class="btn" onclick="closeModal()">Annuler</button><button class="btn d" onclick="confSuppr('${id}')">Supprimer</button></div>`);
}
async function confSuppr(id){
  const motif = val('s_m'); if (motif.length < 5) return toast('Motif obligatoire (5 caractères min.)');
  const avant = S.dons[id], apres = Object.assign({}, avant, { supprime: true, motif, supprPar: AUTH.uid, supprNom: ME.nom, supprLe: Date.now() });
  try { await ref('dons/' + id).set(apres); journal('Suppression d\'un don', 'don ' + avant.recu, avant, apres); closeModal(); toast('Don supprimé'); } catch(e){ toast('Refusé : ' + (e.code || e.message)); }
}

/* ----- membres ----- */

};

  <div class="grid g3" style="margin-bottom:12px"><div class="card"><h3><span class="code">${esc(code)}</span></h3><div class="small">${can('noms') ? `<b>${esc(nomDe(code))}</b><br>${esc(p.tel || '')} ${esc(p.email || '')}<br>` : ''}Pays : ${esc(m.pays || '—')}<br>Groupe : ${esc(groupeDe(m.groupe).nom)}<br>Adhésion : ${dfr(m.adhesion) || '—'}<br><span class="tag ${m.statut === 'inactif' ? '' : 'g'}">${m.statut === 'inactif' ? 'Inactif' : 'Actif'}</span></div></div>
    <div class="card kpi dark"><div class="l">Total donné</div><div class="v">${FCFA(tot)}</div></div><div class="card kpi"><div class="l">Nombre de dons</div><div class="v">${D.filter(d => !d.supprime).length}</div></div></div>
  <div class="card"><h3>Dons</h3>${tbl([['Date'],['Reçu'],['Origine','n'],['FCFA','n'],['Mode'],['Objet']], D.map(d => `<tr class="click ${d.supprime ? 'del' : ''}" onclick="ficheDon('${d.id}')"><td>${dfr(d.date)}</td><td>${esc(d.recu)}</td><td class="n">${F2(d.montant)} ${esc(d.devise)}</td><td class="n b">${FCFA(d.fcfa)}</td><td>${esc(d.mode)}</td><td>${esc(d.objet || '')}</td></tr>`), 'Aucun don.')}</div>`;
};
function editMembre(code){
  if (!Object.keys(S.groupes).length) return toast('Créez d\'abord un groupe');
  const m = code ? S.membres[code] : { statut: 'actif', adhesion: today() }, p = code ? (S.prive[code] || {}) : {};
  modal(`<h2>${code ? 'Membre ' + esc(code) : 'Nouveau membre'}</h2>${code ? '' : '<p class="small muted">Le code donateur (D-0001, D-0002…) est attribué automatiquement et ne sera jamais réutilisé.</p>'}<div class="f">

const N = can => can ? ['Nom'] : [];
function exportDons(){
  const n = can('noms'), L = vals(S.dons).sort((a, b) => a.date.localeCompare(b.date));
  csv('dons', [['Reçu','Date','Code', ...N(n), 'Groupe','Pays','Montant origine','Devise','Taux','Montant FCFA','Mode','Référence','Objet','Saisi par','Supprimé','Motif'],
    ...L.map(d => [d.recu, dfr(d.date), d.code, ...(n ? [nomDe(d.code)] : []), groupeDe(d.groupe).nom, (S.membres[d.code] || {}).pays, d.montant, d.devise, d.taux, d.fcfa, d.mode, d.ref, d.objet, d.saisiNom, d.supprime ? 'oui' : '', d.motif || ''])]);
}
function exportRapport(){
  const n = can('noms'), L = donsFiltres();
  if (RT === 'membres') csv('rapport_membres', [['Code', ...N(n), 'Groupe','Nombre de dons','Dernier don','Total FCFA'], ...parMembre(L).map(m => [m.code, ...(n ? [nomDe(m.code)] : []), groupeDe(m.groupe).nom, m.nb, dfr(m.dernier), m.total])]);
  else csv('rapport_groupes', [['Rang','Groupe','Pays','Dons','Cotisants','Total FCFA'], ...parGroupe(L).map((g, i) => [i + 1, groupeDe(g.id).nom, groupeDe(g.id).pays, g.nb, g.codes.size, g.total])]);
}
function exportJournal(){ csv('journal', [['Date','Qui','Rôle','Action','Cible','Avant','Après'], ...S.journal.map(j => [dtfr(j.t), j.qui, ROLES[j.role] || j.role, j.action, j.cible, JSON.stringify(j.avant || ''), JSON.stringify(j.apres || '')])]); }
