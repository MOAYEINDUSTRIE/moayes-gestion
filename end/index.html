/* Œil : afficher / masquer les mots de passe et codes (tous les champs, y compris ceux créés plus tard) */
(function(){
  const css = document.createElement('style');
  css.textContent = '.oeil-w{position:relative;display:block}.oeil-w>input{padding-right:46px!important}.oeil{position:absolute;right:4px;top:50%;transform:translateY(-50%);width:40px;height:40px;border:0;background:transparent;cursor:pointer;display:flex;align-items:center;justify-content:center;color:#667085;padding:0;margin:0;box-shadow:none}.oeil:hover{color:#1d2b4f}.oeil svg{width:22px;height:22px}@media print{.oeil{display:none}}';
  document.head.appendChild(css);
  const OUVERT = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>';
  const FERME = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94"/><path d="M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19"/><path d="M14.12 14.12a3 3 0 1 1-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/></svg>';
  window.OEIL = { OUVERT, FERME };
  function equiper(inp){
    if (inp.dataset.oeil) return; inp.dataset.oeil = '1';
    const w = document.createElement('span'); w.className = 'oeil-w';
    const cs = getComputedStyle(inp); if (cs.display === 'inline-block' || cs.marginLeft === cs.marginRight && cs.marginLeft !== '0px') { w.style.width = inp.offsetWidth ? inp.offsetWidth + 'px' : ''; w.style.margin = '0 auto'; }
    inp.parentNode.insertBefore(w, inp); w.appendChild(inp);
    const b = document.createElement('button'); b.type = 'button'; b.className = 'oeil'; b.tabIndex = -1;
    b.setAttribute('aria-label', 'Afficher le mot de passe'); b.title = 'Afficher'; b.innerHTML = OUVERT;
    b.addEventListener('mousedown', e => e.preventDefault());
    b.addEventListener('click', e => { e.preventDefault(); e.stopPropagation(); const voir = inp.type === 'password'; inp.type = voir ? 'text' : 'password'; b.innerHTML = voir ? FERME : OUVERT; b.title = voir ? 'Masquer' : 'Afficher'; b.setAttribute('aria-label', voir ? 'Masquer le mot de passe' : 'Afficher le mot de passe'); inp.focus(); });
    w.appendChild(b);
  }
  const scan = () => document.querySelectorAll('input[type=password]:not([data-oeil])').forEach(equiper);
  new MutationObserver(scan).observe(document.documentElement, { childList: true, subtree: true }); scan();
})();
</script>

const today = () => new Date().toISOString().slice(0,10);
const dfr = d => d ? d.split('-').reverse().join('/') : '';
const dtfr = t => t ? new Date(t).toLocaleString('fr-FR', { dateStyle:'short', timeStyle:'short' }) : '';
const vals = o => Object.values(o || {});
function toast(t){ document.querySelectorAll('.toast').forEach(x => x.remove()); const d = document.createElement('div'); d.className = 'toast'; d.textContent = t; document.body.appendChild(d); setTimeout(() => d.remove(), 2800); }
function enLettres(n){
  n = Math.round(Math.abs(num(n))); if (n === 0) return 'zéro';
  const U = ['','un','deux','trois','quatre','cinq','six','sept','huit','neuf','dix','onze','douze','treize','quatorze','quinze','seize','dix-sept','dix-huit','dix-neuf'];
  const D = ['','dix','vingt','trente','quarante','cinquante','soixante','soixante','quatre-vingt','quatre-vingt'];
  const cent = x => { let s = ''; const c = Math.floor(x/100), r = x % 100;
    if (c) s = (c > 1 ? U[c] + ' cent' + (r === 0 ? 's' : '') : 'cent');
    if (r){ let t; if (r < 20) t = U[r]; else { const d = Math.floor(r/10), u = r % 10;
      if (d === 7 || d === 9) t = D[d] + (d === 7 && u === 1 ? ' et ' : '-') + U[10+u];
      else t = D[d] + (u === 1 && d !== 8 ? ' et un' : u ? '-' + U[u] : (d === 8 ? 's' : '')); }
      s += (s ? ' ' : '') + t; }
    return s; };
  let s = '', rest = n;
  for (const [v, w] of [[1e9,'milliard'],[1e6,'million'],[1e3,'mille']]){ const q = Math.floor(rest / v); rest %= v; if (!q) continue;
    if (w === 'mille') s += (q === 1 ? 'mille' : cent(q).replace(/(cent|vingt)s$/,'$1') + ' mille') + ' ';
    else s += cent(q) + ' ' + w + (q > 1 ? 's' : '') + ' '; }
  if (rest) s += cent(rest);
  return s.trim();
}

/* ---------- journal (ne peut pas être effacé : règle Firebase « ajout seulement ») ---------- */
function journal(action, cible, avant, apres){
  const clean = o => o == null ? null : JSON.parse(JSON.stringify(o));
  return ref('journal').push({ t: Date.now(), uid: AUTH.uid, qui: ME.nom || AUTH.email, role: ME.role, action, cible, avant: clean(avant), apres: clean(apres) }).catch(e => console.warn('journal', e));
}
async function compteur(nom){
  const r = await ref('compteurs/' + nom).transaction(v => (v || 0) + 1);
  if (!r.committed) throw new Error('compteur');
  return r.snapshot.val();
}

/* ---------- Firebase ---------- */
function fbInit(){
  if (typeof firebase === 'undefined'){ $('#root').innerHTML = `<div class="login"><div class="box"><h3>Pas de connexion</h3><p>Impossible de charger le service. Vérifiez internet puis rouvrez l'application.</p><button class="btn p" onclick="location.reload()">Réessayer</button></div></div>`; return; }
  firebase.apps.length || firebase.initializeApp(FB_CFG);
  DB = firebase.database();
  DB.ref('.info/connected').on('value', s => { ONLINE = s.val() !== false; const el = $('#netpill'); if (el){ el.className = 'pill ' + (ONLINE ? 'g' : 'w'); el.textContent = ONLINE ? '● En ligne' : '● Hors ligne'; } });
  firebase.auth().onAuthStateChanged(async u => {
    stopListeners(); AUTH = u; ME = null;
    if (!u){ renderLogin(); return; }
    try {
      let snap = await DB.ref(ROOT + '/roles/' + u.uid).once('value'), r = snap.val();
      if (!r && (u.email || '').toLowerCase() === ADMIN_EMAIL){
        r = { role:'admin', nom:'Moaye (administrateur)', email:u.email, actif:true, cree:Date.now() };
        await DB.ref(ROOT + '/roles/' + u.uid).set(r);
      }
      if (!r || !r.actif){ renderBlocked(r ? 'Votre compte a été désactivé par l\'administrateur.' : 'Ce compte n\'a pas encore de rôle. Demandez à l\'administrateur de vous l\'attribuer.'); return; }
      ME = r; startListeners(); render();
    } catch(e){ renderBlocked('Accès refusé par la base de données. L\'administrateur doit installer les règles de sécurité (voir le guide).<br><span class="small muted">' + esc(e.code || e.message) + '</span>'); }
  });
}
function listen(path, fn, q){
  const r = q ? q(ref(path)) : ref(path);
  const cb = r.on('value', s => { fn(s.val()); S.ready[path] = true; scheduleRender(); }, e => console.warn(path, e));
  LISTENERS.push(() => r.off('value', cb));
}
function stopListeners(){ LISTENERS.forEach(f => { try { f(); } catch(e){} }); LISTENERS = []; for (const k of ['membres','prive','groupes','dons','users','decs','decPrive','transferts','treso']) S[k] = {}; S.journal = []; S.ready = {}; }
function startListeners(){
  listen('membres', v => S.membres = v || {});
  listen('groupes', v => S.groupes = v || {});
  listen('dons', v => S.dons = v || {});
  listen('decaissements', v => S.decs = v || {});
  listen('transferts', v => S.transferts = v || {});
  listen('tresorerie', v => S.treso = v || {});
  if (can('noms')) listen('decPrive', v => S.decPrive = v || {});
  if (can('noms')) listen('prive', v => S.prive = v || {});
  if (can('journal')) listen('journal', v => S.journal = vals(v).sort((a, b) => b.t - a.t), r => r.orderByChild('t').limitToLast(1500));
  if (can('users')) listen('roles', v => S.users = v || {});
}
let rT = null; function scheduleRender(){ clearTimeout(rT); rT = setTimeout(() => { if (!$('.modal-bg')) render(); }, 60); }

const authErr = e => ({ 'auth/invalid-credential':'E-mail ou mot de passe incorrect.', 'auth/wrong-password':'Mot de passe incorrect.', 'auth/user-not-found':'Aucun compte avec cet e-mail.', 'auth/invalid-email':'E-mail invalide.', 'auth/too-many-requests':'Trop d\'essais. Patientez quelques minutes.', 'auth/network-request-failed':'Pas de connexion internet.', 'auth/email-already-in-use':'Cet e-mail a déjà un compte.', 'auth/weak-password':'Mot de passe trop court (8 caractères minimum).', 'auth/operation-not-allowed':'La connexion par e-mail n\'est pas activée dans Firebase (voir le guide, étape 1).', 'auth/requires-recent-login':'Par sécurité, reconnectez-vous puis recommencez.' }[e && e.code] || ('Erreur : ' + (e && (e.code || e.message))));
async function login(){
  const e = $('#l_e').value.trim(), p = $('#l_p').value;

}

/* liste compacte sur téléphone : ligne 1 = nom + montant, ligne 2 = détails */
const TITRES = ['Nom','Membre','Acheteur','Bénéficiaire','Groupe','Libellé','Objet','Livre','Compte','Utilisateur','Action','Catégorie','Code','Reçu','Date'];
function lignesMobiles(root){
  root.querySelectorAll('table.resp').forEach(t => {
    const h = [...t.querySelectorAll('thead th')].map(x => x.textContent.trim());
    let ti = -1; for (const n of TITRES){ ti = h.findIndex(x => x === n || x.startsWith(n + ' ')); if (ti >= 0) break; } if (ti < 0) ti = 0;
    let ai = -1; h.forEach((x, i) => { if (/montant|total|solde|fcfa|entr|sortie/i.test(x) && i !== ti) ai = i; });
    t.querySelectorAll('tbody tr').forEach(tr => [...tr.children].forEach((td, i) => { td.setAttribute('data-l', h[i] || ''); td.classList.add(i === ti ? 'm-t' : i === ai ? 'm-a' : 'm-d'); if (/^(N°|#|Rang)$/.test(h[i])) td.classList.add('m-no'); }));
  });
}

const pays = () => [...new Set([...vals(S.membres).map(m => m.pays), ...vals(S.groupes).map(g => g.pays)].filter(Boolean))].sort();

function filtresHTML(){
  return `<div class="bar no-print"><input type="date" value="${FL.d1}" onchange="FL.d1=this.value;render()" title="Du"><input type="date" value="${FL.d2}" onchange="FL.d2=this.value;render()" title="Au">

function donsFiltres(){
  return donsActifs().filter(d => (!FL.d1 || d.date >= FL.d1) && (!FL.d2 || d.date <= FL.d2) && grpOk(d.groupe) && (!FL.camp || d.objet === FL.camp)
    && (!FL.pays || ((S.membres[d.code] || {}).pays || groupeDe(d.groupe).pays) === FL.pays));
}
function parGroupe(L){
  const o = {};
  for (const d of L){ const g = o[d.groupe] || (o[d.groupe] = { id: d.groupe, total: 0, nb: 0, codes: new Set() }); g.total += num(d.fcfa); g.nb++; g.codes.add(d.code); }
  return Object.values(o).sort((a, b) => b.total - a.total);
}
function parMembre(L){
  const o = {};
  for (const d of L){ const m = o[d.code] || (o[d.code] = { code: d.code, groupe: d.groupe, total: 0, nb: 0, dernier: '' }); m.total += num(d.fcfa); m.nb++; if (d.date > m.dernier) m.dernier = d.date; }
  return Object.values(o).sort((a, b) => b.total - a.total);
}

  return `${filtresHTML()}<div class="bar"><input class="grow" placeholder="🔍 Code, ${can('noms') ? 'nom, ' : ''}reçu, référence" value="${esc(DQ)}" oninput="DQ=this.value;clearTimeout(window._dq);window._dq=setTimeout(()=>{render();const i=document.querySelector('.bar .grow');i.focus();i.setSelectionRange(i.value.length,i.value.length)},300)">

/* ----- caisse & trésorerie ----- */
const COMPTES = { caisse:'Caisse (espèces)', banque:'Banque', wave:'Wave', orange:'Orange Money', mtn:'MTN Mobile Money', moov:'Moov Money' };
const CAT_DEC = ['Fonctionnement','Activités et événements','Aide sociale','Transport et missions','Communication','Matériel et fournitures','Loyer et charges','Frais bancaires et de transfert','Honoraires et prestations','Autre'];
function compteParMode(m){ return ({ 'Wave':'wave', 'Orange Money':'orange', 'MTN Mobile Money':'mtn', 'Moov Money':'moov', 'Virement bancaire':'banque', 'Chèque':'banque' })[m] || 'caisse'; }
const compteDon = d => d.compte || compteParMode(d.mode);
const decsActifs = () => vals(S.decs).filter(x => !x.supprime);
const decsFiltres = () => decsActifs().filter(x => (!FL.d1 || x.date >= FL.d1) && (!FL.d2 || x.date <= FL.d2) && (!FL.camp || x.objet === FL.camp));
const benefDe = id => (S.decPrive[id] || {}).beneficiaire || '';
function mouvements(){
  const t = S.treso || {}, deb = t.debut || '0000-00-00', L = [];
  donsActifs().filter(d => d.date >= deb).forEach(d => L.push({ date: d.date, cpt: compteDon(d), m: num(d.fcfa), lib: 'Don ' + d.recu + ' — ' + d.code, ref: d.recu, type: 'don', id: d.id, t: d.cree || 0 }));
  decsActifs().filter(x => x.date >= deb).forEach(x => L.push({ date: x.date, cpt: x.compte, m: -num(x.montant), lib: 'Décaissement ' + x.num + ' — ' + (x.categorie || '') + (x.objet ? ' — ' + x.objet : ''), ref: x.num, type: 'dec', id: x.id, t: x.cree || 0 }));
  vals(S.transferts).filter(x => !x.supprime && x.date >= deb).forEach(x => { L.push({ date: x.date, cpt: x.de, m: -num(x.montant), lib: 'Transfert ' + x.num + ' vers ' + COMPTES[x.vers], ref: x.num, type: 'tr', id: x.id, t: x.cree || 0 }); L.push({ date: x.date, cpt: x.vers, m: num(x.montant), lib: 'Transfert ' + x.num + ' depuis ' + COMPTES[x.de], ref: x.num, type: 'tr', id: x.id, t: (x.cree || 0) + 1 }); });
  return L.sort((a, b) => a.date.localeCompare(b.date) || a.t - b.t || a.ref.localeCompare(b.ref));
}
function soldes(){
  const t = S.treso || {}, r = { total: 0 };
  for (const k in COMPTES) r[k] = num((t.soldes || {})[k]);
  mouvements().forEach(x => r[x.cpt] = (r[x.cpt] || 0) + x.m);
  for (const k in COMPTES) r.total += r[k];
  return r;
}
let TC = '';
VIEWS.tresorerie = () => {
  const T = soldes(), t = S.treso || {};
  let L = mouvements(); if (TC) L = L.filter(x => x.cpt === TC);
  const init = TC ? num((t.soldes || {})[TC]) : Object.keys(COMPTES).reduce((s, k) => s + num((t.soldes || {})[k]), 0);
  let run = init; const rows = L.map(x => { run += x.m; return { ...x, run }; }).filter(x => (!FL.d1 || x.date >= FL.d1) && (!FL.d2 || x.date <= FL.d2)).reverse();

/* ----- import Excel (registre des membres) ----- */
function chargerXLSX(){
  if (window.XLSX) return Promise.resolve();
  return new Promise((ok, ko) => { const sc = document.createElement('script'); sc.src = 'https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js'; sc.onload = ok; sc.onerror = () => ko(new Error('Lecteur Excel indisponible (internet ?)')); document.head.appendChild(sc); });
}
const normTxt = s => String(s ?? '').normalize('NFD').replace(/[\u0300-\u036f]/g, '').toLowerCase().replace(/\s+/g, ' ').trim();
function isoDate(v){
  if (!v) return '';
  if (v instanceof Date && !isNaN(v)) return new Date(v.getTime() - v.getTimezoneOffset() * 60000 + 12 * 3600000).toISOString().slice(0, 10);
  if (typeof v === 'number') return new Date(Math.round((v - 25569) * 86400000) + 12 * 3600000).toISOString().slice(0, 10);
  const t = String(v).trim(), m = t.match(/^(\d{1,2})[\/.-](\d{1,2})[\/.-](\d{4})/); if (m) return `${m[3]}-${m[2].padStart(2, '0')}-${m[1].padStart(2, '0')}`;
  return /^\d{4}-\d{2}-\d{2}/.test(t) ? t.slice(0, 10) : '';
}
async function lireLignes(file){
  if (/\.json$/i.test(file.name)) { const j = JSON.parse(await file.text()); return Array.isArray(j) ? j : (j.membres || []); }
  await chargerXLSX();
  const wb = XLSX.read(await file.arrayBuffer(), { type: 'array', cellDates: true });
  const out = [];
  for (const name of wb.SheetNames){
    const rows = XLSX.utils.sheet_to_json(wb.Sheets[name], { header: 1, raw: true, defval: '' });
    const hi = rows.findIndex(r => r.some(c => /identit|nom/i.test(String(c))) && r.some(c => /pays/i.test(String(c))));
    if (hi < 0) continue;
    const H = rows[hi].map(c => normTxt(c)), col = re => H.findIndex(h => re.test(h));
    const c = { ident: col(/identifiant|^id$|matricule/), nom: col(/identite|^nom/), prenoms: col(/^prenom/), pays: col(/^pays/), ville: col(/^ville/), tel: col(/telephone|whatsapp|tel/), email: col(/mail|electronique/), groupe: col(/^groupe/), date: col(/date/), statut: col(/statut/) };
    for (const r of rows.slice(hi + 1)){
      const g = k => c[k] >= 0 ? r[c[k]] : '';
      const nom = String(g('nom')).replace(/\s+/g, ' ').trim(); if (!nom) continue;
      out.push({ ident: String(g('ident')).trim(), nom, prenoms: String(g('prenoms')).trim(), pays: String(g('pays')).trim(), ville: String(g('ville')).trim(), tel: String(g('tel')).trim(), email: String(g('email')).trim().toLowerCase(), groupe: String(g('groupe')).trim() || name, adhesion: isoDate(g('date')), statut: /inactif|abandon|exclu|suspendu|radi/i.test(String(g('statut'))) ? 'inactif' : 'actif' });
    }
  }
  return out;
}
let IMPORT = null;
async function importerFichiers(files){
  if (!files || !files.length) return;
  try {
    let L = []; for (const f of files) L = L.concat(await lireLignes(f));
    if (!L.length) return toast('Aucune ligne reconnue (colonnes « Identité » et « Pays » attendues)');
    const deja = new Set(), dejaMail = new Set();
    vals(S.prive).forEach(p => { if (p.ident) deja.add(normTxt(p.ident)); if (p.email) dejaMail.add(normTxt(p.email)); });
    const vus = new Set();
    L.forEach(x => { const k = normTxt(x.ident) || ('@' + normTxt(x.email)) || normTxt(x.nom); x.existe = (x.ident && deja.has(normTxt(x.ident))) || (!x.ident && x.email && dejaMail.has(normTxt(x.email))); x.doublon = vus.has(k); vus.add(k); });
    const nouveaux = L.filter(x => !x.existe && !x.doublon), parG = {};
    nouveaux.forEach(x => parG[x.groupe] = (parG[x.groupe] || 0) + 1);
    const gExist = new Set(vals(S.groupes).map(g => normTxt(g.nom)));
    IMPORT = nouveaux;
    modal(`<h2>Importer des membres</h2><p class="small">${L.length} ligne(s) lue(s) dans ${files.length} fichier(s).</p>
      <table>${Object.entries(parG).map(([g, n]) => `<tr><td><b>${esc(g)}</b> ${gExist.has(normTxt(g)) ? '' : '<span class="tag b">groupe créé</span>'}</td><td class="n">${n} nouveau(x)</td></tr>`).join('')}</table>
      ${L.filter(x => x.existe).length ? `<p class="small muted">${L.filter(x => x.existe).length} déjà enregistré(s) : ignoré(s).</p>` : ''}${L.filter(x => x.doublon).length ? `<p class="small muted">${L.filter(x => x.doublon).length} doublon(s) dans les fichiers : ignoré(s).</p>` : ''}
      <p class="small">Chaque membre reçoit un code donateur (D-0001…). Nom, téléphone, e-mail, ville et identifiant END sont rangés dans la partie protégée, invisible pour le Grand Maître.</p>

  }
  return `${filtresHTML()}<div class="bar no-print">${tabs}<span class="grow"></span><button class="btn" onclick="exportRapport()">⬇ Excel</button><button class="btn" onclick="imprimer()">🖨 Imprimer / PDF</button></div>

function nomFichier(t){ return String(t || 'END').replace(/[\\/:*?"<>|]+/g, '-').replace(/\s+/g, ' ').trim(); }
function cssPortee(css){ // limite les règles d'impression à la zone #zi
  return css.replace(/(^|})\s*([^{}@]+)\{/g, (m, b, sel) => b + sel.split(',').map(x => { x = x.trim(); return x === 'body' || x === '*' ? '#zi' + (x === '*' ? ' *' : '') : '#zi ' + x; }).join(',') + '{');
}
function ouvrirImpression(html, titre){
  titre = nomFichier(titre);
  if (window.AndroidBridge && AndroidBridge.printHtml){ AndroidBridge.printHtml(html.replace(/<title>[^<]*<\/title>/, '<title>' + esc(titre) + '</title>'), titre); return; }
  const d = new DOMParser().parseFromString(html, 'text/html');
  const css = [...d.querySelectorAll('style')].map(x => x.textContent).join('\n');
  const pages = (css.match(/@page\s*\{[^}]*\}/g) || []).join('');
  let z = document.getElementById('zi'); if (z){ z.remove(); document.title = z.dataset.ancien || document.title; }
  z = document.createElement('div'); z.id = 'zi';
  z.innerHTML = `<style>${pages}@media screen{#zi{display:none}}@media print{body.impr>*:not(#zi){display:none!important}body.impr{background:#fff!important;margin:0;padding:0}#zi{display:block;width:100%;max-width:none}#zi th{text-transform:none;letter-spacing:0;font-size:10.5px}#zi .card,#zi .grid{width:auto;max-width:none}#zi table{display:table;width:100%}#zi thead{display:table-header-group}#zi tr{display:table-row}#zi td,#zi th{display:table-cell}}${cssPortee(css.replace(/@page\s*\{[^}]*\}/g, ''))}</style>` + d.body.innerHTML;
  document.body.appendChild(z); document.body.classList.add('impr');
  const ancien = document.title; z.dataset.ancien = ancien; document.title = titre;
  let fait = false;
  const fin = () => { if (fait) return; fait = true; window.removeEventListener('afterprint', fin); if (!z.isConnected) return; z.remove(); document.body.classList.remove('impr'); document.title = ancien; };
  window.addEventListener('afterprint', fin);
  setTimeout(() => { window.print(); setTimeout(fin, 1500); }, 300);
}

function titreImpression(){
  const page = (document.querySelector('main .top h1') || {}).textContent || 'END';
  const grp = FL.groupe ? (FL.groupe === '-' ? 'Hors groupe' : groupeDe(FL.groupe).nom) : '';
  let t;
  if (VIEW === 'groupe') t = (!ARG || ARG === '-') ? 'Hors groupe' : groupeDe(ARG).nom;
  else if (VIEW === 'rapports') t = RT === 'groupes' ? (grp || 'Rapport par groupe') : RT === 'membres' ? (grp ? 'Membres ' + grp : 'Rapport par membre') : RT === 'objet' ? 'Paiements ' + (objetChoisi() || '') + (grp ? ' ' + grp : '') : 'Rapport général' + (grp ? ' ' + grp : '');
  else if (VIEW === 'livres') t = ({ tous: 'Livres - tous les acheteurs', ligne: 'Livres achetés en ligne', physique: 'Livres achetés physiquement', np: 'Livres format non précisé' })[LVF] + (grp ? ' ' + grp : '');
  else t = page + (grp ? ' ' + grp : '');
  if (VIEW !== 'groupe' && FL.pays) t += ' ' + FL.pays;
  if (FL.camp && !(VIEW === 'rapports' && RT === 'objet')) t += ' ' + FL.camp;
  if (FL.d1 || FL.d2) t += ' du ' + (FL.d1 ? dfr(FL.d1) : 'début') + ' au ' + (FL.d2 ? dfr(FL.d2) : dfr(today()));

function imprimer(){
  const m = document.querySelector('main.main'); if (!m) return;
  const c = m.cloneNode(true);
  c.querySelectorAll('.no-print,.bar,.top,.tabbar,button,input,select,script,.toast').forEach(e => e.remove());
  c.querySelectorAll('[onclick]').forEach(e => e.removeAttribute('onclick'));
  c.querySelectorAll('td').forEach(td => td.classList.remove('m-t', 'm-a', 'm-d', 'm-no'));
  c.querySelectorAll('table.resp').forEach(t => t.classList.remove('resp'));
  c.querySelectorAll('td,th').forEach(td => { if (td.textContent.trim().length <= 12) td.style.whiteSpace = 'nowrap'; });
  const large = Math.max(0, ...[...c.querySelectorAll('table')].map(t => (t.rows[0] || { cells: [] }).cells.length)) > 8;
  const titre = titreImpression();
  const f = '';
  const html = `<!DOCTYPE html><html lang="fr"><head><meta charset="utf-8"><title>END — ${esc(titre)}</title><style>${CSS_IMPR}${large ? '@page{size:A4 landscape}' : ''}</style></head><body>
  <div class="ent"><img src="icons/logo.svg" alt=""><div><div class="t">École de Navigation Divine</div><div class="s">Dons des volontaires</div></div></div>
  <h1>${esc(titre)}</h1>${c.innerHTML}
  <div class="pied"><span>Édité le ${new Date().toLocaleDateString('fr-FR')} à ${new Date().toLocaleTimeString('fr-FR', { hour: '2-digit', minute: '2-digit' })} par ${esc(ME.nom || '')} (${esc(ROLES[ME.role] || ME.role)})</span><span>END Dons ${VERSION}</span></div></body></html>`;
  journal('Impression', titre, null, null);
  ouvrirImpression(html, titre);
}

function saveFile(name, mime, text){
  if (window.AndroidBridge && AndroidBridge.saveFile){ AndroidBridge.saveFile(name, mime, btoa(unescape(encodeURIComponent(text)))); return; }
  const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([text], { type: mime })); a.download = name; document.body.appendChild(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 500);
}
function csv(name, rows){
  const q = v => '"' + String(v ?? '').replace(/"/g, '""') + '"';
  saveFile(`END_${name}_${today()}.csv`, 'text/csv', '﻿' + rows.map(r => r.map(q).join(';')).join('\r\n'));
  journal('Export', name, null, null); toast('Fichier Excel prêt');
}
const N = can => can ? ['Nom'] : [];
function exportDons(){
  const n = can('noms'), L = vals(S.dons).sort((a, b) => a.date.localeCompare(b.date));
  csv('dons', [['Reçu','Date','Code', ...N(n), 'Groupe','Pays','Montant origine','Devise','Taux','Montant FCFA','Mode','Référence','Objet','Saisi par','Supprimé','Motif'],
    ...L.map(d => [d.recu, dfr(d.date), d.code, ...(n ? [nomDe(d.code)] : []), groupeDe(d.groupe).nom, (S.membres[d.code] || {}).pays, d.montant, d.devise, d.taux, d.fcfa, d.mode, d.ref, d.objet, d.saisiNom, d.supprime ? 'oui' : '', d.motif || ''])]);
}
function exportRapport(){
  const n = can('noms'), L = donsFiltres();
  if (RT === 'objet'){ const o = objetChoisi(), P = payeursObjet(o).P; csv('paiements_' + (o || 'objet').replace(/[^\w]+/g, '_'), [['Objet : ' + o], ['N°','Code', ...(n ? ['Nom','Téléphone'] : []), 'Groupe','Paiements','Date','Total FCFA'], ...P.map((m, i) => [i + 1, m.code, ...(n ? [nomDe(m.code), (S.prive[m.code] || {}).tel || ''] : []), groupeDe(m.groupe).nom, m.nb, dfr(m.dernier), m.total]), ...(RNP ? [[], ['N\'ont pas encore payé'], ...nonPayeurs(o).map((m, i) => [i + 1, m.code, ...(n ? [nomDe(m.code), (S.prive[m.code] || {}).tel || ''] : []), groupeDe(m.groupe).nom])] : [])]); return; }
  if (RT === 'membres') csv('rapport_membres', [['Code', ...N(n), 'Groupe','Nombre de dons','Dernier don','Total FCFA'], ...parMembre(L).map(m => [m.code, ...(n ? [nomDe(m.code)] : []), groupeDe(m.groupe).nom, m.nb, dfr(m.dernier), m.total])]);
  else csv('rapport_groupes', [['Rang','Groupe','Pays','Dons','Cotisants','Total FCFA'], ...parGroupe(L).map((g, i) => [i + 1, groupeDe(g.id).nom, groupeDe(g.id).pays, g.nb, g.codes.size, g.total])]);
}
function exportJournal(){ csv('journal', [['Date','Qui','Rôle','Action','Cible','Avant','Après'], ...S.journal.map(j => [dtfr(j.t), j.qui, ROLES[j.role] || j.role, j.action, j.cible, JSON.stringify(j.avant || ''), JSON.stringify(j.apres || '')])]); }
