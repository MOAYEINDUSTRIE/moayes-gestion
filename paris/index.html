<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Paris Pro</title>
<meta name="theme-color" content="#14231c">
<meta name="referrer" content="no-referrer">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self' https://api.the-odds-api.com https://raw.githubusercontent.com; base-uri 'none'; form-action 'none'; object-src 'none'">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<style>
:root{--bg:#f3f1ea;--card:#fff;--ink:#16211c;--muted:#6b7570;--line:#e4e1d8;--brand:#1f5c43;--brand2:#e8f1ec;--red:#b42318;--red2:#fdecea;--amber:#9a6200;--amber2:#fff4dc;--green:#167a45;--green2:#e3f5ea}
@media (prefers-color-scheme:dark){:root{--bg:#101613;--card:#18211c;--ink:#e6ece8;--muted:#9aa6a0;--line:#2a3530;--brand:#5fbf93;--brand2:#1d2e26;--red:#ff8a80;--red2:#3a1f1d;--amber:#ffc65c;--amber2:#33290f;--green:#6fdc9f;--green2:#173326}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
header{position:sticky;top:0;z-index:5;background:var(--bg);border-bottom:1px solid var(--line);padding:12px 16px 0}
h1{margin:0;font-size:20px}
.sub{color:var(--muted);font-size:13px}
nav{display:flex;gap:4px;overflow-x:auto;margin-top:10px;scrollbar-width:none}
nav button{border:0;background:none;color:var(--muted);padding:9px 12px;font:600 14px system-ui;border-bottom:3px solid transparent;white-space:nowrap;cursor:pointer}
nav button.on{color:var(--brand);border-color:var(--brand)}
main{max-width:1080px;margin:0 auto;padding:16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:14px}
.card h3{margin:0 0 8px;font-size:16px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:14px}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px}
.kpi b{display:block;font-size:22px}
.kpi span{color:var(--muted);font-size:12px}
.btn{border:1px solid var(--line);background:var(--card);color:var(--ink);padding:8px 12px;border-radius:10px;font:600 14px system-ui;cursor:pointer}
.btn.p{background:var(--brand);border-color:var(--brand);color:#fff}
.btn.sm{padding:5px 9px;font-size:13px}
.btn:disabled{opacity:.5}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
input,select,textarea{width:100%;padding:9px 10px;border:1px solid var(--line);border-radius:10px;background:var(--card);color:var(--ink);font:15px system-ui}
label{display:block;font-size:13px;color:var(--muted);margin:10px 0 4px}
.tw{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:14px}
th{text-align:left;color:var(--muted);font-weight:600;font-size:12px;padding:6px;border-bottom:1px solid var(--line)}
td{padding:7px 6px;border-bottom:1px solid var(--line);vertical-align:top}
td.n,th.n{text-align:right;white-space:nowrap}
.tag{display:inline-block;padding:2px 8px;border-radius:99px;font-size:12px;font-weight:600}
.tag.g{background:var(--green2);color:var(--green)}.tag.r{background:var(--red2);color:var(--red)}.tag.a{background:var(--amber2);color:var(--amber)}.tag.b{background:var(--brand2);color:var(--brand)}
.alert{padding:10px 12px;border-radius:10px;margin-bottom:12px;font-size:14px}
.alert.a{background:var(--amber2);color:var(--amber)}.alert.r{background:var(--red2);color:var(--red)}.alert.g{background:var(--green2);color:var(--green)}.alert.b{background:var(--brand2);color:var(--brand)}
.muted{color:var(--muted)}.small{font-size:13px}
.match{border:1px solid var(--line);border-radius:12px;padding:10px;margin-bottom:10px}
.match.val{border-color:var(--green);box-shadow:0 0 0 1px var(--green) inset}
.odds{display:grid;grid-template-columns:repeat(auto-fit,minmax(95px,1fr));gap:6px;margin-top:8px}
.odd{border:1px solid var(--line);border-radius:10px;padding:6px 8px;cursor:pointer;background:var(--card);text-align:left;color:var(--ink);font:13px system-ui}
.odd b{font-size:16px}
.odd.val{background:var(--green2);border-color:var(--green)}
.rep{white-space:pre-wrap;font-size:13px;max-height:420px;overflow:auto;background:var(--bg);padding:10px;border-radius:10px}
#layer:empty{display:none}
#layer{position:fixed;inset:0;background:rgba(0,0,0,.45);display:flex;align-items:flex-end;justify-content:center;z-index:20}
.md{background:var(--card);width:100%;max-width:520px;max-height:92vh;overflow:auto;border-radius:16px 16px 0 0;padding:16px}
@media(min-width:700px){#layer{align-items:center}.md{border-radius:16px}}
.act{display:flex;gap:8px;justify-content:flex-end;margin-top:14px;flex-wrap:wrap}
#toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:#16211c;color:#fff;padding:9px 14px;border-radius:10px;font-size:14px;z-index:30;display:none}
</style>
</head>
<body>
<header>
  <h1>⚽ Paris Pro</h1>
  <div class="sub">Usage personnel · analyse des cotes, suivi des paris · aucun gain n'est garanti</div>
  <nav id="nav"></nav>
</header>
<main id="app"></main>
<div id="layer"></div>
<div id="toast"></div>
<script>
'use strict';
const VERSION = 'V1.2';
const REPO_RAW = 'https://raw.githubusercontent.com/MOAYEINDUSTRIE/moayes-gestion/registre-paris/';
const ODDS = 'https://api.the-odds-api.com/v4';
const PERIME_MIN = 20;          // au-delà, les cotes sont considérées comme anciennes
const $ = s => document.querySelector(s);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const num = x => { const n = parseFloat(String(x == null ? '' : x).replace(/\s/g, '').replace(',', '.')); return isFinite(n) ? n : 0; };
const F = (n, d = 0) => (isFinite(n) ? Number(n) : 0).toLocaleString('fr-FR', {minimumFractionDigits: d, maximumFractionDigits: d});
const P = x => isFinite(x) && x !== '' ? F(x * 100, 1) + ' %' : '—';
const jour = d => { const x = new Date(d); x.setMinutes(x.getMinutes() - x.getTimezoneOffset()); return x.toISOString().slice(0, 10); };
const today = () => jour(Date.now());
const mois = d => String(d || '').slice(0, 7);
const frDate = d => String(d || '').split('-').reverse().join('/');
function toast(m){ const t = $('#toast'); t.textContent = m; t.style.display = 'block'; clearTimeout(t._h); t._h = setTimeout(() => t.style.display = 'none', 3200); }
function modal(h){ $('#layer').innerHTML = `<div class="md" onclick="event.stopPropagation()">${h}</div>`; }
function closeModal(){ $('#layer').innerHTML = ''; }
$('#layer').onclick = closeModal;
window.addEventListener('error', e => toast('Erreur : ' + (e.message || 'inconnue')));
window.addEventListener('unhandledrejection', e => toast('Erreur : ' + ((e.reason && e.reason.message) || 'inconnue')));

/* ---------- stockage (sur l'appareil uniquement) ---------- */
const KEY = 'paris_pro_v1';
const DEF_CFG = { cle: '', regions: 'eu', ligues: ['soccer_epl', 'soccer_france_ligue_one', 'soccer_spain_la_liga', 'soccer_uefa_champs_league'], budget: 20000, miseMax: 1000, seuil: 0.70, valeurMin: 0.03, bookmaker: '', notif: false, pause: '' };
const ISSUES = ['EN_ATTENTE', 'GAGNÉ', 'PERDU', 'REMBOURSÉ'];
let D, STOCK_OK = true;
function propre(p){   // un pari toujours bien formé, d'où qu'il vienne (ancienne version, fichier restauré)
  if (!p || typeof p !== 'object') return null;
  const cote = num(p.cote), mise = Math.round(num(p.mise));
  if (!(cote > 1) || !(mise > 0) || !p.match) return null;
  let pr = num(p.proba); if (pr > 1) pr /= 100;
  return { id: String(p.id || '').replace(/[^a-z0-9]/gi, '').slice(0, 24) || Date.now().toString(36) + Math.random().toString(36).slice(2, 6), date: /^\d{4}-\d{2}-\d{2}$/.test(p.date) ? p.date : today(), match: String(p.match).slice(0, 120), competition: String(p.competition || '').slice(0, 80), marche: String(p.marche || '').slice(0, 80), cote, mise, proba: pr > 0 && pr <= 1 ? pr : '', source: String(p.source || 'manuel').slice(0, 60), note: String(p.note || '').slice(0, 200), issue: ISSUES.includes(p.issue) ? p.issue : 'EN_ATTENTE', regle: String(p.regle || '') };
}
function load(){
  let x = {}; try { x = JSON.parse(localStorage.getItem(KEY)) || {}; } catch(e){ x = {}; }
  D = { paris: (Array.isArray(x.paris) ? x.paris : []).map(propre).filter(Boolean), cfg: { ...DEF_CFG, ...(x.cfg || {}) }, cache: x.cache && typeof x.cache === 'object' ? x.cache : {} };
  if (!Array.isArray(D.cfg.ligues)) D.cfg.ligues = DEF_CFG.ligues.slice();
}
function save(){ try { localStorage.setItem(KEY, JSON.stringify(D)); STOCK_OK = true; } catch(e){ STOCK_OK = false; toast('⚠️ Enregistrement impossible sur cet appareil (mémoire pleine ou navigation privée)'); } }
load();

/* ---------- navigation ---------- */
const PAGES = [['jour','📅 Aujourd\'hui'], ['cotes','📈 Cotes'], ['paris','📒 Mes paris'], ['bilan','📊 Bilan'], ['params','⚙ Paramètres']];
let PAGE = 'jour', ACT = [];
const act = o => ACT.push(o) - 1;       // les données d'un bouton restent en mémoire, jamais dans le HTML
function go(p){ PAGE = p; render(); scrollTo(0, 0); }
function render(){
  ACT = [];
  $('#nav').innerHTML = PAGES.map(([k, t]) => `<button class="${k === PAGE ? 'on' : ''}" onclick="go('${k}')">${t}</button>`).join('');
  let h; try { h = VIEWS[PAGE](); } catch(e){ h = `<div class="alert r">Cet écran n'a pas pu s'afficher (${esc(e.message)}). Vos paris ne sont pas perdus : ⚙ Paramètres → Télécharger une sauvegarde.</div>`; }
  $('#app').innerHTML = (STOCK_OK ? '' : '<div class="alert r">⚠️ L\'appareil refuse d\'enregistrer : vos saisies seraient perdues à la fermeture. Quittez la navigation privée ou libérez de la mémoire.</div>') + h;
}
const VIEWS = {};

/* ---------- budget et jeu responsable ---------- */
const miseMois = (m = mois(today())) => D.paris.filter(p => mois(p.date) === m && p.issue !== 'REMBOURSÉ').reduce((s, p) => s + p.mise, 0);
const resteBudget = () => (+D.cfg.budget || 0) - miseMois();
const enPause = () => D.cfg.pause && D.cfg.pause > today();
function bandeauBudget(){
  if (enPause()) return `<div class="alert r">⏸ Pause en cours jusqu'au ${frDate(D.cfg.pause)} : aucun pari ne peut être enregistré. C'est vous qui l'avez décidé, tenez bon.</div>`;
  const r = resteBudget(), b = +D.cfg.budget || 0;
  if (!b) return '<div class="alert a">Fixez un budget mensuel dans ⚙ Paramètres : c\'est la règle n° 1 pour ne pas perdre le contrôle.</div>';
  if (r <= 0) return `<div class="alert r">⛔ Budget du mois atteint (${F(b)} F). Arrêtez les paris jusqu'au mois prochain.</div>`;
  if (r < b * 0.25) return `<div class="alert a">⚠️ Il reste ${F(r)} F sur votre budget du mois (${F(b)} F).</div>`;
  return `<div class="alert b">Budget du mois : ${F(miseMois())} F misés sur ${F(b)} F · reste <b>${F(r)} F</b></div>`;
}

/* ---------- agent : registre et rapport du jour ---------- */
let AGENT = null;
function csv(t){   // séparateur « ; », guillemets acceptés
  const rows = []; let row = [], cur = '', q = false;
  t = String(t).replace(/^﻿/, '');
  for (let i = 0; i < t.length; i++){
    const c = t[i];
    if (q){ if (c === '"'){ if (t[i + 1] === '"'){ cur += '"'; i++; } else q = false; } else cur += c; }
    else if (c === '"') q = true;
    else if (c === ';'){ row.push(cur); cur = ''; }
    else if (c === '\n' || c === '\r'){ if (c === '\r' && t[i + 1] === '\n') i++; row.push(cur); cur = ''; if (row.some(x => x.trim())) rows.push(row); row = []; }
    else cur += c;
  }
  row.push(cur); if (row.some(x => x.trim())) rows.push(row);
  const h = (rows.shift() || []).map(x => x.trim());
  return rows.map(v => { const o = {}; h.forEach((k, i) => o[k] = (v[i] || '').trim()); return o; });
}
async function texte(url){ const r = await fetch(url + '?t=' + Date.now(), { cache: 'no-store' }); if (!r.ok) throw new Error('HTTP ' + r.status); return r.text(); }
async function chargerAgent(force){
  if (AGENT && !force) return;
  AGENT = { charge: true, reg: [], sites: [], journal: '', jdate: '' }; if (force) render();
  const A = { reg: [], sites: [], journal: '', jdate: '', maj: Date.now() };
  try {
    A.reg = csv(await texte(REPO_RAW + 'registre.csv')).filter(r => r.match);
    try { A.sites = csv(await texte(REPO_RAW + 'suivi_sites.csv')); } catch(e){}
    for (let i = 0; i < 5 && !A.journal; i++){ const d = jour(Date.now() - i * 864e5); try { A.journal = await texte(REPO_RAW + 'journal/' + d + '.md'); A.jdate = d; } catch(e){} }
    D.cache.agent = A; save(); AGENT = A;
  } catch(e){
    AGENT = D.cache.agent ? { ...D.cache.agent, horsLigne: true } : { reg: [], sites: [], journal: '', jdate: '', err: true };
  }
  render();
}
VIEWS.jour = () => {
  if (!AGENT) chargerAgent();
  const h = bandeauBudget();
  if (!AGENT || AGENT.charge) return h + '<div class="card">Chargement du rapport de l\'agent…</div>';
  const etat = AGENT.err ? '<div class="alert r">Impossible de joindre le registre de l\'agent (pas d\'internet ?). Touchez « Actualiser ».</div>'
    : AGENT.horsLigne ? `<div class="alert a">Hors ligne : affichage des données du ${new Date(AGENT.maj).toLocaleString('fr-FR', {day: '2-digit', month: '2-digit', hour: '2-digit', minute: '2-digit'})}.</div>` : '';
  const sel = AGENT.reg.filter(r => r.date_emission === today());
  const att = AGENT.reg.filter(r => (r.issue || 'EN_ATTENTE') === 'EN_ATTENTE' && r.date_emission !== today());
  const jr = AGENT.jdate === today() ? '' : `<div class="alert a">Le rapport d'aujourd'hui n'est pas encore publié (l'agent passe vers 8 h). Dernier rapport : ${AGENT.jdate ? frDate(AGENT.jdate) : 'aucun'}.</div>`;
  return h + etat + `<div class="card"><div class="row" style="justify-content:space-between"><h3 style="margin:0">Sélections de l'agent — ${frDate(today())}</h3><button class="btn sm" onclick="chargerAgent(true)">↻ Actualiser</button></div>
    <div style="margin-top:10px">${sel.length ? sel.map(carteSel).join('') : (AGENT.jdate === today() ? '<div class="alert b" style="margin:0">Aucun pari recommandé aujourd\'hui. Ne pas parier est aussi une décision gagnante.</div>' : '<div class="alert a" style="margin:0">Pas encore de sélection pour aujourd\'hui.</div>')}</div>
    ${att.length ? `<h3 style="margin-top:14px">En attente de résultat</h3>${att.map(carteSel).join('')}` : ''}</div>
    <div class="card"><h3>Rapport de l'agent ${AGENT.jdate ? '(' + frDate(AGENT.jdate) + ')' : ''}</h3>${jr}<div class="rep">${esc(AGENT.journal || 'Aucun rapport disponible.')}</div></div>`;
};
function carteSel(r){
  const iss = r.issue || 'EN_ATTENTE'; let pr = num(r.proba_estimee); if (pr > 1) pr /= 100;
  const i = act({ match: r.match, competition: r.competition, marche: r.marche, cote: num(r.cote) || '', proba: pr || '', source: 'Agent' });
  return `<div class="match"><div class="row" style="justify-content:space-between"><b>${esc(r.match)}</b><span class="tag ${iss === 'GAGNÉ' ? 'g' : iss === 'PERDU' ? 'r' : 'a'}">${esc(iss)}</span></div>
  <div class="small muted">${esc(r.competition)} · ${esc(r.coup_envoi_local)} ${esc(r.fuseau)}</div>
  <div class="small" style="margin-top:6px"><span class="tag b">${esc(r.marche)}</span> cote <b>${esc(r.cote)}</b> (${esc(r.bookmaker_source_cote)}) · probabilité ${esc(r.proba_estimee)} · confiance ${esc(r.confiance_100)}/100 · valeur ${esc(r.valeur_attendue)}</div>
  <div class="small muted" style="margin-top:4px">${esc(r.methode)}</div>
  ${iss === 'EN_ATTENTE' ? `<div class="act" style="margin-top:8px"><span class="small muted" style="flex:1">Vérifiez la cote chez votre bookmaker : elle a pu changer.</span><button class="btn sm p" onclick="parier(ACT[${i}])">Parier</button></div>` : ''}</div>`;
}

/* ---------- cotes en temps réel (The Odds API) ---------- */
let COTES = null, SPORTS = null;
async function api(path){
  if (!D.cfg.cle) throw new Error('Clé API manquante');
  let r;
  try { r = await fetch(ODDS + path + (path.includes('?') ? '&' : '?') + 'apiKey=' + encodeURIComponent(D.cfg.cle), { cache: 'no-store' }); }
  catch(e){ throw new Error('Pas de connexion internet'); }
  const reste = r.headers.get('x-requests-remaining'); if (reste != null && reste !== ''){ D.cache.restant = reste; save(); }
  if (r.status === 401 || r.status === 403){ let m = ''; try { m = (await r.json()).message || ''; } catch(e){}
    throw new Error('Clé API refusée (' + D.cfg.cle.length + ' caractères, il en faut 32' + (D.cfg.cle.length === 32 ? ' : la longueur est bonne, la clé est peut-être pas encore activée ou mal recopiée' : '') + ')' + (m ? ' — ' + m : '')); }
  if (r.status === 429) throw new Error('Quota de la clé épuisé pour ce mois');
  if (r.status === 404 || r.status === 422) throw new Error('Ligue indisponible');
  if (!r.ok) throw new Error('Service des cotes indisponible (' + r.status + ')');
  const j = await r.json(); if (!Array.isArray(j)) throw new Error('Réponse inattendue du service des cotes');
  return j;
}
async function chargerCotes(){
  if (COTES && COTES.charge) return;
  if (COTES && COTES.ts && Date.now() - COTES.ts < 60000) return toast('Cotes relevées il y a moins d\'une minute');
  const anc = COTES; COTES = { charge: true, matchs: [], errs: [] }; render();
  const fin = new Date(Date.now() + 36 * 3600e3).toISOString().slice(0, 19) + 'Z';
  let ok = 0;
  for (const lg of D.cfg.ligues){
    try {
      const L = await api(`/sports/${encodeURIComponent(lg)}/odds/?regions=${encodeURIComponent(D.cfg.regions)}&markets=h2h,totals&oddsFormat=decimal&dateFormat=iso&commenceTimeTo=${fin}`);
      L.forEach(m => { try { const a = analyser(m); if (a) COTES.matchs.push(a); } catch(e){} }); ok++;
    } catch(e){ if (/Ligue indisponible/.test(e.message)) COTES.errs.push(lg + ' : hors saison ou indisponible'); else { COTES.errs.push(e.message); break; } }
  }
  if (!ok && anc && anc.matchs){ COTES = { ...anc, errs: COTES.errs }; return render(); }   // échec complet : on garde l'ancien relevé
  COTES.matchs.sort((a, b) => a.debut.localeCompare(b.debut));
  COTES.charge = false; COTES.ts = Date.now();
  D.cache.cotes = { ts: COTES.ts, matchs: COTES.matchs }; save();
  notifier(); render();
}
const mediane = a => { const s = a.slice().sort((x, y) => x - y), n = s.length; return n ? (n % 2 ? s[(n - 1) / 2] : (s[n / 2 - 1] + s[n / 2]) / 2) : 0; };
// Probabilité = avis du marché sans marge (moyenne des bookmakers) ; valeur = meilleure cote × probabilité − 1.
// Une cote isolée très au-dessus des autres est presque toujours une erreur ou une cote périmée : elle est écartée.
function analyser(m){
  if (!m || !m.home_team || !m.away_team || !m.commence_time) return null;
  const issues = {};
  const ajout = (k, nom, cote, prob, bk) => { const o = issues[k] || (issues[k] = { nom, probs: [], prix: [] }); o.probs.push(prob); o.prix.push({ c: cote, bk }); };
  (m.bookmakers || []).forEach(b => (b.markets || []).forEach(mk => {
    const out = (mk.outcomes || []).filter(o => o && o.price > 1);
    if (out.length < 2 || (mk.key === 'h2h' && out.length !== 3)) return;
    if (mk.key === 'totals'){
      const pts = {}; out.forEach(o => (pts[o.point] = pts[o.point] || []).push(o));
      Object.values(pts).forEach(g => { if (g.length !== 2) return; const inv = g.reduce((s, o) => s + 1 / o.price, 0); g.forEach(o => ajout('tot:' + o.name + o.point, (o.name === 'Over' ? 'Plus de ' : 'Moins de ') + String(o.point).replace('.', ','), o.price, (1 / o.price) / inv, b.title)); });
    } else if (mk.key === 'h2h'){
      const inv = out.reduce((s, o) => s + 1 / o.price, 0);
      out.forEach(o => ajout('h2h:' + o.name, o.name === m.home_team ? '1 · ' + o.name : o.name === m.away_team ? '2 · ' + o.name : 'X · Nul', o.price, (1 / o.price) / inv, b.title));
    }
  }));
  const L = Object.entries(issues).map(([k, o]) => {
    const p = o.probs.reduce((s, x) => s + x, 0) / o.probs.length, med = mediane(o.prix.map(x => x.c));
    const sains = o.prix.filter(x => x.c <= med * 1.12), top = sains.reduce((a, x) => x.c > a.c ? x : a, { c: 0, bk: '' });
    return { k, nom: o.nom, p, best: top.c, bk: top.bk, n: o.probs.length, val: p * top.c - 1 };
  });
  const g = n => L.find(x => x.k === 'h2h:' + n), h = g(m.home_team), a = g(m.away_team), x = g('Draw');

}
async function testerCle(){
  if (!lireCle()) return toast('Collez d\'abord la clé API');
  try { const L = await api('/sports/'); toast('✅ Clé valide — ' + L.length + ' compétitions disponibles'); } catch(e){ toast('❌ ' + e.message); }
}
function pause(j){
  modal(`<h3>Faire une pause de ${j} jours ?</h3><p class="small">Aucun pari ne pourra être enregistré jusqu'au <b>${frDate(jour(Date.now() + j * 864e5))}</b>. La pause ne peut pas être annulée avant cette date.</p>
    <div class="act"><button class="btn" onclick="closeModal()">Annuler</button><button class="btn p" onclick="D.cfg.pause='${jour(Date.now() + j * 864e5)}';save();closeModal();render()">Confirmer la pause</button></div>`);
}
function enregistrerParams(){
  const c = D.cfg, bk = $('#s_bk').value.trim();
  if (bk && !/^https:\/\/[^\s]+$/i.test(bk)) return toast('L\'adresse du bookmaker doit commencer par https://');
  c.cle = nettoyerCle($('#s_cle').value); c.regions = ['eu', 'uk', 'us', 'au'].includes($('#s_reg').value) ? $('#s_reg').value : 'eu';
  const cb = [...document.querySelectorAll('#s_lig input[type=checkbox]')]; if (cb.length) c.ligues = cb.filter(x => x.checked).map(x => x.value).slice(0, 12);
  c.budget = Math.max(0, Math.round(num($('#s_bud').value))); c.miseMax = Math.max(0, Math.round(num($('#s_max').value)));
  c.seuil = Math.min(.99, Math.max(.5, (num($('#s_seuil').value) || 70) / 100)); c.valeurMin = Math.min(.5, Math.max(0, num($('#s_val').value) / 100));
  c.bookmaker = bk; c.notif = $('#s_notif').checked;
  if (c.notif && 'Notification' in window && Notification.permission === 'default') Notification.requestPermission();
  if (c.notif && 'Notification' in window && Notification.permission === 'denied') toast('Notifications bloquées dans les réglages du téléphone');
  save(); toast('Paramètres enregistrés'); render();
}
function exporter(){
  const { cle, ...cfg } = D.cfg;
  const b = new Blob([JSON.stringify({ application: 'Paris Pro', version: VERSION, date: today(), paris: D.paris, cfg }, null, 1)], { type: 'application/json' });
  const a = document.createElement('a'); a.href = URL.createObjectURL(b); a.download = 'ParisPro_sauvegarde_' + today() + '.json'; document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 5000);
}
async function importer(f){
  if (!f) return;
  if (f.size > 5e6) return toast('Fichier trop gros');
  let x; try { x = JSON.parse(await f.text()); } catch(e){ return toast('Fichier illisible'); }
  if (!x || !Array.isArray(x.paris)) return toast('Ce n\'est pas une sauvegarde Paris Pro');
  const L = x.paris.map(propre).filter(Boolean);
  window._imp = { L, cfg: x.cfg && typeof x.cfg === 'object' ? x.cfg : {} };
  modal(`<h3>Restaurer la sauvegarde ?</h3><p class="small">Le fichier contient <b>${L.length}</b> pari(s)${x.date ? ' (sauvegarde du ' + esc(frDate(x.date)) + ')' : ''}. Ils <b>remplaceront</b> les ${D.paris.length} pari(s) de cet appareil.</p>
    <div class="act"><button class="btn" onclick="closeModal()">Annuler</button><button class="btn p" onclick="restaurer()">Remplacer</button></div>`);
}
function restaurer(){
  const i = window._imp; if (!i) return;
  const { cle, pause, ...c } = i.cfg;                       // on garde la clé et la pause de l'appareil
  D.paris = i.L; D.cfg = { ...DEF_CFG, ...D.cfg, ...c, cle: D.cfg.cle, pause: D.cfg.pause };
  if (!Array.isArray(D.cfg.ligues)) D.cfg.ligues = DEF_CFG.ligues.slice();
  if (!/^https:\/\//i.test(D.cfg.bookmaker || '')) D.cfg.bookmaker = '';
  window._imp = null; save(); closeModal(); toast('Sauvegarde restaurée'); render();
}
if ('serviceWorker' in navigator && location.protocol === 'https:') navigator.serviceWorker.register('sw.js').catch(() => {});
document.addEventListener('visibilitychange', () => { if (!document.hidden && !$('#layer').innerHTML && (PAGE === 'cotes' || PAGE === 'jour')) render(); });   // au retour dans l'application : matchs commencés retirés, âge des cotes à jour
render();
</script>
</body>
