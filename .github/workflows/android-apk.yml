name: Application Android (APK)

on:
  push:
    branches: [main]
    paths:
      - 'android/**'
      - '.github/workflows/android-apk.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apk
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Construire l'APK
        run: |
          echo "sdk.dir=${ANDROID_HOME:-$ANDROID_SDK_ROOT}" > android/local.properties
          yes | "${ANDROID_HOME:-$ANDROID_SDK_ROOT}/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          gradle -p android assembleRelease --no-daemon --stacktrace

      - name: Renommer
        run: cp android/app/build/outputs/apk/release/app-release.apk MOAYES-Gestion.apk

      - uses: actions/upload-artifact@v4
        with:
          name: MOAYES-Gestion-apk
          path: MOAYES-Gestion.apk

      - name: Publier dans « Releases »
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk
          name: Application Android MOAYÉ'S
          make_latest: true
          files: MOAYES-Gestion.apk
          body: |
            Application Android de MOAYÉ'S INDUSTRIE — Gestion Pro.
            Téléchargez MOAYES-Gestion.apk ci-dessous, ouvrez-le sur le téléphone et autorisez l'installation.
            L'application affiche toujours la dernière version publiée : pas besoin de réinstaller après une mise à jour.
