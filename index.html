<style>
:root{
  --bg:#eef2ed; --card:#ffffff; --ink:#18261f; --muted:#64746b; --line:#dde5dd;
  --g9:#173f2f; --g7:#24624a; --g5:#3c8a69; --g1:#e3efe8;
  --ocre:#c8862a; --ocre1:#f7ead4; --red:#b3402e; --red1:#f7e1dc; --blue:#2f5f8a;
  --r:14px; --sh:0 1px 2px rgba(23,63,47,.06),0 4px 14px rgba(23,63,47,.06);
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{background:var(--bg);color:var(--ink);font:15px/1.45 Inter,system-ui,sans-serif;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,.serif{font-family:Fraunces,Georgia,serif;letter-spacing:-.01em}
.app{display:flex;min-height:100vh}
/* Sidebar desktop */
.side{width:232px;background:var(--g9);color:#d8e6de;position:fixed;inset:0 auto 0 0;display:flex;flex-direction:column;padding:18px 12px;z-index:20;overflow-y:auto;scrollbar-width:thin}
.nav .grp{font-size:12px;color:#7fa593;padding:12px 12px 3px;font-weight:600}
@media (max-height:820px){.nav a{padding:6px 12px;font-size:13.5px}.nav .grp{padding:6px 12px 2px}}
.qa{width:34px;height:34px;border-radius:99px;border:1px solid var(--line);background:var(--card);cursor:pointer;display:inline-grid;place-items:center;color:var(--ink);padding:0}.qa svg{width:17px;height:17px;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.brand{padding:4px 10px 18px;border-bottom:1px solid rgba(255,255,255,.08);margin-bottom:10px}
.brand b{display:block;font-family:Fraunces,serif;font-size:19px;color:#fff}.brand img{display:block;width:150px;max-width:100%;margin:0 auto 6px}.brand small{display:block;text-align:center}
.brand small{color:#9fbfb0;font-size:12px}
.nav a{display:flex;align-items:center;gap:10px;padding:9px 12px;border-radius:10px;color:#cfe0d6;text-decoration:none;cursor:pointer;font-weight:500;font-size:14px}
.nav a:hover{background:rgba(255,255,255,.06)}
.nav a.on{background:#fff;color:var(--g9)}
.nav .ic{width:20px;display:grid;place-items:center}.ic svg{width:19px;height:19px;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.side .foot{margin-top:auto;flex:none;font-size:12px;color:#9fbfb0;padding:10px}
.main{flex:1;min-width:0;width:100%;margin-left:232px;padding:22px 28px 90px;max-width:1240px}
.top{display:grid;grid-template-columns:minmax(0,1fr) auto auto;grid-template-areas:"ttl acts util";align-items:center;gap:10px 12px;margin-bottom:18px}
.top .ttl{grid-area:ttl;min-width:0}.top .acts{grid-area:acts;display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end}.top .util{grid-area:util;display:flex;gap:6px;align-items:center}
.top h1{font-size:26px}
.top .sub{color:var(--muted);font-size:13px}
.sync{font-size:12px;padding:5px 10px;border-radius:99px;background:var(--g1);color:var(--g7);font-weight:600;cursor:pointer}
.sync.off{background:#eee;color:#777}.sync.err{background:var(--red1);color:var(--red)}
/* bottom nav mobile */
.bnav{display:none}
@media (max-width:900px){
  .side{display:none}.main{margin-left:0;padding:0 12px calc(92px + env(safe-area-inset-bottom))}
  .bnav{display:flex;position:fixed;left:0;right:0;bottom:0;background:rgba(255,255,255,.96);backdrop-filter:blur(10px);border-top:1px solid var(--line);z-index:30;padding:6px 6px calc(6px + env(safe-area-inset-bottom))}
  .bnav a{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;color:var(--muted);padding:2px 0;cursor:pointer;font-weight:600}
  .bnav a .ic{display:grid;place-items:center;width:52px;height:30px;border-radius:99px;transition:background .15s}
  .bnav a .ic svg{width:22px;height:22px}
  .bnav a.on{color:var(--g9)}.bnav a.on .ic{background:var(--g1)}
  /* en-tête compact et collant */
  .top{position:sticky;top:0;z-index:25;margin:0 -12px 12px;padding:12px 12px 10px;background:rgba(238,242,237,.94);backdrop-filter:blur(10px);grid-template-columns:minmax(0,1fr) auto;grid-template-areas:"ttl util" "acts acts";gap:8px 10px}
  .top h1{font-size:21px;line-height:1.2}
  .top .sub{font-size:12px;line-height:1.35;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
  .top .acts{flex-wrap:wrap;justify-content:flex-start;gap:6px}
  .top .acts::-webkit-scrollbar{display:none}
  .top .acts .btn{flex:none;padding:9px 13px;border-radius:99px;font-size:13.5px}
  .top .util{gap:4px;align-self:start}
  .sync{width:34px;height:34px;padding:0;font-size:0;display:grid;place-items:center;border:1px solid var(--line);background:var(--card)}
  .sync::before{content:'';width:10px;height:10px;border-radius:50%;background:var(--g5);box-shadow:0 0 0 3px var(--g1)}
  .sync.err::before{background:var(--red);box-shadow:0 0 0 3px var(--red1)}.sync.off::before{background:#9aa59e;box-shadow:0 0 0 3px #e8ece8}
  .sync.sbc::before{background:var(--blue);box-shadow:0 0 0 3px #e1eaf3}
  /* cartes */
  .grid{gap:10px}.card{padding:14px;border-radius:16px;box-shadow:none}
  .kpi .v{font-size:23px}.kpi .l{font-size:12.5px}.kpi .d{font-size:12px;line-height:1.35}
  .k4>.kpi.hero:first-child{grid-column:1/-1}.k4>.kpi.hero:first-child .v{font-size:32px}
  .tw{margin:0;padding:0;overflow-x:auto}
  /* tableaux en fiches */
  table.rc,table.rc tbody{display:block}
  table.rc tr:first-child{display:none}
  table.rc tr{display:grid;grid-template-columns:1fr 1fr;gap:4px 14px;padding:11px 2px;border-bottom:1px solid #e6ece6}
  table.rc tr:last-child{border-bottom:0}
  table.rc td{display:flex;flex-direction:column;align-items:flex-start;padding:0;border:0;text-align:left!important;white-space:normal;font-size:14px;min-width:0;overflow-wrap:anywhere}
  table.rc td::before{content:attr(data-l);font-size:11.5px;color:var(--muted);font-weight:500;line-height:1.3}
  table.rc td:first-child{grid-column:1/-1;font-weight:600;font-size:15px}
  table.rc td:first-child::before,table.rc td.act::before,table.rc td.full::before{display:none}
  table.rc td.full{grid-column:1/-1}
  table.rc td.em{display:none}
  table.rc tr.hasact{position:relative}table.rc tr.hasact td:first-child{padding-right:84px}
  table.rc td.act{position:absolute;top:8px;right:0;flex-direction:row;gap:6px}
  table.rc td.act:empty{display:none}
  table.rc.rc3 tr{grid-template-columns:repeat(3,minmax(0,1fr))}
  table.rc tr.click:active{background:#f1f6f1}
  table:not(.rc){font-size:13.5px}
  .seg{max-width:100%;overflow-x:auto;flex-wrap:nowrap}
  .seg button{flex:none}
  /* tournée */
  .tr{padding:12px;border-radius:14px}
  .step button{width:40px;height:40px}.step input{height:40px;width:54px}
  .sum{bottom:calc(70px + env(safe-area-inset-bottom));border-radius:16px}
  .toast{bottom:calc(150px + env(safe-area-inset-bottom));width:max-content;max-width:calc(100% - 32px)}
  .md{padding:18px 16px calc(18px + env(safe-area-inset-bottom))}
  .chart{height:auto}
}
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.tile{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;min-height:84px;padding:10px 6px;border:1px solid var(--line);background:var(--card);border-radius:14px;font-weight:600;font-size:12.5px;line-height:1.25;text-align:center;cursor:pointer;color:var(--ink)}
.tile .ic{display:grid;place-items:center;width:40px;height:40px;border-radius:12px;background:var(--g1);color:var(--g9)}.tile .ic svg{width:21px;height:21px}
.tile.on{border-color:var(--g5)}.tile.out{color:var(--red)}.tile.out .ic{background:var(--red1);color:var(--red)}
@media (max-width:360px){.tiles{grid-template-columns:repeat(2,1fr)}}
/* cards */
.grid{display:grid;gap:14px}.grid>*,.card,.top>*{min-width:0}.top h1{overflow-wrap:anywhere}
.k4{grid-template-columns:repeat(4,1fr)}.k3{grid-template-columns:repeat(3,1fr)}.k2{grid-template-columns:2fr 1fr}
@media (max-width:1050px){.k4{grid-template-columns:repeat(2,1fr)}.k2,.k3{grid-template-columns:1fr}}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--sh);padding:16px}
.card h3{font-size:14px;font-weight:600;margin-bottom:10px;display:flex;justify-content:space-between;align-items:center;gap:8px}
.kpi .l{font-size:13px;color:var(--muted);font-weight:600}
.kpi .v{font-family:Fraunces,serif;font-size:27px;font-weight:700;margin-top:4px;white-space:nowrap}
.kpi .v small{font-family:Inter;font-size:13px;color:var(--muted);font-weight:500}
.kpi .d{font-size:12px;color:var(--muted);margin-top:2px}
.kpi.hero{background:var(--g9);color:#fff;border-color:var(--g9)}
.kpi.hero .l,.kpi.hero .d,.kpi.hero .v small{color:#a9c9b9}
.up{color:var(--g5)}.dn{color:var(--red)}
/* tables */
.tw{overflow-x:auto;margin:0 -16px;padding:0 16px}
table{width:100%;border-collapse:collapse;font-size:14px}
th{text-align:left;font-size:12px;color:var(--muted);font-weight:600;padding:8px 8px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:9px 8px;border-bottom:1px solid #edf1ec;vertical-align:middle}
tr:last-child td{border-bottom:none}
td.n,th.n{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
tr.click{cursor:pointer}tr.click:hover td{background:#f4f8f4}
.tag{display:inline-block;font-size:11px;font-weight:700;padding:2px 8px;border-radius:99px;background:var(--g1);color:var(--g7)}
.tag.cr{background:var(--red1);color:var(--red)}.tag.oc{background:var(--ocre1);color:#8a5a14}.tag.gr{background:#eee;color:#666}
/* buttons/forms */
.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--card);padding:8px 14px;border-radius:10px;font-weight:600;font-size:14px;cursor:pointer;white-space:nowrap}
.btn:hover{border-color:#cfc5b0}
.btn.p{background:var(--g7);border-color:var(--g7);color:#fff}.btn.p:hover{background:var(--g9)}
.btn.o{background:var(--ocre);border-color:var(--ocre);color:#fff}
.btn.d{color:var(--red)}.btn.sm{padding:5px 10px;font-size:13px}
.btn.big{width:100%;justify-content:center;padding:14px;font-size:16px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.sp{flex:1}
.inp,select.inp{border:1px solid var(--line);background:#fff;border-radius:10px;padding:9px 11px;min-width:0;width:100%}
.inp:focus{outline:2px solid var(--g5);outline-offset:-1px;border-color:transparent}
label.f{display:block;font-size:12px;font-weight:600;color:var(--muted);margin-bottom:4px}
.fg{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.fg .full{grid-column:1/-1}
@media (max-width:520px){.fg{grid-template-columns:1fr}}
.printhead{display:none}
.gstep{display:flex;gap:12px;align-items:flex-start;padding:10px 0;border-bottom:1px solid var(--line)}.gstep:last-child{border:0}
.gn{flex:none;width:28px;height:28px;border-radius:50%;background:var(--g7);color:#fff;display:grid;place-items:center;font-weight:700;font-size:13px}
.seg{display:inline-flex;flex-wrap:wrap;background:#e2e9e2;border-radius:10px;padding:3px}
.seg button{border:0;background:none;padding:6px 12px;border-radius:8px;font-weight:600;font-size:13px;cursor:pointer;color:var(--muted)}
.seg button.on{background:#fff;color:var(--ink);box-shadow:var(--sh)}
/* modal */
.ov{position:fixed;inset:0;background:rgba(20,30,25,.45);display:flex;align-items:flex-end;justify-content:center;z-index:100}
.md{background:var(--card);width:100%;max-width:560px;border-radius:18px 18px 0 0;padding:20px;max-height:92vh;overflow:auto}
@media (min-width:700px){.ov{align-items:center}.md{border-radius:18px}}
.md h2{font-size:20px;margin-bottom:14px}
.md .act{display:flex;gap:8px;justify-content:flex-end;margin-top:18px}
/* tournée */
.tl{display:flex;flex-direction:column;gap:8px}
.tr{display:grid;grid-template-columns:1fr auto;gap:8px 12px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.tr.act{border-color:var(--g5);background:#f6fbf8}
.tr .nm{font-weight:600}.tr .meta{font-size:12px;color:var(--muted)}
.step{display:flex;align-items:center;gap:4px}
.step button{width:36px;height:36px;border-radius:10px;border:1px solid var(--line);background:#fff;font-size:20px;font-weight:600;cursor:pointer}
.step input{width:52px;text-align:center;font-weight:700;font-size:17px;border:1px solid var(--line);border-radius:10px;height:36px}
.tr .pay{grid-column:1/-1;display:none;gap:8px;align-items:center;flex-wrap:wrap}
.tr.act .pay{display:flex}
.pay .inp{width:110px}
.sum{position:sticky;bottom:78px;background:var(--g9);color:#fff;border-radius:14px;padding:12px 14px;display:flex;gap:14px;align-items:center;margin-top:12px;box-shadow:0 8px 24px rgba(0,0,0,.18)}
@media (min-width:901px){.sum{bottom:14px}}
.sum b{font-family:Fraunces,serif;font-size:20px}
.sum small{color:#a9c9b9;font-size:11px;display:block}
/* misc */
.alert{display:block;padding:10px 12px;border-radius:10px;background:var(--ocre1);color:#6e4710;font-size:13px;margin-bottom:8px}
.alert.r{background:var(--red1);color:#7d2a1c}.alert.g{background:var(--g1);color:var(--g9)}
.empty{text-align:center;color:var(--muted);padding:26px}
.bar{height:8px;background:#e4ebe4;border-radius:99px;overflow:hidden}.bar i{display:block;height:100%;background:var(--g5)}
.toast{position:fixed;left:50%;bottom:96px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 16px;border-radius:10px;z-index:200;font-weight:600;font-size:14px;box-shadow:0 8px 24px rgba(0,0,0,.25)}
.login{position:fixed;inset:0;background:var(--g9);display:flex;align-items:center;justify-content:center;z-index:300;padding:20px}
.login .box{background:var(--card);border-radius:20px;padding:26px;width:100%;max-width:360px;text-align:center}
.login h1{font-size:24px;color:var(--g9)}.login .llogo{display:block;width:220px;max-width:80%;margin:-6px auto 4px}
.pin{font-size:26px;letter-spacing:.5em;text-align:center;font-weight:700}
.muted{color:var(--muted)}.small{font-size:12px}
.chart text{font-size:11px;fill:var(--muted);font-family:Inter}
.hide{display:none!important}
@media print{.printhead{display:block;border-bottom:2px solid #000;padding-bottom:8px;margin-bottom:14px}.side,.bnav,.top .acts,.top .util,.btn,.sum{display:none!important}table.rc tr:first-child{display:table-row!important}.main{margin:0;padding:0}.card{box-shadow:none;break-inside:avoid}}

<script>
/* Œil : afficher / masquer les mots de passe et codes (tous les champs, y compris ceux créés plus tard) */
(function(){
  const css = document.createElement('style');
  css.textContent = '.oeil-w{position:relative;display:block}.oeil-w>input{padding-right:46px!important}.oeil{position:absolute;right:4px;top:50%;transform:translateY(-50%);width:40px;height:40px;border:0;background:transparent;cursor:pointer;display:flex;align-items:center;justify-content:center;color:#667085;padding:0;margin:0;box-shadow:none}.oeil:hover{color:#1d2b4f}.oeil svg{width:22px;height:22px}@media print{.oeil{display:none}}';
  document.head.appendChild(css);
  const OUVERT = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>';
  const FERME = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94"/><path d="M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19"/><path d="M14.12 14.12a3 3 0 1 1-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/></svg>';
  window.OEIL = { OUVERT, FERME };
  function equiper(inp){
    if (inp.dataset.oeil) return; inp.dataset.oeil = '1';
    const w = document.createElement('span'); w.className = 'oeil-w';
    const cs = getComputedStyle(inp); if (cs.display === 'inline-block' || cs.marginLeft === cs.marginRight && cs.marginLeft !== '0px') { w.style.width = inp.offsetWidth ? inp.offsetWidth + 'px' : ''; w.style.margin = '0 auto'; }
    inp.parentNode.insertBefore(w, inp); w.appendChild(inp);
    const b = document.createElement('button'); b.type = 'button'; b.className = 'oeil'; b.tabIndex = -1;
    b.setAttribute('aria-label', 'Afficher le mot de passe'); b.title = 'Afficher'; b.innerHTML = OUVERT;
    b.addEventListener('mousedown', e => e.preventDefault());
    b.addEventListener('click', e => { e.preventDefault(); e.stopPropagation(); const voir = inp.type === 'password'; inp.type = voir ? 'text' : 'password'; b.innerHTML = voir ? FERME : OUVERT; b.title = voir ? 'Masquer' : 'Afficher'; b.setAttribute('aria-label', voir ? 'Masquer le mot de passe' : 'Afficher le mot de passe'); inp.focus(); });
    w.appendChild(b);
  }
  const scan = () => document.querySelectorAll('input[type=password]:not([data-oeil])').forEach(equiper);
  new MutationObserver(scan).observe(document.documentElement, { childList: true, subtree: true }); scan();
})();
</script>
<script>
/* Mise à jour automatique : vérifie la version publiée à l'ouverture, au retour sur l'application et toutes les 30 minutes */
(function(){
  let affiche = false;
  function banniere(v){
    if (affiche || !document.body) return; affiche = true;
    const d = document.createElement('div'); d.id = 'maj-banniere';
    d.style.cssText = 'position:fixed;left:12px;right:12px;bottom:calc(76px + env(safe-area-inset-bottom));z-index:99999;background:#1b2a4a;color:#fff;border-radius:14px;padding:12px 14px;display:flex;gap:10px;align-items:center;justify-content:space-between;box-shadow:0 8px 24px rgba(0,0,0,.25);font:600 14px/1.35 system-ui,sans-serif;max-width:560px;margin:0 auto';
    d.innerHTML = '<span>Nouvelle version ' + v + ' disponible</span><button type="button" style="background:#d4a017;color:#1b2a4a;border:0;border-radius:10px;padding:9px 14px;font:700 14px system-ui,sans-serif;cursor:pointer;white-space:nowrap">Mettre à jour</button>';
    d.querySelector('button').onclick = () => {
      const fin = () => location.reload();
      try { (navigator.serviceWorker && navigator.serviceWorker.getRegistration ? navigator.serviceWorker.getRegistration() : Promise.resolve(null)).then(r => r ? r.update() : null).then(fin, fin); } catch(e){ fin(); }
    };
    document.body.appendChild(d);
  }
  function verifier(){
    let actuelle; try { actuelle = VERSION; } catch(e){ return; }
    fetch(location.pathname.replace(/[^/]*$/, '') + 'index.html?maj=' + Date.now(), { cache: 'no-store' })
      .then(r => r.ok ? r.text() : '').then(t => { const m = t.match(new RegExp('const VER' + 'SION = \'([^\']+)\'')); if (m && m[1] !== actuelle) banniere(m[1]); }).catch(() => {});
  }
  window.addEventListener('load', () => setTimeout(verifier, 3000));
  document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') verifier(); });
  setInterval(verifier, 30 * 60 * 1000);
})();
</script>

<body>
<div class="app">

/* ---------- utilitaires ---------- */
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const num = v => { const n = parseFloat(String(v ?? '').replace(/\s/g,'').replace(',','.')); return isFinite(n) ? n : 0; };
const F = n => Math.round(n || 0).toLocaleString('fr-FR').replace(/[\u202f\u00a0 ]/g,'\u00a0'); // espace insécable : un nombre ne se coupe jamais sur deux lignes
const FC = n => F(n) + '\u00a0F';
const F1 = n => (Math.round((n||0)*10)/10).toLocaleString('fr-FR',{maximumFractionDigits:1}).replace(/[\u202f\u00a0 ]/g,'\u00a0');
const F2 = n => (Math.round((n||0)*100)/100).toLocaleString('fr-FR',{maximumFractionDigits:2}).replace(/[\u202f\u00a0 ]/g,'\u00a0');
const today = () => { const d = new Date(); return new Date(d - d.getTimezoneOffset()*6e4).toISOString().slice(0,10); };
const nowH = () => new Date().toTimeString().slice(0,5);
const ym = d => (d || '').slice(0,7);
const addDays = (d, n) => { const x = new Date(d + 'T12:00:00'); x.setDate(x.getDate()+n); return x.toISOString().slice(0,10); };
const MOIS = ['janv.','févr.','mars','avr.','mai','juin','juil.','août','sept.','oct.','nov.','déc.'];
const fmtM = m => { const [y,mo] = m.split('-'); return MOIS[+mo-1] + ' ' + y.slice(2); };
const fmtD = d => d ? d.slice(8,10) + '/' + d.slice(5,7) + '/' + d.slice(2,4) : '';
const norm = s => String(s||'').toUpperCase().replace(/\s+/g,' ').trim();
const enc = v => v.encaisse !== undefined ? num(v.encaisse) : (v.paye === 'O' ? num(v.montant) : 0);

/* ---------- état ---------- */
let DATA = null, CFG = null, USER = null;
let PAGE = 'home', PARAM = null;
let CACHE = null;

function defaultData(){
  return { entreprise:{nom:"MOAYÉ'S INDUSTRIE", ville:"San-Pédro, Côte d'Ivoire", tel:"", gerant:""},
    ventes:[], reglements:[], clients:[], production:[], achats:[], charges:[], fournisseurs:[],
    rh:[], rhHistorique:[], stockAjust:[], archives:[], audit:[], commandes:[],
    hypotheses:{prixVente:500, prixPortion:1.3}, soldeInit:0, soldeInitial:0, _idClientSeq:1,
    stock:{ attieke:{label:'Attiéké produit',unite:'kg',debut:0,entrees:0,sorties:0,seuil:20},
            manioc:{label:'Manioc brut',unite:'sacs',debut:0,entrees:0,sorties:0,seuil:3} } };
}
const HYP0 = {rendement:85.8, tauxPerte:0.038, prixAchat:17000, prixVente:500, prixPortion:1.3, ch_mo:2000, ch_transport:3300, ch_gaz:1000, ch_emb:500, ch_autres:0};
const hyp = () => Object.assign({}, HYP0, DATA.hypotheses || {});
const kgSacTheo = () => { const h = hyp(); return Math.round(num(h.rendement) * (1 - num(h.tauxPerte)) * 10) / 10 || CFG.kgSac; };
const isCredF = a => /cr[ée]dit/i.test(a.mode || '');
function defaultCfg(){
  return { prix:500, poids:1.3, kgSac:82.5, seuilKg:20, seuilSacs:3, seuilCredit:15000,
    waPhone:'', fbPath:'moayes_v2/data', fbAuto:true, cfgV:2,
    sbOn:false, sbUrl:'', sbKey:'', sbTable:'moayes_sync', sbId:'main', autoBk:true, waHour:19 };
}
function sanitize(d){
  const b = defaultData();
  for (const k of Object.keys(b)) if (d[k] === undefined || d[k] === null) d[k] = b[k];
  ['ventes','reglements','clients','production','achats','charges','fournisseurs','rh','rhHistorique','stockAjust','archives','audit','commandes','controlesCaisse','paiementsFourn','annulations']
    .forEach(k => { if (!Array.isArray(d[k])) d[k] = d[k] && typeof d[k]==='object' ? Object.values(d[k]) : []; });
  // date de création des fiches clients : reprise du journal pour les fiches qui n'en ont pas
  const creeLe = {}; d.audit.forEach(x => { if (x && x.module === 'clients' && /cr[ée]ation/i.test(x.action || '') && x.id && !creeLe[x.id]) creeLe[x.id] = x.date; });
  d.clients.forEach(c => { if (c && !c.cree && creeLe[c.id]) c.cree = creeLe[c.id]; });
  if (!d.soldeInit && d.soldeInitial) d.soldeInit = d.soldeInitial;
  d.soldeInitial = d.soldeInit;
  return d;
}
function load(){
  CFG = Object.assign(defaultCfg(), JSON.parse(localStorage.getItem(LS_CFG) || '{}'));
  if ((CFG.cfgV||0) < 2){ CFG.fbAuto = true; CFG.cfgV = 2; saveCfg(); }

  DATA = sanitize(DATA || defaultData());
  if (DATA.hypotheses){ if (DATA.hypotheses.prixVente) CFG.prix = CFG.prix || DATA.hypotheses.prixVente; }
}
let pushTimer = null, DIRTY = false, REMOTE_SEEN = false, REMOTE_NV = 0, LISTEN_PATH = '';
function save(){
  CACHE = null; MVAL = null;
  syncLegacy();
  const ts = Date.now();
  DATA._lastSaved = ts;
  try { localStorage.setItem(LS_DATA, JSON.stringify(DATA)); localStorage.setItem(LS_TS, String(ts)); }

}
function saveCfg(){ localStorage.setItem(LS_CFG, JSON.stringify(CFG)); }
function audit(module, action, ancien, nouveau, id){
  const n = (DATA.audit.reduce((m,a) => Math.max(m, a.num||0), 0)) + 1;
  DATA.audit.push({num:n, date:today(), heure:nowH(), user:USER ? 'GOLI — '+ROLES[USER].name : '', module, action,
    ancien: typeof ancien==='string' ? ancien : JSON.stringify(ancien||''), nouveau: typeof nouveau==='string' ? nouveau : JSON.stringify(nouveau||''), id:id||'', commentaire:'V2'});
}
function archive(collection, idx){
  const item = DATA[collection][idx];
  DATA.archives.push({collection, item, date:today(), heure:nowH(), user:'GOLI — '+ROLES[USER].name});
  audit(collection, 'suppression logique', item, '', item.idClient || item.id || '');
  DATA[collection].splice(idx, 1);
}

/* ---------- moteur de calcul (source unique) ---------- */
function clientKey(o){ return o.idClient || ('NOM:' + norm(o.client)); }
function clientById(id){ return DATA.clients.find(c => c.id === id); }
/* Stock de manioc valorisé au coût moyen pondéré (CMUP) : l'achat de manioc est une matière première
   stockée ; il ne devient une charge que lorsqu'il est transformé (ou perdu). */
let MVAL = null;
function maniocValo(){
  if (MVAL) return MVAL;
  const ev = [];
  DATA.achats.forEach(a => ev.push({d:a.date||'', o:0, s:num(a.sacs), v:num(a.montant)}));
  DATA.production.forEach(p => { if (num(p.achetes)) ev.push({d:p.date||'', o:0, s:num(p.achetes), v:num(p.cout)}); if (num(p.sacs)) ev.push({d:p.date||'', o:1, s:-num(p.sacs)}); });
  DATA.stockAjust.filter(a => a.key === 'manioc').forEach(a => ev.push({d:a.date||'', o:num(a.delta) > 0 ? 0 : 1, s:num(a.delta), aj:true}));
  ev.sort((a,b) => a.d < b.d ? -1 : a.d > b.d ? 1 : a.o - b.o);
  let sacs = 0, val = 0; const pts = [];
  for (const e of ev){
    if (e.v !== undefined){ sacs += e.s; val += e.v; }                      // achat : + sacs, + valeur payée
    else { const cmu = sacs > 0 ? val / sacs : 0; sacs += e.s; val += e.s * cmu; if (sacs <= 0.0001 || val < 0){ if (sacs <= 0.0001) val = 0; } } // sortie (ou inventaire +) au coût moyen
    pts.push({d:e.d, sacs, val:Math.max(0, val)});
  }
  const at = d => { let r = {sacs:0, val:0}; for (const p of pts){ if (p.d <= d) r = p; else break; } return r; };   // situation à la fin du jour d
  MVAL = {at, cmu: () => { const l = pts[pts.length-1]; return l && l.sacs > 0 ? l.val / l.sacs : 0; }};
  return MVAL;
}
function calc(){
  if (CACHE) return CACHE;
  MVAL = null;
  const cred = {}, last = {}, tot = {}, nbAch = {};
  const nameToId = {};
  DATA.clients.forEach(c => nameToId[norm(c.nom)] = c.id);
  const keyOf = o => o.idClient || nameToId[norm(o.client)] || ('NOM:' + norm(o.client));
  for (const v of DATA.ventes){
    const k = keyOf(v);
    cred[k] = (cred[k]||0) + num(v.montant) - enc(v);
    tot[k] = (tot[k]||0) + num(v.montant);
    nbAch[k] = (nbAch[k]||0) + 1;
    if (!last[k] || v.date > last[k]) last[k] = v.date;
  }
  for (const r of DATA.reglements){ const k = keyOf(r); cred[k] = (cred[k]||0) - num(r.montant); }
  for (const a of DATA.annulations){ const k = a.cle || a.idClient || ('NOM:' + norm(a.client)); cred[k] = (cred[k]||0) - num(a.montant); }

  const sum = (a, f) => a.reduce((s,x) => s + f(x), 0);
  const prodKg = sum(DATA.production, p => num(p.kg));
  const prodSacs = sum(DATA.production, p => num(p.sacs));
  const ventesKg = sum(DATA.ventes, v => num(v.qty) * (num(v.poids) || CFG.poids));
  const ajKg = sum(DATA.stockAjust.filter(a => a.key==='attieke'), a => num(a.delta));
  const ajSacs = sum(DATA.stockAjust.filter(a => a.key==='manioc'), a => num(a.delta));
  const achSacs = sum(DATA.achats, a => num(a.sacs)) + sum(DATA.production, p => num(p.achetes));
  const stockKg = prodKg + ajKg - ventesKg;
  const stockSacs = achSacs + ajSacs - prodSacs;

  const encV = sum(DATA.ventes, enc), regl = sum(DATA.reglements, r => num(r.montant));
  const achats = sum(DATA.achats, a => num(a.montant));
  const chargesHM = sum(DATA.charges.filter(c => c.cat !== 'Manioc'), c => num(c.montant));
  const chargesManiocDoublon = sum(DATA.charges.filter(c => c.cat === 'Manioc'), c => num(c.montant));
  const achatsCredit = sum(DATA.achats.filter(isCredF), a => num(a.montant));
  const paieF = sum(DATA.paiementsFourn, x => num(x.montant));
  const detteF = achatsCredit - paieF;
  const treso = num(DATA.soldeInit) + encV + regl - (achats - achatsCredit) - paieF - chargesHM;
  const pertes = DATA.stockAjust.filter(a => a.type === 'perte');
  const perteSacs = -sum(pertes.filter(a => a.key === 'manioc'), a => num(a.delta)), perteKg = -sum(pertes.filter(a => a.key === 'attieke'), a => num(a.delta));

  // séries mensuelles
  const M = {};
  const mget = m => M[m] || (M[m] = {m, ca:0, encV:0, regl:0, achats:0, achCash:0, paieF:0, chHM:0, pots:0, prodKg:0, sacs:0, achSacs:0, remises:0, nbV:0, nbCredit:0, cats:{}, pertesVal:0, perteSacs:0, perteKg:0});
  DATA.ventes.forEach(v => { const o = mget(ym(v.date)); o.ca += num(v.montant); o.encV += enc(v); o.pots += num(v.qty); o.remises += num(v.remiseMontant); o.nbV++; if (num(v.montant) - enc(v) > 0) o.nbCredit++; });
  DATA.reglements.forEach(r => mget(ym(r.date)).regl += num(r.montant));
  DATA.achats.forEach(a => { const o = mget(ym(a.date)); o.achats += num(a.montant); o.achSacs += num(a.sacs); if (!isCredF(a)) o.achCash += num(a.montant); });
  DATA.paiementsFourn.forEach(x => mget(ym(x.date)).paieF += num(x.montant));
  pertes.forEach(a => { const o = mget(ym(a.date)); o.pertesVal += num(a.valeur); if (a.key === 'manioc') o.perteSacs -= num(a.delta); else o.perteKg -= num(a.delta); });
  DATA.charges.filter(c => c.cat !== 'Manioc').forEach(c => { const o = mget(ym(c.date)); o.chHM += num(c.montant); o.cats[c.cat] = (o.cats[c.cat]||0) + num(c.montant); });
  DATA.production.forEach(p => { const o = mget(ym(p.date)); o.prodKg += num(p.kg); o.sacs += num(p.sacs); });
  const months = Object.values(M).filter(o => o.m).sort((a,b) => a.m < b.m ? -1 : 1);
  DATA.annulations.forEach(a => mget(ym(a.date)).annul = (mget(ym(a.date)).annul||0) + num(a.montant));
  const MV = maniocValo();
  months.forEach(o => { o.stockManiocVal = MV.at(finMois(o.m)).val; o.varStock = o.stockManiocVal - MV.at(o.m + '-00').val; o.consoManioc = o.achats - o.varStock; o.couts = o.consoManioc + o.chHM; o.res = o.ca - o.couts - (o.annul||0); o.cash = o.encV + o.regl - o.achCash - o.paieF - o.chHM; o.coutPot = o.pots ? o.couts / o.pots : 0; });

  const ids = new Set(DATA.clients.map(c => c.id));
  const creditTotal = DATA.clients.reduce((s,c) => s + (cred[c.id]||0), 0);
  const arcCli = {}; DATA.archives.forEach((a,i) => { if (a.collection === 'clients' && a.item && a.item.id) arcCli[a.item.id] = {i, nom:a.item.nom}; });
  const orphelins = Object.entries(cred).filter(([k,v]) => !ids.has(k) && Math.abs(v) >= 1).map(([k,v]) => ({k, nom: k.startsWith('NOM:') ? k.slice(4) : (arcCli[k] ? arcCli[k].nom + ' (' + k + ')' : k), v, arc: arcCli[k] ? arcCli[k].i : -1}));
  CACHE = {cred, last, tot, nbAch, keyOf, stockKg, stockSacs, prodKg, ventesKg, encV, regl, achats, chargesHM,
    chargesManiocDoublon, treso, months, creditTotal, orphelins, achatsCredit, paieF, detteF, perteSacs, perteKg, ca: sum(DATA.ventes, v => num(v.montant))};
  return CACHE;
}
function detteFourn(nom){ const n = norm(nom); return DATA.achats.filter(a => norm(a.fourn) === n && isCredF(a)).reduce((s,a)=>s+num(a.montant),0) - DATA.paiementsFourn.filter(x => norm(x.fourn) === n).reduce((s,x)=>s+num(x.montant),0); }
function prixMoySac(){ const L = DATA.achats.filter(a => a.date >= addDays(today(), -60)); const s = L.reduce((t,a)=>t+num(a.sacs),0); return s ? L.reduce((t,a)=>t+num(a.montant),0)/s : num(hyp().prixAchat); }
function coutPotReel(){ const K = calc(), mo = ym(today()), L = K.months.filter(m => m.m < mo).slice(-2), c = L.reduce((t,m)=>({c:t.c+m.couts,p:t.p+m.pots}),{c:0,p:0}); return c.p ? c.c/c.p : 0; }
function creditOf(id){ return Math.round(calc().cred[id] || 0); }
/* tient à jour les champs de l'ancien format pour compatibilité V30 */
function syncLegacy(){
  const K = (CACHE = null, calc());
  DATA.clients.forEach(c => c.credit = Math.round(K.cred[c.id] || 0));
  DATA.fournisseurs.forEach(f => f.solde = Math.round(detteFourn(f.nom)));
  const s = DATA.stock;
  if (s && s.attieke){ s.attieke.debut = 0; s.attieke.entrees = Math.round((K.prodKg + DATA.stockAjust.filter(a=>a.key==='attieke').reduce((t,a)=>t+num(a.delta),0))*10)/10; s.attieke.sorties = Math.round(K.ventesKg*10)/10; }
  if (s && s.manioc){ s.manioc.debut = 0; s.manioc.entrees = Math.round(DATA.achats.reduce((t,a)=>t+num(a.sacs),0)*100)/100; s.manioc.sorties = DATA.production.reduce((t,p)=>t+num(p.sacs),0); }
  DATA.soldeInitial = DATA.soldeInit;
  CACHE = null;
}

/* sur téléphone, chaque ligne d'un tableau large devient une fiche « libellé : valeur » */
function cardTables(root){
  root.querySelectorAll('table').forEach(t => {
    const hr = t.rows[0]; if (!hr || !hr.querySelector('th') || hr.querySelector('[colspan],[rowspan]') || hr.cells.length < 4 || t.rows.length > 400) return;
    const L = [...hr.cells].map(c => c.textContent.trim());
    t.classList.add('rc'); if (L.length >= 7) t.classList.add('rc3');
    for (let i = 1; i < t.rows.length; i++){ const r = t.rows[i]; let k = 0;
      [...r.cells].forEach(c => { if (c.colSpan > 1){ c.classList.add('full'); k += c.colSpan; return; }
        if (k > 0 && !c.textContent.trim() && !c.querySelector('button,img,input')) c.classList.add('em');
        else if (L[k] && k > 0) c.setAttribute('data-l', L[k]); else if (k > 0){ c.classList.add('act'); r.classList.add('hasact'); }
        k++; }); }
  });
}

function chartMonths(ms){
  if (!ms.length) return '<div class="empty">Pas encore de données</div>';
  const W = 640, H = 230, pl = 46, pb = 26, pt = 24;
  const max = Math.max(1, ...ms.map(m => Math.max(m.ca, m.couts)));
  const min = 0;
  const range = max - min, y = v => pt + (H-pt-pb) * (1 - (v - min)/range);
  const bw = (W - pl) / ms.length, b = Math.min(22, bw/4);
  let g = '';
  for (let i=0;i<=4;i++){ const v = min + range*i/4; g += `<line x1="${pl}" x2="${W}" y1="${y(v)}" y2="${y(v)}" stroke="#ece5d6"/><text x="${pl-6}" y="${y(v)+4}" text-anchor="end">${F(v/1000)}k</text>`; }
  ms.forEach((m,i) => {
    const x = pl + bw*i + bw/2;
    g += `<rect x="${x-b-2}" y="${y(m.ca)}" width="${b}" height="${y(0)-y(m.ca)}" rx="3" fill="#3c8a69"><title>CA ${FC(m.ca)}</title></rect>`;
    g += `<rect x="${x+2}" y="${y(m.couts)}" width="${b}" height="${y(0)-y(m.couts)}" rx="3" fill="#d9b27a"><title>Coûts ${FC(m.couts)}</title></rect>`;
    g += `<text x="${x}" y="${H-8}" text-anchor="middle">${fmtM(m.m)}</text>`;
    g += `<text x="${x}" y="${Math.min(y(m.ca),y(m.couts))-5}" text-anchor="middle" style="font-weight:700;fill:${m.res>=0?'#24624a':'#b3402e'}">${m.res>=0?'+':''}${F(m.res/1000)}k</text>`;
  });
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" width="100%">${g}</svg>
    <div class="row small muted" style="gap:14px"><span><i style="display:inline-block;width:10px;height:10px;background:#3c8a69;border-radius:2px"></i> Chiffre d'affaires</span><span><i style="display:inline-block;width:10px;height:10px;background:#d9b27a;border-radius:2px"></i> Coûts (manioc + charges)</span><span>Chiffre au-dessus : résultat</span></div>`;
}

let TOUR = null;
function initTour(){
  const K = calc(), t = today(), from = addDays(t, -30);

  DATA.ventes.forEach(v => { if (v.date >= from){ const k = K.keyOf(v); freq[k] = (freq[k]||0) + 1; } });
  const ids = [...DATA.clients.filter(c => !freq[c.id] && (c.cree || '') >= from).map(c => c.id), ...DATA.clients.filter(c => freq[c.id]).sort((a,b) => freq[b.id] - freq[a.id]).map(c => c.id)];
  const lastQ = {};
  [...DATA.ventes].sort((a,b) => a.date < b.date ? -1 : 1).forEach(v => { const k = K.keyOf(v); lastQ[k] = num(v.qty); });
  TOUR = { date: t, mode:'Espèces', rows: ids.map(id => ({id, qty:0, paid:0, reg:0, lastQ: lastQ[id]||0, touched:false})) };
}

VIEWS.achats = () => {
  const L = DATA.achats.map((a,i)=>({a,i})).sort((x,y) => x.a.date < y.a.date ? 1 : -1);
  const byF = {};
  DATA.achats.forEach(a => { const f = byF[a.fourn] || (byF[a.fourn] = {n:0, sacs:0, mt:0, last:''}); f.n++; f.sacs += num(a.sacs); f.mt += num(a.montant); if (a.date > f.last) f.last = a.date; });
  const fiche = n => DATA.fournisseurs.findIndex(f => norm(f.nom) === norm(n));
  const noms = [...new Set([...DATA.fournisseurs.map(f=>norm(f.nom)), ...Object.keys(byF).map(norm)])];
  const bf = n => Object.entries(byF).filter(([k]) => norm(k)===n).reduce((t,[,f]) => ({n:t.n+f.n, sacs:t.sacs+f.sacs, mt:t.mt+f.mt, last:f.last>t.last?f.last:t.last}), {n:0,sacs:0,mt:0,last:''});
  return header('Achats de manioc', 'Seule source du coût du manioc (ne pas le ressaisir dans Charges)', `<button class="btn" onclick="editFourn()">+ Fournisseur</button><button class="btn p" onclick="editAchat()">+ Achat</button>`) + `

  ${noms.map(n => ({n, f:bf(n), i:fiche(n)})).sort((a,b)=>b.f.mt-a.f.mt).map(x => { const fi = DATA.fournisseurs[x.i] || {}; return `<tr><td><b>${esc(x.n)}</b>${fi.zone?`<div class="small muted">${esc(fi.type||'')} · ${esc(fi.zone)}</div>`:''}</td><td class="small">${fi.tel?`<a href="tel:${esc(fi.tel)}">${esc(fi.tel)}</a>`:'—'}${fi.obs?`<div class="muted">${esc(fi.obs)}</div>`:''}</td><td class="n">${x.f.n}</td><td class="n">${F(x.f.sacs)}</td><td class="n">${FC(x.f.sacs?x.f.mt/x.f.sacs:0)}</td><td class="n">${fmtD(x.f.last)}</td><td class="n">${(()=>{ const d = detteFourn(x.n); return d > 0 ? `<b class="dn">${FC(d)}</b> <button class="btn sm p" onclick="payerFourn('${esc(x.n)}')">Payer</button>` : '—'; })()}</td><td class="n"><button class="btn sm" onclick="editFourn('${esc(x.n)}')">✎</button></td></tr>`; }).join('') || '<tr><td colspan="8" class="empty">Aucun fournisseur</td></tr>'}</table></div>
  ${DATA.paiementsFourn.length ? `<details style="margin-top:10px"><summary class="small" style="cursor:pointer">Paiements aux fournisseurs (${DATA.paiementsFourn.length})</summary><table>${DATA.paiementsFourn.map((x,i)=>({x,i})).reverse().slice(0,30).map(({x,i}) => `<tr><td class="small">${fmtD(x.date)}</td><td class="small">${esc(x.fourn)}</td><td class="n small">${FC(x.montant)}</td><td class="n"><button class="btn sm d" onclick="delItem('paiementsFourn',${i})">✕</button></td></tr>`).join('')}</table></details>` : ''}</div>
  <div class="card"><div class="tw"><table><tr><th>Date</th><th>Fournisseur</th><th class="n">Quantité</th><th class="n">Prix</th><th class="n">Montant</th><th></th></tr>
  ${L.map(x => `<tr><td>${fmtD(x.a.date)}</td><td>${esc(x.a.fourn)}</td><td class="n">${x.a.unite==='cuvette'?`${num(x.a.qteOriginale)} cuv. (${F2(num(x.a.sacs))} sac)`:`${num(x.a.sacs)} sacs`}</td><td class="n">${FC(x.a.prix)}</td><td class="n"><b>${FC(x.a.montant)}</b></td><td class="n"><button class="btn sm" onclick="editAchat(${x.i})">✎</button></td></tr>`).join('') || '<tr><td colspan="6" class="empty">Aucun achat</td></tr>'}

};

/* ---------- SALAIRES & RH ---------- */
let RHM = '';
/* une paie = une dépense « Salaire » ; le nom saisi est rattaché à la fiche de l'employé */
const words = n => norm(n).replace(/[^A-Z0-9À-Ÿ ]+/g, ' ').split(/\s+/).filter(Boolean);
function ficheDe(nom){
  const n = norm(nom); if (!n) return '';
  const al = (DATA.rhAlias || {})[n]; if (al) return al;
  const F_ = DATA.rh.map(r => norm(r.nom));
  if (F_.includes(n)) return n;
  const w = words(n); if (!w.length) return n;
  const c = F_.filter(f => { const fw = words(f); return w.every(x => fw.includes(x)) || fw.every(x => w.includes(x)); });
  return c.length === 1 ? c[0] : n;
}
function paies(){
  return DATA.charges.map((c,i) => ({c,i})).filter(x => x.c.cat === 'Salaire').map(x => {
    const m = /Salaire\s+(\d{4}-\d{2})/i.exec(x.c.desc || '');
    return {i:x.i, date:x.c.date, mois:m ? m[1] : ym(x.c.date), saisi:norm(x.c.fourn || x.c.desc || '?'), nom:ficheDe(x.c.fourn || x.c.desc || '?'), montant:num(x.c.montant), desc:x.c.desc || ''};
  }).sort((a,b) => a.date < b.date ? -1 : 1);
}
const paye = (nom, mois) => DATA.rhHistorique.some(h => h.mois === mois && norm(h.nom) === norm(nom)) || paies().some(p => p.mois === mois && p.nom === norm(nom));
VIEWS.rh = () => {
  if (!RHM) RHM = ym(today());
  const emp = DATA.rh.map((r,i)=>({r,i}));
  const act = emp.filter(x => x.r.statut !== 'Inactif');
  const masse = act.reduce((s,x) => s + num(x.r.sal) + num(x.r.prime), 0);
  const hist = paies().filter(p => p.mois === RHM).map(p => ({h:{datePaie:p.date, nom:p.nom, poste:(DATA.rh.find(r => norm(r.nom) === p.nom)||{}).poste||'', total:p.montant, ci:p.i}}));
  const verse = hist.reduce((s,x) => s + num(x.h.total), 0);
  const reste = act.filter(x => !paye(x.r.nom, RHM));
  const mois = [...new Set([ym(today()), ym(addDays(ym(today())+'-01',-1)), ...paies().map(p=>p.mois)])].filter(Boolean).sort().reverse();
  return header('Salaires & RH', 'Chaque paie crée automatiquement la dépense « Salaire » dans Charges', `<button class="btn" onclick="editEmp()">+ Employé</button>${reste.length?`<button class="btn p" onclick="payerTous()">Payer tout ${fmtM(RHM)}</button>`:''}`) + `
  <div class="row" style="margin-bottom:12px"><span class="small muted">Mois de paie</span><select class="inp" style="max-width:170px" onchange="RHM=this.value;render()">${mois.map(m=>`<option value="${m}" ${m===RHM?'selected':''}>${fmtM(m)}</option>`).join('')}</select></div>
  <div class="grid k3">
    <div class="card kpi"><div class="l">Masse salariale mensuelle</div><div class="v">${F(masse)} <small>F</small></div><div class="d">${act.length} employé(s) actif(s)</div></div>
    <div class="card kpi ${reste.length?'':'hero'}"><div class="l">Versé · ${fmtM(RHM)}</div><div class="v">${F(verse)} <small>F</small></div><div class="d">${hist.length} paie(s) enregistrée(s)</div></div>
    <div class="card kpi"><div class="l">Reste à payer · ${fmtM(RHM)}</div><div class="v ${reste.length?'dn':''}">${F(reste.reduce((s,x)=>s+num(x.r.sal)+num(x.r.prime),0))} <small>F</small></div><div class="d">${reste.length ? reste.map(x=>esc(x.r.nom)).join(', ') : 'Tout le monde est payé'}</div></div>
  </div>
  <div class="card" style="margin-top:14px"><h3>Employés</h3><div class="tw"><table><tr><th>Nom</th><th>Poste</th><th class="n">Salaire</th><th class="n">Prime</th><th>${fmtM(RHM)}</th><th></th></tr>
  ${emp.map(x => { const ok = paye(x.r.nom, RHM), ina = x.r.statut === 'Inactif'; return `<tr ${ina?'style="opacity:.5"':''}><td><b>${esc(x.r.nom)}</b>${x.r.tel?`<div class="small muted">${esc(x.r.tel)}</div>`:''}</td><td>${esc(x.r.poste||'')}${x.r.obs?`<div class="small muted">${esc(x.r.obs)}</div>`:''}</td><td class="n">${FC(x.r.sal)}</td><td class="n">${num(x.r.prime)?FC(x.r.prime):'—'}</td><td>${ina?'<span class="tag gr">inactif</span>':ok?'<span class="tag">✓ payé</span>':`<button class="btn sm p" onclick="payerEmp(${x.i})">Payer</button>`}</td><td class="n"><button class="btn sm" onclick="editEmp(${x.i})">✎</button></td></tr>`; }).join('') || '<tr><td colspan="6" class="empty">Aucun employé</td></tr>'}

function exportPaies(nom){
  const P = paies().filter(p => !nom || p.nom === norm(nom));
  const rows = P.map(p => ({Mois:p.mois, 'Payé le':p.date, 'Employé':p.nom, 'Nom saisi':p.saisi, Montant:p.montant, 'Libellé':p.desc}));
  const name = `MOAYES_paies_${nom ? norm(nom).replace(/[^A-Z0-9]+/g,'_') + '_' : ''}${today()}`;
  if (typeof XLSX === 'undefined'){
    const csv = ['Mois;Payé le;Employé;Nom saisi;Montant;Libellé', ...rows.map(r => [r.Mois, r['Payé le'], r['Employé'], r['Nom saisi'], r.Montant, String(r['Libellé']).replace(/;/g, ',')].join(';'))].join('\n');
    return saveFile(name + '.csv', 'text/csv', csv);
  }
  const wb = XLSX.utils.book_new(); XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(rows.length ? rows : [{'(aucune paie)':''}]), 'Paies');
  const mois = [...new Set(P.map(p => p.mois))].sort(), noms = [...new Set(P.map(p => p.nom))];
  const somme = (n, m) => P.filter(p => p.nom === n && (!m || p.mois === m)).reduce((t,p) => t + p.montant, 0);
  const grille = noms.map(n => { const o = {'Employé':n}; mois.forEach(m => o[m] = somme(n, m)); o.Total = somme(n); return o; });
  XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(grille.length ? grille : [{'(aucune paie)':''}]), 'Par mois');
  if (AB) AB.saveFile(name + '.xlsx', 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet', XLSX.write(wb, {bookType:'xlsx', type:'base64'}));
  else XLSX.writeFile(wb, name + '.xlsx');
}

function mouvementsHTML(m){
  const d1 = m + '-01', d2 = finMois(m) < today() ? finMois(m) : today();
  const sumD = (arr, f, a, b) => arr.filter(x => x.date >= a && x.date <= b).reduce((t,x)=>t+f(x),0);
  const sac = (a,b) => ({ach: sumD(DATA.achats, x=>num(x.sacs), a, b) + sumD(DATA.production, x=>num(x.achetes), a, b), prod: sumD(DATA.production, x=>num(x.sacs), a, b), aj: sumD(DATA.stockAjust.filter(x=>x.key==='manioc'), x=>num(x.delta), a, b)});
  const kg = (a,b) => ({prod: sumD(DATA.production, x=>num(x.kg), a, b), vente: sumD(DATA.ventes, x=>num(x.qty)*(num(x.poids)||CFG.poids), a, b), aj: sumD(DATA.stockAjust.filter(x=>x.key==='attieke'), x=>num(x.delta), a, b)});
  const s0 = sac('', addDays(d1,-1)), k0 = kg('', addDays(d1,-1));
  let ss = s0.ach - s0.prod + s0.aj, sk = k0.prod - k0.vente + k0.aj, rows = '';
  for (let d = d1; d <= d2; d = addDays(d,1)){
    const s = sac(d,d), k = kg(d,d);
    if (!s.ach && !s.prod && !s.aj && !k.prod && !k.vente && !k.aj) continue;
    ss += s.ach - s.prod + s.aj; sk += k.prod - k.vente + k.aj;

  }
  return `<table><tr><th rowspan="2">Jour</th><th colspan="4" class="n" style="text-align:center">Manioc (sacs)</th><th colspan="4" class="n" style="text-align:center">Attiéké (kg)</th></tr>

}

/* ---------- outils communs : flux sur une période ---------- */
function flux(d1, d2){
  const ok = d => (!d1 || d >= d1) && (!d2 || d <= d2);
  const o = {ca:0, encV:0, regl:0, achats:0, chHM:0, pots:0, remises:0, cats:{}};
  DATA.ventes.forEach(v => { if (ok(v.date)){ o.ca += num(v.montant); o.encV += enc(v); o.pots += num(v.qty); o.remises += num(v.remiseMontant); } });
  DATA.reglements.forEach(r => { if (ok(r.date)) o.regl += num(r.montant); });
  o.annul = 0; DATA.annulations.forEach(a => { if (ok(a.date)) o.annul += num(a.montant); });
  o.achCash = 0; o.paieF = 0; o.achCredit = 0;
  DATA.achats.forEach(a => { if (ok(a.date)){ o.achats += num(a.montant); if (isCredF(a)) o.achCredit += num(a.montant); else o.achCash += num(a.montant); } });
  DATA.paiementsFourn.forEach(x => { if (ok(x.date)) o.paieF += num(x.montant); });
  DATA.charges.forEach(c => { if (c.cat !== 'Manioc' && ok(c.date)){ o.chHM += num(c.montant); o.cats[c.cat] = (o.cats[c.cat]||0) + num(c.montant); } });
  const MV = maniocValo(); o.stockFin = MV.at(d2 || '9999-12-31').val; o.stockDebut = d1 ? MV.at(addDays(d1, -1)).val : 0; o.varStock = o.stockFin - o.stockDebut; o.consoManioc = o.achats - o.varStock;
  o.entrees = o.encV + o.regl; o.sorties = o.achCash + o.paieF + o.chHM; o.res = o.ca - o.consoManioc - o.chHM - o.annul;
  return o;
}

function restaurer(i, silent){
  const a = DATA.archives[i];
  if (!a || !a.collection || !a.item || !Array.isArray(DATA[a.collection])) return toast('Restauration impossible');
  const go_ = () => {
    if (a.collection === 'clients' && DATA.clients.some(c => c.id === a.item.id)) { toast('Ce client existe déjà'); return; }
    DATA[a.collection].push(a.item); DATA.archives.splice(i, 1);
    audit(a.collection, 'restauration', '', a.item, a.item.idClient || a.item.id || '');
    if (!silent){ save(); render(); toast('✅ Restauré'); }
  };
  if (silent) return go_();
  confirmBox(`Restaurer cet élément ?<br><b>${esc(arcLabel(a))}</b>`, go_, 'Restaurer');
}

const b64utf8 = t => { const b = new TextEncoder().encode(t); let s = ''; for (let i = 0; i < b.length; i += 0x8000) s += String.fromCharCode.apply(null, b.subarray(i, i + 0x8000)); return btoa(s); };

  rd.readAsText(file);
}
function exportCSV(){

async function fbDiag(){
  const el = $('#fbDiag'); if (!el) return;
  const L = []; const show = () => el.innerHTML = L.map(([ok, t]) => `<div class="alert ${ok===true?'g':ok===false?'r':''}">${ok===true?'✓':ok===false?'✕':'…'} ${t}</div>`).join('');
  const step = async (label, fn, fix) => { L.push([null, label]); show(); try { const r = await fn(); L[L.length-1] = [true, label + (r ? ' — ' + r : '')]; show(); return true; } catch(e){ FB_ERR = e; L[L.length-1] = [false, `${label} — ${esc(String(e.code||e.message||e))}<br><b>À faire :</b> ${fix}`]; show(); return false; } };
  const tmo = (p, ms) => Promise.race([p, new Promise((_, ko) => setTimeout(() => ko(new Error('délai dépassé (réseau trop lent ou bloqué)')), ms))]);
  if (!await step('Internet et bibliothèque Firebase', async () => { if (typeof firebase === 'undefined') throw new Error('bibliothèque Firebase non chargée'); }, 'vérifiez la connexion internet puis rechargez la page.')) return;
  if (!await step('Connexion anonyme', async () => { await tmo(fbReady(), 25000); return 'identifiant ' + _auth.currentUser.uid.slice(0,8) + '…'; }, 'étape 1 : activer « Anonyme » dans Authentication → Sign-in method.')) { setFb('err', fbShort(FB_ERR)); return; }
  const isPerm = e => /PERMISSION|permission/i.test(String((e && (e.code || e.message)) || ''));
  // test léger : on lit seulement l'horodatage de la dernière synchronisation, pas toutes les données
  if (!await step('Lecture de ' + CFG.fbPath, async () => { const sn = await tmo(_db.ref(CFG.fbPath + '/_lastSaved').once('value'), 25000); const t = sn.val(); return t ? 'dernière synchronisation le ' + new Date(t).toLocaleString('fr-FR') : 'emplacement vide (normal la première fois)'; },
      'voir le résultat ci-dessous.')) {
    if (!isPerm(FB_ERR)){
      L[L.length-1] = [false, `Lecture de ${esc(CFG.fbPath)} — <b>la connexion est trop lente ou coupée</b> (aucune réponse en 25 secondes). Ce n'est <b>pas</b> un problème de règles : rien à changer dans Firebase.<br><b>À faire :</b> passez en Wi-Fi ou rapprochez-vous d'une zone avec du réseau, désactivez l'économiseur de données, puis relancez le diagnostic. Vos saisies restent sur le téléphone et partiront au retour du réseau.`];
      setFb('err', 'Hors ligne'); show(); return;
    }
    setFb('err', 'Accès refusé');
    L.push([null, 'Recherche d\'un emplacement déjà autorisé…']); show();
    const probe = async (fn) => { try { await tmo(fn(), 20000); return 'ok'; } catch(e){ return isPerm(e) ? 'refus' : 'reseau'; } };
    const v30 = await probe(() => _db.ref('moayes/data/_lastSaved').once('value'));
    const alt = 'moayes/v2_data';
    const altOk = v30 === 'ok' && await probe(() => _db.ref('moayes/v2_ping').set({t: Date.now()})) === 'ok' && await probe(() => _db.ref(alt + '/_lastSaved').once('value')) === 'ok';
    L.pop();
    if (altOk && CFG.fbPath !== alt){
      L.push([true, `<b>Solution immédiate trouvée.</b> Vos règles autorisent le dossier « moayes ». L'application peut y travailler à l'emplacement <b>${alt}</b>, sans rien changer dans Firebase.<br><button class="btn p sm" style="margin-top:8px" onclick="CFG.fbPath='${alt}';saveCfg();REMOTE_SEEN=false;LISTEN_PATH='';fbDiag()">Utiliser ${alt}</button>`]);
    } else if (v30 === 'refus'){
      const uid = _auth && _auth.currentUser ? _auth.currentUser.uid : '?';
      L.push([false, `<b>Cet appareil est refusé par les règles de la base</b> (Firebase a répondu « accès refusé »). Identifiant de cet appareil : <b style="user-select:all">${esc(uid)}</b>.<br><b>Solution :</b> remplacer les règles (étape 2 ci-dessus, bouton « Copier les règles »), puis <b>Publier</b>.`]);
    } else if (v30 === 'reseau'){
      L.push([false, '<b>La connexion est trop lente pour terminer le test.</b> Repassez le diagnostic en Wi-Fi avant de changer quoi que ce soit dans Firebase.']);
    } else {
      L.push([false, '<b>Les règles refusent cet emplacement.</b> Remplacez les règles (étape 2, bouton « Copier les règles ») puis <b>Publier</b>.']);
    }
    show(); return;
  }
  const root = CFG.fbPath.split('/')[0];
  if (!await step('Écriture (test)', async () => { await tmo(_db.ref(root + '/ping').set({t: Date.now(), by: ROLES[USER].name}), 25000); }, 'étape 2 : les règles doivent autoriser « .write » sur ' + esc(root) + '.')) { setFb('err', fbShort(FB_ERR)); return; }
  L.push([true, '<b>Firebase fonctionne.</b>' + (CFG.fbAuto ? ' Synchronisation automatique active.' : ' Activez la synchronisation automatique dans Paramètres.')]); show();
  FB_ERR = null; REMOTE_SEEN = false; LISTEN_PATH = ''; if (CFG.fbAuto) fbListen(); setFb('', '☁ En ligne');
}
function fbReady(){
  return new Promise((ok, ko) => {
    try {
      if (typeof firebase === 'undefined') return ko(new Error('SDK Firebase indisponible (hors ligne ?)'));
      if (!firebase.apps.length) firebase.initializeApp(FIREBASE_CONFIG);
      _db = firebase.database(); _auth = firebase.auth();
      if (_auth.currentUser) return ok();
      _auth.signInAnonymously().then(() => ok()).catch(ko);
    } catch(e){ ko(e); }
  });
}
function fbErr(e){
  const m = String(e && (e.code || e.message) || '');
  if (/PERMISSION|permission/.test(m)) return 'Firebase refuse l\'accès (règles de sécurité de la base). Voir Mode d\'emploi → Synchronisation.';
  if (/SDK|network|offline/i.test(m)) return 'Pas de connexion internet : les données restent sur ce téléphone et partiront au retour du réseau.';
  return m || 'Firebase indisponible';
}
function fbListen(){
  if (!CFG.fbAuto) return;
  fbReady().then(() => {
    if (LISTEN_PATH && LISTEN_PATH !== CFG.fbPath) _db.ref(LISTEN_PATH).off();
    if (LISTEN_PATH === CFG.fbPath) return;
    LISTEN_PATH = CFG.fbPath;
    _db.ref('.info/connected').on('value', s => { if (s.val() === false) setFb('err', 'Hors ligne'); else if (REMOTE_SEEN) setFb('', DIRTY ? 'Envoi…' : '☁ En ligne'); });
    _db.ref(CFG.fbPath).on('value', snap => {
      const d = snap.val();
      REMOTE_SEEN = true;
      if (!d){ REMOTE_NV = 0; if (DATA.ventes.length) fbPush(true); else setFb('off', 'Cloud vide'); return; }
      const ventes = Array.isArray(d.ventes) ? d.ventes : Object.values(d.ventes || {});
      REMOTE_NV = ventes.length;
      const remoteTs = d._lastSaved || 0, localTs = +localStorage.getItem(LS_TS) || 0;
      const localEmpty = !DATA.ventes.length && !DATA.production.length;
      if ((remoteTs > localTs && !DIRTY) || localEmpty){
        applyRemote(d, remoteTs, 'firebase');
        if (localTs) toast('🔄 Mis à jour depuis un autre appareil');
        if (CFG.sbOn) setTimeout(() => sbCheck(), 800);
      } else if (localTs > remoteTs) fbPush(true);
      setFb('', '☁ En ligne');
    }, e => {
      FB_ERR = e; setFb('err', fbShort(e)); LISTEN_PATH = '';
      // règles V30 limitées au dossier « moayes » : bascule automatique vers moayes/v2_data (V30 intacte)
      if (fbShort(e) === 'Accès refusé' && CFG.fbPath === 'moayes_v2/data' && !window._fbAlt){
        window._fbAlt = 1;
        _db.ref('moayes/v2_data').once('value').then(() => { CFG.fbPath = 'moayes/v2_data'; saveCfg(); REMOTE_SEEN = false; toast('☁ Emplacement autorisé trouvé : moayes/v2_data'); fbListen(); }).catch(() => {});
      }
    });
  }).catch(e => { FB_ERR = e; setFb('err', fbShort(e)); });
}
function fbPush(silent){
  if (silent && CFG.fbAuto && !REMOTE_SEEN){ fbListen(); return; }
  if (REMOTE_NV > DATA.ventes.length + 50){ setFb('err', 'Envoi bloqué'); toast('⚠️ Le cloud contient beaucoup plus de ventes que ce téléphone : envoi bloqué pour ne rien écraser. Paramètres → Récupérer.'); return; }
  if (!silent) setFb('', 'Envoi…');
  fbReady().then(() => {
    const payload = JSON.parse(JSON.stringify(DATA)); payload._lastSaved = DATA._lastSaved || Date.now(); payload._v2 = VERSION;
    return _db.ref(CFG.fbPath).set(payload);
  }).then(() => { DIRTY = false; setFb('', '☁ Synchronisé ' + nowH()); if (!silent) toast('✅ Envoyé sur Firebase (' + CFG.fbPath + ')'); })
    .catch(e => { setFb('err', 'Non envoyé'); if (!silent) toast('❌ ' + fbErr(e)); });
}
function fbPull(path, auto){
  if (!auto) setFb('', 'Lecture…');
  fbReady().then(() => _db.ref(path).once('value')).then(snap => {
    const d = snap.val();
    if (!d){ setFb('off', 'Vide'); if (!auto) toast('Aucune donnée à cet emplacement'); return; }
    const remoteTs = d._lastSaved || 0, localTs = +localStorage.getItem(LS_TS) || 0;
    if (auto){
      if (remoteTs > localTs){ DATA = sanitize(d); localStorage.setItem(LS_DATA, JSON.stringify(DATA)); localStorage.setItem(LS_TS, String(remoteTs)); CACHE = null; render(); toast('Données mises à jour depuis le cloud'); }
      setFb('', '☁ Synchronisé'); return;
    }
    confirmBox(`Remplacer les données locales par celles de <b>${esc(path)}</b> ?<br>${(Array.isArray(d.ventes)?d.ventes:Object.values(d.ventes||{})).length} ventes · enregistrées le ${remoteTs?new Date(remoteTs).toLocaleString('fr-FR'):'?'}`, () => {
      DATA = sanitize(d); audit('système','import Firebase','',path,''); REMOTE_NV = 0; save(); TOUR = null; toast('✅ Données récupérées'); go('home');
    }, 'Remplacer');
    setFb('', '☁ Connecté');
  }).catch(e => { setFb('err', 'Hors ligne'); if (!auto) toast('❌ ' + fbErr(e)); });
}

/* ---------- Supabase (en plus ou à la place de Firebase) ----------
   Une ligne par entreprise dans la table : id, ts (horodatage), nv (nombre de ventes), data (toutes les données). */
const SB = {seen:false, nv:0, timer:null, poll:null, dirty:false, txt:''};
function sbSet(t){ SB.txt = t; const el = $('#sbChip'); if (el) el.textContent = t; }
function sbBase(){ return CFG.sbUrl.trim().replace(/\/+$/,'') + '/rest/v1/' + encodeURIComponent(CFG.sbTable || 'moayes_sync'); }
function sbHead(extra){ return Object.assign({apikey: CFG.sbKey.trim(), Authorization: 'Bearer ' + CFG.sbKey.trim(), 'Content-Type': 'application/json'}, extra || {}); }
async function sbReq(qs, opt){
  if (!CFG.sbUrl || !CFG.sbKey) throw new Error('Adresse ou clé Supabase manquante');
  const r = await fetch(sbBase() + qs, Object.assign({headers: sbHead(opt && opt.h)}, opt || {}));
  if (!r.ok){
    const t = await r.text().catch(() => '');
    if (r.status === 401 || r.status === 403) throw new Error('Clé refusée ou règle de sécurité (RLS) manquante');
    if (r.status === 404 || /relation|does not exist|schema cache/i.test(t)) throw new Error('Table « ' + CFG.sbTable + ' » introuvable : exécutez le script SQL');
    throw new Error('Supabase ' + r.status + ' ' + t.slice(0, 120));
  }
  return r.status === 204 || r.status === 201 && !(opt && opt.wantJson) ? null : r.json();
}
const sbId = () => encodeURIComponent(CFG.sbId || 'main');
async function sbCheck(manual){
  if (!CFG.sbOn && !manual) return;
  try {
    const rows = await sbReq(`?id=eq.${sbId()}&select=ts,nv`);
    SB.seen = true;
    const m = rows && rows[0];
    const localTs = +localStorage.getItem(LS_TS) || 0, localEmpty = !DATA.ventes.length && !DATA.production.length;
    if (!m){ SB.nv = 0; if (DATA.ventes.length) await sbPush(true); else sbSet('Supabase vide'); return 'vide'; }
    SB.nv = m.nv || 0;
    if ((m.ts > localTs && !SB.dirty) || (localEmpty && m.nv)){
      const full = await sbReq(`?id=eq.${sbId()}&select=ts,data`);
      if (full && full[0] && full[0].data){ applyRemote(full[0].data, full[0].ts, 'supabase'); if (localTs) toast('🔄 Mis à jour depuis Supabase'); if (CFG.fbAuto && REMOTE_SEEN) fbPush(true); }
    } else if (localTs > m.ts) await sbPush(true);
    sbSet('Supabase ✓');
    return m;
  } catch(e){ sbSet('Supabase ✕'); if (manual) throw e; }
}
async function sbPush(silent){
  if (!CFG.sbOn && silent) return;
  if (!SB.seen){ return sbCheck(); }
  if (SB.nv > DATA.ventes.length + 50){ sbSet('Supabase : envoi bloqué'); toast('⚠️ Supabase contient beaucoup plus de ventes que ce téléphone : envoi bloqué. Paramètres → Récupérer.'); return; }
  try {
    sbSet('Supabase…');
    const ts = DATA._lastSaved || +localStorage.getItem(LS_TS) || Date.now();
    await sbReq('', {method:'POST', h:{Prefer:'resolution=merge-duplicates,return=minimal'},
      body: JSON.stringify([{id: CFG.sbId || 'main', ts, nv: DATA.ventes.length, data: DATA, updated_at: new Date().toISOString()}])});
    SB.dirty = false; SB.nv = DATA.ventes.length; sbSet('Supabase ✓ ' + nowH());
    if (!silent) toast('✅ Envoyé sur Supabase');
  } catch(e){ sbSet('Supabase ✕'); if (!silent) toast('❌ ' + e.message); }
}
async function sbPull(){
  try {
    const full = await sbReq(`?id=eq.${sbId()}&select=ts,nv,data`);
    if (!full || !full[0]) return toast('Aucune donnée dans Supabase');
    confirmBox(`Remplacer les données de ce téléphone par celles de Supabase ?<br>${full[0].nv} ventes · enregistrées le ${new Date(full[0].ts).toLocaleString('fr-FR')}`, () => {
      applyRemote(full[0].data, full[0].ts, 'supabase'); SB.seen = true; SB.nv = full[0].nv; audit('système','import Supabase','',CFG.sbTable,''); toast('✅ Données récupérées'); go(homeOf());
    }, 'Remplacer');
  } catch(e){ toast('❌ ' + e.message); }
}
async function sbTest(){
  try { const m = await sbCheck(true); toast(m === 'vide' ? '✅ Connecté. La table est vide : vos données viennent d\'y être envoyées.' : `✅ Connecté à Supabase · ${m.nv} ventes dans le cloud`); render(); }
  catch(e){ toast('❌ ' + e.message); }
}
function sbStart(){
  clearInterval(SB.poll);
  if (!CFG.sbOn) return;
  sbCheck();
  SB.poll = setInterval(() => { if (document.visibilityState === 'visible') sbCheck(); }, 20000);
}
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible' && USER){ if (CFG.sbOn) sbCheck(); } });
const SB_SQL = `create table if not exists public.moayes_sync (
  id text primary key,
  ts bigint not null default 0,
  nv integer not null default 0,
  data jsonb,
  updated_at timestamptz default now()
);
alter table public.moayes_sync enable row level security;
create policy "moayes_app" on public.moayes_sync
  for all to anon using (true) with check (true);`;

/* ---------- Connexion ---------- */
async function hash(s){
  try { const b = await crypto.subtle.digest('SHA-256', new TextEncoder().encode('moayes:'+s)); return [...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join(''); }
  catch(e){ let h = 5381; for (const ch of 'moayes:'+s) h = ((h<<5)+h+ch.charCodeAt(0))|0; return 'x'+h; }
}
async function pins(){
  let p = JSON.parse(localStorage.getItem(LS_PIN) || 'null');
  let ch = false; if (!p) p = {};
  for (const r of Object.keys(ROLES)) if (!p[r]){ p[r] = await hash(ROLES[r].def); ch = true; }
  if (ch) localStorage.setItem(LS_PIN, JSON.stringify(p));
  if (DATA && DATA._pinsV2) p = Object.assign({}, p, DATA._pinsV2);
  return p;
}
function loginScreen(){
  $('#layer').innerHTML = `<div class="login"><div class="box">
    <img class="llogo" src="logo.png" alt="MOAYÉ'S INDUSTRIE" onerror="this.outerHTML='<h1>MOAYÉ&#39;S INDUSTRIE</h1>'"><p class="muted small" style="margin:4px 0 18px">Gestion Pro ${VERSION} · Cultiver, transformer, valoriser</p>
    <div class="seg" id="roles" style="margin-bottom:14px">${Object.entries(ROLES).map(([k,r],i) => `<button class="${i?'':'on'}" onclick="window._role='${k}';[...this.parentNode.children].forEach(b=>b.classList.remove('on'));this.classList.add('on');$('#pin').focus()">${r.name}</button>`).join('')}</div>
    <input class="inp pin" id="pin" type="password" inputmode="numeric" maxlength="8" placeholder="••••" onkeydown="if(event.key==='Enter')doLogin()">
    <button class="btn p big" style="margin-top:12px" onclick="doLogin()">Entrer</button>
    <p class="small muted" id="lerr" style="margin-top:10px"></p></div></div>`;
  window._role = 'admin';
  setTimeout(() => { const e = $('#pin'); if (e) e.focus(); }, 50);
}
function logLocal(action, role){
  const n = DATA.audit.reduce((m,a) => Math.max(m, a.num||0), 0) + 1;
  DATA.audit.push({num:n, date:today(), heure:nowH(), user:ROLES[role] ? ROLES[role].name : role, module:'connexion', action, ancien:'', nouveau:ROLES[role] ? ROLES[role].name : role, id:'', commentaire:'V2'});
  try { localStorage.setItem(LS_DATA, JSON.stringify(DATA)); } catch(e){}
}
async function doLogin(){
  const lock = +sessionStorage.getItem('moayes_v2_lock') || 0;
  if (Date.now() < lock){ $('#lerr').textContent = `Trop d'essais. Réessayez dans ${Math.ceil((lock-Date.now())/1000)} s.`; return; }
  const p = await pins(), v = $('#pin').value;
  if (await hash(v) === p[window._role]){
    sessionStorage.removeItem('moayes_v2_fail');
    USER = window._role; sessionStorage.setItem('moayes_v2_user', USER); sessionStorage.setItem('moayes_v2_lh', await hash(v)); $('#layer').innerHTML = '';
    audit('connexion', 'connexion', '', ROLES[USER].name, ''); try { localStorage.setItem(LS_DATA, JSON.stringify(DATA)); } catch(e){}
    start();
  } else {
    const f = (+sessionStorage.getItem('moayes_v2_fail') || 0) + 1; sessionStorage.setItem('moayes_v2_fail', f);
    logLocal(f >= 5 ? 'connexion verrouillée (5 échecs)' : 'échec de connexion', window._role);
    if (f >= 5){ sessionStorage.setItem('moayes_v2_lock', Date.now() + 60000); sessionStorage.setItem('moayes_v2_fail', 0); $('#lerr').textContent = '5 codes faux : accès bloqué 1 minute.'; }
    else $('#lerr').textContent = `Code incorrect (${f}/5)`;
    $('#pin').value = '';
  }
}
let WEAK = [];
async function checkDefaultPins(){ const p = await pins(); WEAK = []; for (const [k,r] of Object.entries(ROLES)) if (p[k] === await hash(r.def)) WEAK.push(r.name); if (PAGE==='home') render(); }
/* après réception des données d'un autre appareil : le code saisi doit rester valable */
function verifySession(){
  const lh = sessionStorage.getItem('moayes_v2_lh');
  if (USER && DATA._pinsV2 && DATA._pinsV2[USER] && lh && DATA._pinsV2[USER] !== lh){ toast('Le code ' + ROLES[USER].name + ' a été changé : reconnectez-vous'); logout(); }
}
function applyRemote(d, ts, src){
  DATA = sanitize(d); CACHE = null; TOUR = null;
  try { localStorage.setItem(LS_DATA, JSON.stringify(DATA)); } catch(e){}
  localStorage.setItem(LS_TS, String(ts || 0));
  verifySession();
  if (USER && !document.querySelector('.md')) render();
}
function logout(){ sessionStorage.removeItem('moayes_v2_user'); sessionStorage.removeItem('moayes_v2_lh'); USER = null; loginScreen(); }
function changePin(role){
  form('Nouveau code · ' + ROLES[role].name, [{k:'a', label:'Nouveau code (4 à 8 chiffres)', type:'password'}, {k:'b', label:'Confirmer', type:'password'}], v => {
    if (!/^\d{4,8}$/.test(v.a) || v.a !== v.b){ toast('Codes invalides ou différents'); return false; }
    hash(v.a).then(async h => { const p = JSON.parse(localStorage.getItem(LS_PIN) || '{}'); p[role] = h; localStorage.setItem(LS_PIN, JSON.stringify(p));
      DATA._pinsV2 = Object.assign({}, DATA._pinsV2 || {}, {[role]: h}); if (role === USER) sessionStorage.setItem('moayes_v2_lh', h);
      audit('sécurité','changement de code','',ROLES[role].name,''); save(); checkDefaultPins(); toast('✅ Code modifié sur tous les appareils'); });
  });
}

/* ---------- démarrage ---------- */
function start(){
  PAGE = homeOf();
  render();
  if (CFG.fbAuto) fbListen();
  sbStart();
  checkDefaultPins();
  clearInterval(window._waT);
  window._waT = setInterval(() => {
    if (!USER || !isMgr() || !CFG.waHour || new Date().getHours() < CFG.waHour || localStorage.getItem('moayes_v2_waSent') === today() || document.querySelector('.md')) return;
    localStorage.setItem('moayes_v2_waSent', today());
    modal(`<h2>📲 Bilan du jour</h2><p>Il est ${nowH()}. Envoyer le bilan de la journée sur WhatsApp ?</p><div class="act"><button class="btn" onclick="closeModal()">Plus tard</button><button class="btn p" onclick="closeModal();waBilan()">Envoyer</button></div>`);
  }, 60000);
  if (CFG.autoBk && isMgr() && DATA.ventes.length && localStorage.getItem('moayes_v2_lastExport') !== today()) setTimeout(() => { if (localStorage.getItem('moayes_v2_lastExport') !== today()){ exportJSON(); toast('💾 Sauvegarde du jour téléchargée (dossier Téléchargements)'); } }, 6000);
  if (USER === 'admin') setTimeout(() => { if (!DATA.ventes.length && !document.querySelector('.md')) modal(`<h2>Bienvenue dans Gestion Pro V2</h2><p>Aucune donnée n'est encore arrivée sur cet appareil. Vérifiez la connexion internet (indicateur en haut à droite), ou importez une sauvegarde JSON.</p>
    <div class="act" style="flex-wrap:wrap"><button class="btn" onclick="closeModal()">Plus tard</button><button class="btn" onclick="closeModal();fbHelp()">Vérifier la synchronisation</button>
    <label class="btn p">Importer le fichier JSON<input type="file" accept=".json" class="hide" onchange="closeModal();importJSON(this.files[0])"></label></div>`); }, CFG.fbAuto ? 3500 : 300);
}
load();
USER = sessionStorage.getItem('moayes_v2_user');
if (USER && ROLES[USER]) start(); else loginScreen();
</script>
