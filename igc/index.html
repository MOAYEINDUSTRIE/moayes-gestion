/* Œil : afficher / masquer les mots de passe et codes (tous les champs, y compris ceux créés plus tard) */
(function(){
  const css = document.createElement('style');
  css.textContent = '.oeil-w{position:relative;display:block}.oeil-w>input{padding-right:46px!important}.oeil{position:absolute;right:4px;top:50%;transform:translateY(-50%);width:40px;height:40px;border:0;background:transparent;cursor:pointer;display:flex;align-items:center;justify-content:center;color:#667085;padding:0;margin:0;box-shadow:none}.oeil:hover{color:#1d2b4f}.oeil svg{width:22px;height:22px}@media print{.oeil{display:none}}';
  document.head.appendChild(css);
  const OUVERT = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>';
  const FERME = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94"/><path d="M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19"/><path d="M14.12 14.12a3 3 0 1 1-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/></svg>';
  window.OEIL = { OUVERT, FERME };
  function equiper(inp){
    if (inp.dataset.oeil) return; inp.dataset.oeil = '1';
    const w = document.createElement('span'); w.className = 'oeil-w';
    const cs = getComputedStyle(inp); if (cs.display === 'inline-block' || cs.marginLeft === cs.marginRight && cs.marginLeft !== '0px') { w.style.width = inp.offsetWidth ? inp.offsetWidth + 'px' : ''; w.style.margin = '0 auto'; }
    inp.parentNode.insertBefore(w, inp); w.appendChild(inp);
    const b = document.createElement('button'); b.type = 'button'; b.className = 'oeil'; b.tabIndex = -1;
    b.setAttribute('aria-label', 'Afficher le mot de passe'); b.title = 'Afficher'; b.innerHTML = OUVERT;
    b.addEventListener('mousedown', e => e.preventDefault());
    b.addEventListener('click', e => { e.preventDefault(); e.stopPropagation(); const voir = inp.type === 'password'; inp.type = voir ? 'text' : 'password'; b.innerHTML = voir ? FERME : OUVERT; b.title = voir ? 'Masquer' : 'Afficher'; b.setAttribute('aria-label', voir ? 'Masquer le mot de passe' : 'Afficher le mot de passe'); inp.focus(); });
    w.appendChild(b);
  }
  const scan = () => document.querySelectorAll('input[type=password]:not([data-oeil])').forEach(equiper);
  new MutationObserver(scan).observe(document.documentElement, { childList: true, subtree: true }); scan();
})();
</script>
<script>
/* Mise à jour automatique : vérifie la version publiée à l'ouverture, au retour sur l'application et toutes les 30 minutes */
(function(){
  let affiche = false;
  function banniere(v){
    if (affiche || !document.body) return; affiche = true;
    const d = document.createElement('div'); d.id = 'maj-banniere';
    d.style.cssText = 'position:fixed;left:12px;right:12px;bottom:calc(76px + env(safe-area-inset-bottom));z-index:99999;background:#1b2a4a;color:#fff;border-radius:14px;padding:12px 14px;display:flex;gap:10px;align-items:center;justify-content:space-between;box-shadow:0 8px 24px rgba(0,0,0,.25);font:600 14px/1.35 system-ui,sans-serif;max-width:560px;margin:0 auto';
    d.innerHTML = '<span>Nouvelle version ' + v + ' disponible</span><button type="button" style="background:#d4a017;color:#1b2a4a;border:0;border-radius:10px;padding:9px 14px;font:700 14px system-ui,sans-serif;cursor:pointer;white-space:nowrap">Mettre à jour</button>';
    d.querySelector('button').onclick = () => {
      const fin = () => location.reload();
      try { (navigator.serviceWorker && navigator.serviceWorker.getRegistration ? navigator.serviceWorker.getRegistration() : Promise.resolve(null)).then(r => r ? r.update() : null).then(fin, fin); } catch(e){ fin(); }
    };
    document.body.appendChild(d);
  }
  function verifier(){
    let actuelle; try { actuelle = VERSION; } catch(e){ return; }
    fetch(location.pathname.replace(/[^/]*$/, '') + 'index.html?maj=' + Date.now(), { cache: 'no-store' })
      .then(r => r.ok ? r.text() : '').then(t => { const m = t.match(new RegExp('const VER' + 'SION = \'([^\']+)\'')); if (m && m[1] !== actuelle) banniere(m[1]); }).catch(() => {});
  }
  window.addEventListener('load', () => setTimeout(verifier, 3000));
  document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') verifier(); });
  setInterval(verifier, 30 * 60 * 1000);
})();
</script>

async function sha(s){ const b = await crypto.subtle.digest('SHA-256', new TextEncoder().encode('igc|' + s)); return [...new Uint8Array(b)].map(x => x.toString(16).padStart(2,'0')).join(''); }

/* montant en lettres (français) */
function enLettres(n){
  n = Math.round(Math.abs(num(n)));
  if (n === 0) return 'zéro';
  const U = ['','un','deux','trois','quatre','cinq','six','sept','huit','neuf','dix','onze','douze','treize','quatorze','quinze','seize','dix-sept','dix-huit','dix-neuf'];
  const D = ['','dix','vingt','trente','quarante','cinquante','soixante','soixante','quatre-vingt','quatre-vingt'];
  const cent = x => {
    let s = ''; const c = Math.floor(x/100), r = x % 100;
    if (c) s = (c > 1 ? U[c] + ' cent' + (r === 0 ? 's' : '') : 'cent');
    if (r){
      let t;
      if (r < 20) t = U[r];
      else { const d = Math.floor(r/10), u = r % 10;
        if (d === 7 || d === 9) t = D[d] + (d === 7 && u === 1 ? ' et ' : '-') + U[10+u];
        else t = D[d] + (u === 1 && d !== 8 ? ' et un' : u ? '-' + U[u] : (d === 8 ? 's' : '')); }
      s += (s ? ' ' : '') + t;
    }
    return s;
  };
  const parts = [[1e9,'milliard'],[1e6,'million'],[1e3,'mille']];
  let s = '', rest = n;
  for (const [v, w] of parts){
    const q = Math.floor(rest / v); rest %= v;
    if (!q) continue;
    if (w === 'mille') s += (q === 1 ? 'mille' : cent(q).replace(/(cent|vingt)s$/,'$1') + ' mille') + ' ';
    else s += cent(q) + ' ' + w + (q > 1 ? 's' : '') + ' ';
  }
  if (rest) s += cent(rest);
  return s.trim();
}

function load(){
  try { const d = JSON.parse(localStorage.getItem(KEY)); if (d && d.societe) return sanitize(d); } catch(e){}
  return blank();
}
function sanitize(d){
  const b = blank();
  for (const k of Object.keys(b)) if (d[k] === undefined) d[k] = b[k];
  d.societe = Object.assign(b.societe, d.societe || {});
  for (const c of COLS) d[c] = (Array.isArray(d[c]) ? d[c] : Object.values(d[c] || {})).filter(x => x && x.id);
  d.devis.concat(d.factures).forEach(x => { if (!Array.isArray(x.lignes)) x.lignes = Object.values(x.lignes || {}); });
  if (!Array.isArray(d.audit)) d.audit = Object.values(d.audit || {});
  return d;
}
let DIRTY = false;
function save(action){
  DATA._lastSaved = now();
  if (action) { DATA.audit.unshift({ t: now(), u: SESSION ? SESSION.role : '', a: action }); DATA.audit = DATA.audit.slice(0, 300); }
  try { localStorage.setItem(KEY, JSON.stringify(DATA)); } catch(e){ toast('Mémoire du téléphone pleine : exportez une sauvegarde'); }
  DIRTY = true; fbPush();
}
function put(col, obj, action){
  obj.u = now();
  const i = DATA[col].findIndex(x => x.id === obj.id);
  if (i >= 0) DATA[col][i] = obj; else DATA[col].push(obj);
  delete DATA._del[obj.id];
  save(action);
  return obj;
}
function del(col, id, action){
  DATA[col] = DATA[col].filter(x => x.id !== id);
  DATA._del[id] = now();
  save(action);
}
const get = (col, id) => DATA[col].find(x => x.id === id);

function nextNum(prefix){
  const y = new Date().getFullYear(), k = prefix + y;
  const used = DATA[prefix === 'F' ? 'factures' : 'devis'].map(x => x.num).filter(n => n && n.startsWith('IGC-' + prefix + '-' + y)).map(n => +n.split('-').pop());
  const n = Math.max(DATA.compteurs[k] || 0, ...used, 0) + 1;
  DATA.compteurs[k] = n;
  return `IGC-${prefix}-${y}-${String(n).padStart(3,'0')}`;
}

/* ---------- calculs ---------- */
function totaux(doc){
  const ht = (doc.lignes || []).reduce((s, l) => s + num(l.q) * num(l.pu), 0);
  const remise = num(doc.remise);
  const base = Math.max(0, ht - remise);
  const tva = doc.tva ? Math.round(base * num(DATA.societe.tvaTaux) / 100) : 0;
  return { ht, remise, base, tva, ttc: base + tva };
}
const payeF = f => DATA.paiements.filter(p => p.factureId === f.id).reduce((s, p) => s + num(p.montant), 0);
function etatF(f){
  if (f.statut === 'annulee') return { k:'annulee', t:'Annulée', c:'' };
  const t = totaux(f).ttc, p = payeF(f), reste = t - p;
  if (reste <= 0) return { k:'payee', t:'Payée', c:'g', reste:0 };
  if (f.echeance && f.echeance < today()) return { k:'retard', t: p ? 'Partielle, en retard' : 'En retard', c:'r', reste };
  return { k: p ? 'partielle' : 'attente', t: p ? 'Partielle' : 'À encaisser', c:'w', reste };
}
const facturesActives = () => DATA.factures.filter(f => f.statut !== 'annulee');
function tresorerie(){
  const s = DATA.soldes, from = s.date || '0000';
  const res = { caisse: num(s.caisse), banque: num(s.banque), mobile: num(s.mobile) };
  const compte = m => m === 'Espèces' ? 'caisse' : (m === 'Mobile Money' || m === 'Wave') ? 'mobile' : 'banque';
  DATA.paiements.filter(p => p.date >= from).forEach(p => res[compte(p.mode)] += num(p.montant));
  DATA.depenses.filter(d => d.date >= from).forEach(d => res[compte(d.mode)] -= num(d.montant));
  res.total = res.caisse + res.banque + res.mobile;
  return res;
}
function periode(m){ // m = 'AAAA-MM' ou 'AAAA'
  const inP = d => (d || '').startsWith(m);
  const fac = facturesActives().filter(f => inP(f.date));
  return {
    facture: fac.reduce((s, f) => s + totaux(f).ttc, 0),
    factureHT: fac.reduce((s, f) => s + totaux(f).base, 0),
    tva: fac.reduce((s, f) => s + totaux(f).tva, 0),
    encaisse: DATA.paiements.filter(p => inP(p.date)).reduce((s, p) => s + num(p.montant), 0),
    depenses: DATA.depenses.filter(d => inP(d.date)).reduce((s, d) => s + num(d.montant), 0),
    nbFac: fac.length,
  };
}
const aRecevoir = () => facturesActives().reduce((s, f) => s + Math.max(0, etatF(f).reste || 0), 0);

let fb = null, fbRef = null, FBST = { c:'', t:'Hors ligne' };
function setFb(c, t){ FBST = { c, t }; const el = $('#fbpill'); if (el){ el.className = 'pill ' + c; el.textContent = '☁ ' + t; } }
function mergeData(remote){
  remote = sanitize(remote);
  const dels = Object.assign({}, remote._del || {}, DATA._del || {});
  for (const id in dels) dels[id] = Math.max(num((remote._del || {})[id]), num((DATA._del || {})[id]));
  let changed = false;
  for (const c of COLS){
    const map = new Map();
    for (const x of DATA[c]) map.set(x.id, x);
    for (const x of remote[c]){
      const l = map.get(x.id);
      if (!l || num(x.u) > num(l.u)){ map.set(x.id, x); if (!l || JSON.stringify(l) !== JSON.stringify(x)) changed = true; }
    }
    const arr = [...map.values()].filter(x => !(dels[x.id] && dels[x.id] >= num(x.u)));
    if (arr.length !== DATA[c].length) changed = true;
    DATA[c] = arr;
  }
  if (num(remote._lastSaved) > num(DATA._lastSaved)){
    for (const k of ['societe','soldes','_pins']) if (JSON.stringify(DATA[k]) !== JSON.stringify(remote[k])){ DATA[k] = remote[k]; changed = true; }
  }
  for (const k in remote.compteurs || {}) DATA.compteurs[k] = Math.max(DATA.compteurs[k] || 0, remote.compteurs[k]);
  const seen = new Set(DATA.audit.map(a => a.t + a.a));
  (remote.audit || []).forEach(a => { if (!seen.has(a.t + a.a)) DATA.audit.push(a); });
  DATA.audit.sort((a, b) => b.t - a.t); DATA.audit = DATA.audit.slice(0, 300);
  DATA._del = dels;
  DATA._lastSaved = Math.max(num(DATA._lastSaved), num(remote._lastSaved));
  return changed;
}
function fbInit(){
  if (typeof firebase === 'undefined'){ setFb('', 'Hors ligne'); return; }
  try {
    fb = firebase.apps.length ? firebase.app() : firebase.initializeApp(FB_CFG);
    setFb('w', 'Connexion…');
    firebase.auth().signInAnonymously().then(() => {
      fbRef = firebase.database().ref(FB_PATH);
      fbRef.on('value', snap => {
        const r = snap.val();
        if (r && r.societe){
          const ch = mergeData(r);
          try { localStorage.setItem(KEY, JSON.stringify(DATA)); } catch(e){}
          if (ch && SESSION) render();
          const localNewer = JSON.stringify(stripForCompare(DATA)) !== JSON.stringify(stripForCompare(sanitize(r)));
          if (localNewer) fbPush(true); else { DIRTY = false; setFb('g', 'Synchronisé'); }
        } else fbPush(true);
      }, err => setFb('r', err && err.code === 'PERMISSION_DENIED' ? 'Accès refusé' : 'Erreur'));
    }).catch(e => setFb('r', 'Connexion refusée'));
  } catch(e){ setFb('r', 'Erreur'); }
}
function stripForCompare(d){ const o = {}; for (const c of COLS) o[c] = d[c].map(x => x.id + ':' + x.u).sort(); o.del = Object.keys(d._del || {}).sort(); return o; }
let pushT = null;
function fbPush(now_){
  if (!fbRef) return;
  clearTimeout(pushT);
  pushT = setTimeout(() => {
    setFb('w', 'Envoi…');
    fbRef.set(JSON.parse(JSON.stringify(DATA))).then(() => { DIRTY = false; setFb('g', 'Synchronisé'); }).catch(e => setFb('r', e && e.code === 'PERMISSION_DENIED' ? 'Accès refusé' : 'Envoi impossible'));
  }, now_ ? 50 : 600);
}
window.addEventListener('online', () => fbPush(true));
window.addEventListener('offline', () => setFb('', 'Hors ligne'));

    <div class="card"><h3>🧾 À encaisser en priorité</h3>${facturesActives().filter(f => etatF(f).reste > 0).sort((a, b) => (a.echeance || '').localeCompare(b.echeance || '')).slice(0, 6).map(f => `<div style="display:flex;justify-content:space-between;gap:8px;padding:6px 0;border-bottom:1px solid var(--line);cursor:pointer" onclick="go('facture','${f.id}')"><span class="small"><b>${esc(f.num)}</b> ${esc(cli(f.clientId).nom)}<br><span class="tag ${etatF(f).c}">${etatF(f).t}</span> ${f.echeance ? 'échéance ' + dfr(f.echeance) : ''}</span><b class="small">${FCFA(etatF(f).reste)}</b></div>`).join('') || '<div class="muted small">Rien à encaisser. 👍</div>'}
      <div class="act"><button class="btn sm" onclick="editDevis()">+ Devis</button><button class="btn sm p" onclick="editFacture()">+ Facture</button></div></div>
  </div>
  <div class="card" style="margin-top:12px"><h3>📝 Devis en attente de réponse (${devisAtt.length})</h3>${tbl([['N°'],['Client'],['Objet'],['Montant','n'],['Envoyé']], devisAtt.map(d => `<tr class="click" onclick="editDevis('${d.id}')"><td>${esc(d.num)}</td><td>${esc(cli(d.clientId).nom)}</td><td>${esc(d.objet)}</td><td class="n">${FCFA(totaux(d).ttc)}</td><td>${dfr(d.date)}</td></tr>`), 'Aucun devis en attente.')}</div>`;
};

/* ----- clients ----- */
let CQ = '';
VIEWS.clients = () => {
  const q = CQ.toLowerCase();
  const L = DATA.clients.filter(c => !q || (c.nom + ' ' + (c.contact || '') + ' ' + (c.tel || '') + ' ' + (c.type || '')).toLowerCase().includes(q)).sort((a, b) => a.nom.localeCompare(b.nom));
  return `<div class="bar"><input class="grow" placeholder="🔍 Rechercher un client, un contact, un téléphone" value="${esc(CQ)}" oninput="CQ=this.value;clearTimeout(window._cq);window._cq=setTimeout(()=>{render();const i=document.querySelector('.bar input');i.focus();i.setSelectionRange(i.value.length,i.value.length)},250)"><button class="btn p" onclick="editClient()">+ Nouveau client</button></div>
  <div class="card">${tbl([['Client'],['Type'],['Contact'],['Facturé','n'],['Reste dû','n']], L.map(c => {
    const fs = facturesActives().filter(f => f.clientId === c.id);
    const tot = fs.reduce((s, f) => s + totaux(f).ttc, 0), reste = fs.reduce((s, f) => s + (etatF(f).reste || 0), 0);
    return `<tr class="click" onclick="go('client','${c.id}')"><td><b>${esc(c.nom)}</b></td><td>${esc(c.type || '')}</td><td>${esc(c.contact || '')}${c.tel ? '<br><span class="small muted">' + esc(c.tel) + '</span>' : ''}</td><td class="n">${FCFA(tot)}</td><td class="n" style="color:${reste ? 'var(--ko)' : 'inherit'}">${FCFA(reste)}</td></tr>`;
  }), DATA.clients.length ? 'Aucun résultat.' : 'Aucun client. Touchez « + Nouveau client ».')}</div>`;
};
VIEWS.client = id => {
  const c = get('clients', id); if (!c) return '<div class="empty">Client introuvable.</div>';
  const fs = DATA.factures.filter(f => f.clientId === id), ds = DATA.devis.filter(d => d.clientId === id), ms = DATA.missions.filter(m => m.clientId === id);
  const reste = fs.filter(f => f.statut !== 'annulee').reduce((s, f) => s + (etatF(f).reste || 0), 0);
  return `<div class="bar"><button class="btn sm" onclick="go('clients')">← Clients</button><button class="btn sm" onclick="editClient('${id}')">✏ Modifier</button><button class="btn sm" onclick="editDevis(null,'${id}')">+ Devis</button><button class="btn sm p" onclick="editFacture(null,'${id}')">+ Facture</button>${c.tel ? `<button class="btn sm" onclick="wa('${esc(c.tel)}','')">WhatsApp</button>` : ''}</div>
  <div class="grid g3" style="margin-bottom:12px"><div class="card"><h3>${esc(c.nom)}</h3><div class="small">${esc(c.type || '')}<br>${esc(c.contact || '')}<br>${esc(c.tel || '')} ${esc(c.email || '')}<br>${esc(c.adresse || '')}${c.notes ? '<br><span class="muted">' + esc(c.notes) + '</span>' : ''}</div></div>
    <div class="card kpi"><div class="l">Total facturé</div><div class="v">${FCFA(fs.filter(f => f.statut !== 'annulee').reduce((s, f) => s + totaux(f).ttc, 0))}</div></div>
    <div class="card kpi"><div class="l">Reste dû</div><div class="v" style="color:${reste ? 'var(--ko)' : 'inherit'}">${FCFA(reste)}</div></div></div>
  <div class="card" style="margin-bottom:12px"><h3>Factures</h3>${tbl([['N°'],['Date'],['Objet'],['Montant','n'],['État']], fs.map(f => `<tr class="click" onclick="go('facture','${f.id}')"><td>${esc(f.num)}</td><td>${dfr(f.date)}</td><td>${esc(f.objet)}</td><td class="n">${FCFA(totaux(f).ttc)}</td><td><span class="tag ${etatF(f).c}">${etatF(f).t}</span></td></tr>`), 'Aucune facture.')}</div>
  <div class="grid g2"><div class="card"><h3>Devis</h3>${tbl([['N°'],['Objet'],['Montant','n'],['Statut']], ds.map(d => `<tr class="click" onclick="editDevis('${d.id}')"><td>${esc(d.num)}</td><td>${esc(d.objet)}</td><td class="n">${FCFA(totaux(d).ttc)}</td><td>${devisTag(d)}</td></tr>`), 'Aucun devis.')}</div>
  <div class="card"><h3>Missions</h3>${tbl([['Mission'],['Statut'],['Avancement','n']], ms.map(m => `<tr class="click" onclick="editMission('${m.id}')"><td>${esc(m.titre)}</td><td>${missionTag(m)}</td><td class="n">${num(m.avancement)} %</td></tr>`), 'Aucune mission.')}</div></div>`;
};
function editClient(id){
  const c = id ? get('clients', id) : {};
  modal(`<h2>${id ? 'Modifier le client' : 'Nouveau client'}</h2><div class="f">
    <div class="full"><label>Nom / raison sociale *</label><input id="c_nom" value="${esc(c.nom)}"></div>
    <div><label>Type</label><select id="c_type">${opts(TYPES_CLI, c.type || 'Entreprise')}</select></div>
    <div><label>Personne à contacter</label><input id="c_contact" value="${esc(c.contact)}"></div>
    <div><label>Téléphone</label><input id="c_tel" inputmode="tel" value="${esc(c.tel)}"></div>
    <div><label>E-mail</label><input id="c_email" type="email" value="${esc(c.email)}"></div>
    <div class="full"><label>Adresse</label><input id="c_adr" value="${esc(c.adresse)}"></div>
    <div><label>N° compte contribuable (si entreprise)</label><input id="c_cc" value="${esc(c.cc)}"></div>
    <div><label>Notes</label><input id="c_notes" value="${esc(c.notes)}"></div></div>
    <div class="act">${id && can() ? `<button class="btn d" onclick="delClient('${id}')">Supprimer</button>` : ''}<button class="btn" onclick="closeModal()">Annuler</button><button class="btn p" onclick="saveClient('${id || ''}')">Enregistrer</button></div>`);
}
function saveClient(id){
  const nom = val('c_nom'); if (!nom) return toast('Le nom est obligatoire');
  const c = Object.assign(id ? get('clients', id) : { id: uid('C'), cree: today() }, { nom, type: val('c_type'), contact: val('c_contact'), tel: val('c_tel'), email: val('c_email'), adresse: val('c_adr'), cc: val('c_cc'), notes: val('c_notes') });
  put('clients', c, (id ? 'Modification' : 'Création') + ' client ' + nom); closeModal(); toast('Client enregistré'); go('client', c.id);
}
function delClient(id){
  if (DATA.factures.some(f => f.clientId === id)) return toast('Ce client a des factures : impossible de le supprimer');
  if (!confirm('Supprimer ce client ?')) return;
  del('clients', id, 'Suppression client'); closeModal(); go('clients');
}

/* ----- lignes (devis/factures) ----- */
let LIG = [];
function lignesHTML(){
  return `<table class="lines"><thead><tr><th style="width:55%">Prestation</th><th class="n" style="width:12%">Qté</th><th class="n" style="width:22%">Prix unitaire</th><th></th></tr></thead><tbody>${LIG.map((l, i) => `<tr><td><input value="${esc(l.d)}" oninput="LIG[${i}].d=this.value" placeholder="Désignation"></td><td><input inputmode="decimal" value="${esc(l.q)}" oninput="LIG[${i}].q=this.value;majTot()"></td><td><input inputmode="numeric" value="${esc(l.pu)}" oninput="LIG[${i}].pu=this.value;majTot()"></td><td><button class="btn sm d" onclick="LIG.splice(${i},1);$('#lig').innerHTML=lignesHTML();majTot()">✕</button></td></tr>`).join('')}</tbody></table>
  <button class="btn sm" style="margin-top:6px" onclick="LIG.push({d:'',q:1,pu:''});$('#lig').innerHTML=lignesHTML()">+ Ligne</button>`;
}
function majTot(){
  const t = totaux({ lignes: LIG, remise: val('x_remise'), tva: $('#x_tva') && $('#x_tva').checked });
  const el = $('#x_tot'); if (el) el.innerHTML = `<div><span>Total HT</span><b>${FCFA(t.ht)}</b></div>${t.remise ? `<div><span>Remise</span><b>− ${FCFA(t.remise)}</b></div>` : ''}${t.tva ? `<div><span>TVA ${DATA.societe.tvaTaux} %</span><b>${FCFA(t.tva)}</b></div>` : ''}<div class="big"><span>Total ${t.tva ? 'TTC' : ''}</span><span>${FCFA(t.ttc)}</span></div>`;
}
const commonDocFields = (d, cid) => `
  <div><label>Client *</label><select id="x_cli">${cliOpts(d.clientId || cid)}</select></div>
  <div><label>Date</label><input id="x_date" type="date" value="${d.date || today()}"></div>
  <div class="full"><label>Objet *</label><input id="x_obj" value="${esc(d.objet)}" placeholder="ex. Plan de communication institutionnelle 2027"></div>
  <div class="full" id="lig">${lignesHTML()}</div>
  <div><label>Remise (F)</label><input id="x_remise" inputmode="numeric" value="${esc(d.remise || '')}" oninput="majTot()"></div>
  <div><label style="display:flex;gap:8px;align-items:center;margin-top:22px"><input id="x_tva" type="checkbox" style="width:auto" ${(d.tva ?? DATA.societe.tvaDefaut) ? 'checked' : ''} onchange="majTot()"> Appliquer la TVA (${DATA.societe.tvaTaux} %)</label></div>
  <div class="full"><div class="tot" id="x_tot"></div></div>
  <div class="full"><label>Conditions / notes (imprimées)</label><textarea id="x_notes">${esc(d.notes || '')}</textarea></div>`;
function readDoc(){ return { clientId: val('x_cli'), date: val('x_date') || today(), objet: val('x_obj'), lignes: LIG.filter(l => l.d || num(l.pu)).map(l => ({ d: l.d, q: num(l.q) || 1, pu: num(l.pu) })), remise: num(val('x_remise')), tva: $('#x_tva').checked, notes: val('x_notes') }; }

/* ----- devis ----- */
const DST = { brouillon:['Brouillon',''], envoye:['Envoyé','w'], accepte:['Accepté','g'], refuse:['Refusé','r'] };
const devisTag = d => `<span class="tag ${DST[d.statut || 'brouillon'][1]}">${DST[d.statut || 'brouillon'][0]}</span>`;
let DF = 'tous';
VIEWS.devis = () => {
  const L = DATA.devis.filter(d => DF === 'tous' || d.statut === DF).sort((a, b) => (b.date + b.num).localeCompare(a.date + a.num));
  return `<div class="bar"><select onchange="DF=this.value;render()">${[['tous','Tous'],...Object.entries(DST).map(([k, v]) => [k, v[0]])].map(([k, t]) => `<option value="${k}" ${DF === k ? 'selected' : ''}>${t}</option>`).join('')}</select><span class="grow"></span><button class="btn p" onclick="editDevis()">+ Nouveau devis</button></div>
  <div class="card">${tbl([['N°'],['Date'],['Client'],['Objet'],['Montant','n'],['Statut']], L.map(d => `<tr class="click" onclick="editDevis('${d.id}')"><td>${esc(d.num)}</td><td>${dfr(d.date)}</td><td>${esc(cli(d.clientId).nom)}</td><td>${esc(d.objet)}</td><td class="n">${FCFA(totaux(d).ttc)}</td><td>${devisTag(d)}</td></tr>`), 'Aucun devis.')}</div>`;
};
function editDevis(id, cid){
  if (!DATA.clients.length) { toast('Ajoutez d\'abord un client'); return editClient(); }
  const d = id ? get('devis', id) : { statut:'brouillon', validite: 30 };
  LIG = (d.lignes && d.lignes.length ? d.lignes : [{ d:'', q:1, pu:'' }]).map(l => ({ ...l }));
  modal(`<h2>${id ? 'Devis ' + esc(d.num) : 'Nouveau devis'}</h2><div class="f">${commonDocFields(d, cid)}
    <div><label>Statut</label><select id="x_st">${Object.entries(DST).map(([k, v]) => `<option value="${k}" ${d.statut === k ? 'selected' : ''}>${v[0]}</option>`).join('')}</select></div>
    <div><label>Validité (jours)</label><input id="x_val" inputmode="numeric" value="${esc(d.validite ?? 30)}"></div></div>
    <div class="act">${id && can() ? `<button class="btn d" onclick="if(confirm('Supprimer ce devis ?')){del('devis','${id}','Suppression devis');closeModal();render()}">Supprimer</button>` : ''}
    ${id ? `<button class="btn" onclick="printDoc('devis','${id}')">🖨 Imprimer / PDF</button>` : ''}
    ${id && d.statut !== 'refuse' ? `<button class="btn g" onclick="devisVersFacture('${id}')">→ Facturer</button>` : ''}
    <button class="btn" onclick="closeModal()">Annuler</button><button class="btn p" onclick="saveDevis('${id || ''}')">Enregistrer</button></div>`);
  majTot();
}
function saveDevis(id, silent){
  const x = readDoc(); if (!x.clientId || !x.objet) { toast('Client et objet obligatoires'); return null; }
  if (!x.lignes.length) { toast('Ajoutez au moins une prestation'); return null; }
  const d = Object.assign(id ? get('devis', id) : { id: uid('D'), num: nextNum('D') }, x, { statut: val('x_st'), validite: num(val('x_val')) || 30 });
  put('devis', d, (id ? 'Modification' : 'Création') + ' devis ' + d.num);
  if (!silent){ closeModal(); toast('Devis ' + d.num + ' enregistré'); render(); }
  return d;
}
function devisVersFacture(id){
  const d = saveDevis(id, true); if (!d) return;
  d.statut = 'accepte'; put('devis', d);
  let m = DATA.missions.find(x => x.devisId === d.id);
  if (!m) m = put('missions', { id: uid('M'), devisId: d.id, clientId: d.clientId, titre: d.objet, domaine: '', montant: totaux(d).ttc, debut: today(), fin: '', responsable: '', statut: 'en_cours', avancement: 0, notes: '' }, 'Mission créée depuis devis ' + d.num);
  closeModal();
  editFacture(null, d.clientId, { objet: d.objet, lignes: d.lignes, remise: d.remise, tva: d.tva, notes: d.notes, devisId: d.id, missionId: m.id });
}

/* ----- missions ----- */
const MST = { a_venir:['À venir','b'], en_cours:['En cours','w'], terminee:['Terminée','g'], suspendue:['Suspendue','r'] };
const missionTag = m => `<span class="tag ${MST[m.statut || 'a_venir'][1]}">${MST[m.statut || 'a_venir'][0]}</span>`;
let MF = 'actives';
VIEWS.missions = () => {
  const L = DATA.missions.filter(m => MF === 'toutes' || (MF === 'actives' ? m.statut !== 'terminee' : m.statut === MF)).sort((a, b) => (b.debut || '').localeCompare(a.debut || ''));
  return `<div class="bar"><select onchange="MF=this.value;render()">${[['actives','En cours et à venir'],['toutes','Toutes'],...Object.entries(MST).map(([k, v]) => [k, v[0]])].map(([k, t]) => `<option value="${k}" ${MF === k ? 'selected' : ''}>${t}</option>`).join('')}</select><span class="grow"></span><button class="btn p" onclick="editMission()">+ Nouvelle mission</button></div>
  <div class="card">${tbl([['Mission'],['Client'],['Domaine'],['Montant','n'],['Facturé','n'],['Statut'],['Avancement','n']], L.map(m => {
    const fac = facturesActives().filter(f => f.missionId === m.id).reduce((s, f) => s + totaux(f).ttc, 0);
    return `<tr class="click" onclick="editMission('${m.id}')"><td><b>${esc(m.titre)}</b>${m.fin ? `<br><span class="small muted">fin ${dfr(m.fin)}${m.fin < today() && m.statut !== 'terminee' ? ' ⚠ dépassée' : ''}</span>` : ''}</td><td>${esc(cli(m.clientId).nom)}</td><td>${esc(m.domaine || '')}</td><td class="n">${FCFA(m.montant)}</td><td class="n">${FCFA(fac)}</td><td>${missionTag(m)}</td><td class="n">${num(m.avancement)} %</td></tr>`;
  }), 'Aucune mission.')}</div>`;
};
function editMission(id){
  if (!DATA.clients.length) { toast('Ajoutez d\'abord un client'); return editClient(); }
  const m = id ? get('missions', id) : { statut:'en_cours', avancement:0, debut: today() };
  modal(`<h2>${id ? 'Mission' : 'Nouvelle mission'}</h2><div class="f">
    <div class="full"><label>Intitulé *</label><input id="m_t" value="${esc(m.titre)}"></div>
    <div><label>Client *</label><select id="m_c">${cliOpts(m.clientId)}</select></div>
    <div><label>Domaine</label><select id="m_d"><option></option>${opts(DOMAINES, m.domaine)}</select></div>
    <div><label>Montant prévu (F)</label><input id="m_mt" inputmode="numeric" value="${esc(m.montant || '')}"></div>
    <div><label>Responsable</label><input id="m_r" value="${esc(m.responsable)}" placeholder="Moaye, consultant, agent…"></div>
    <div><label>Début</label><input id="m_db" type="date" value="${m.debut || ''}"></div>
    <div><label>Fin prévue</label><input id="m_fn" type="date" value="${m.fin || ''}"></div>
    <div><label>Statut</label><select id="m_s">${Object.entries(MST).map(([k, v]) => `<option value="${k}" ${m.statut === k ? 'selected' : ''}>${v[0]}</option>`).join('')}</select></div>
    <div><label>Avancement : <b id="m_av_l">${num(m.avancement)} %</b></label><input id="m_av" type="range" min="0" max="100" step="5" value="${num(m.avancement)}" oninput="$('#m_av_l').textContent=this.value+' %'"></div>
    <div class="full"><label>Livrables, étapes, notes</label><textarea id="m_n">${esc(m.notes)}</textarea></div></div>
    <div class="act">${id && can() ? `<button class="btn d" onclick="if(confirm('Supprimer cette mission ?')){del('missions','${id}','Suppression mission');closeModal();render()}">Supprimer</button>` : ''}
    ${id ? `<button class="btn" onclick="closeModal();editFacture(null,'${m.clientId}',{objet:${esc(JSON.stringify(m.titre))},missionId:'${id}'})">+ Facture</button>` : ''}
    <button class="btn" onclick="closeModal()">Annuler</button><button class="btn p" onclick="saveMission('${id || ''}')">Enregistrer</button></div>`);
}
function saveMission(id){
  const titre = val('m_t'), clientId = val('m_c'); if (!titre || !clientId) return toast('Intitulé et client obligatoires');
  let st = val('m_s'), av = num(val('m_av')); if (st === 'terminee') av = 100;
  const m = Object.assign(id ? get('missions', id) : { id: uid('M') }, { titre, clientId, domaine: val('m_d'), montant: num(val('m_mt')), responsable: val('m_r'), debut: val('m_db'), fin: val('m_fn'), statut: st, avancement: av, notes: val('m_n') });
  put('missions', m, (id ? 'Modification' : 'Création') + ' mission ' + titre); closeModal(); toast('Mission enregistrée'); render();
}

/* ----- factures ----- */
let FF = 'tous';
VIEWS.factures = a => {
  if (a) FF = a;
  const L = DATA.factures.filter(f => FF === 'tous' || (FF === 'impayees' ? etatF(f).reste > 0 : etatF(f).k === FF)).sort((a, b) => (b.date + b.num).localeCompare(a.date + a.num));
  return `<div class="bar"><select onchange="FF=this.value;ARG=null;render()">${[['tous','Toutes'],['impayees','Non soldées'],['retard','En retard'],['payee','Payées'],['annulee','Annulées']].map(([k, t]) => `<option value="${k}" ${FF === k ? 'selected' : ''}>${t}</option>`).join('')}</select><span class="grow"></span><button class="btn" onclick="exportCSV('factures')">⬇ Excel</button><button class="btn p" onclick="editFacture()">+ Nouvelle facture</button></div>
  <div class="card">${tbl([['N°'],['Date'],['Client'],['Objet'],['Montant','n'],['Reste','n'],['État']], L.map(f => { const e = etatF(f); return `<tr class="click" onclick="go('facture','${f.id}')"><td>${esc(f.num)}</td><td>${dfr(f.date)}</td><td>${esc(cli(f.clientId).nom)}</td><td>${esc(f.objet)}</td><td class="n">${FCFA(totaux(f).ttc)}</td><td class="n">${FCFA(e.reste || 0)}</td><td><span class="tag ${e.c}">${e.t}</span></td></tr>`; }), 'Aucune facture.')}</div>`;
};
VIEWS.facture = id => {
  const f = get('factures', id); if (!f) return '<div class="empty">Facture introuvable.</div>';
  const t = totaux(f), e = etatF(f), ps = DATA.paiements.filter(p => p.factureId === id).sort((a, b) => a.date.localeCompare(b.date)), c = cli(f.clientId);
  return `<div class="bar"><button class="btn sm" onclick="go('factures')">← Factures</button>${f.statut !== 'annulee' ? `<button class="btn sm" onclick="editFacture('${id}')">✏ Modifier</button>` : ''}<button class="btn sm" onclick="printDoc('facture','${id}')">🖨 Imprimer / PDF</button>
    ${e.reste > 0 ? `<button class="btn sm g" onclick="editPaiement(null,'${id}')">+ Encaissement</button>` : ''}${e.reste > 0 && c.tel ? `<button class="btn sm" onclick="relance('${id}')">📲 Relancer</button>` : ''}
    ${can() && f.statut !== 'annulee' && !ps.length ? `<button class="btn sm d" onclick="annulerF('${id}')">Annuler la facture</button>` : ''}</div>

function editFacture(id, cid, pre){

  LIG = (f.lignes && f.lignes.length ? f.lignes : [{ d:'', q:1, pu:'' }]).map(l => ({ ...l }));
  const ms = DATA.missions.filter(m => !f.clientId || m.clientId === f.clientId);

function saveFacture(id, devisId){
  const x = readDoc(); if (!x.clientId || !x.objet) return toast('Client et objet obligatoires');

  const f = Object.assign(id ? get('factures', id) : { id: uid('F'), num: nextNum('F'), statut: 'emise', devisId: devisId || '' }, x, { echeance: val('x_ech'), missionId: val('x_mis') });

function annulerF(id){
  const f = get('factures', id); if (!confirm('Annuler la facture ' + f.num + ' ? Elle reste dans l\'historique (numérotation continue).')) return;
  f.statut = 'annulee'; put('factures', f, 'Annulation facture ' + f.num); render();
}
function relance(id){
  const f = get('factures', id), c = cli(f.clientId), e = etatF(f);
  const msg = `Bonjour ${c.contact || c.nom},\n\nSauf erreur de notre part, la facture ${f.num} du ${dfr(f.date)} (${f.objet}) présente un solde de ${FCFA(e.reste)}${f.echeance ? ', échu le ' + dfr(f.echeance) : ''}.\nMerci de bien vouloir procéder au règlement ou de nous indiquer la date prévue.\n\nCordialement,\n${DATA.societe.nom}${DATA.societe.tel ? '\n' + DATA.societe.tel : ''}`;
  wa(c.tel, msg);
}
function wa(tel, msg){
  let t = String(tel || '').replace(/\D/g, ''); if (t.length === 10) t = '225' + t;
  const url = 'https://wa.me/' + t + (msg ? '?text=' + encodeURIComponent(msg) : '');
  if (window.AndroidBridge && AndroidBridge.openExternal) AndroidBridge.openExternal(url); else window.open(url, '_blank');
}

function savePaiement(id){

function nextNumAT(){

}

function statsAtlas(){
  const L = ordres(), fin = L.filter(o => ['validee'].includes(o.statut));
  const reprises = L.reduce((s, o) => s + num(o.reprises), 0);
  const cout = fin.reduce((s, o) => s + num(o.cout), 0);
  return { recues: L.length, actives: L.filter(o => ['nouvelle','en_cours','controle','a_reprendre'].includes(o.statut)).length, aValider: L.filter(o => o.statut === 'a_valider').length,
    validees: fin.length, tauxCorr: fin.length ? Math.round(reprises / fin.length * 100) : 0, coutMoy: fin.length ? cout / fin.length : 0, valeur: L.reduce((s, o) => s + num(o.valeur), 0) };
}
function portesAtlas(){
  const vendues = ordres().filter(o => o.statut === 'validee' && num(o.valeur) > 0);
  const valeur = vendues.reduce((t, o) => t + num(o.valeur), 0), cout = ordres().reduce((t, o) => t + num(o.cout), 0), marge = valeur - cout;
  const d = new Date(), mois3 = [1, 2, 3].map(k => { const x = new Date(d.getFullYear(), d.getMonth() - k, 15); return x.toISOString().slice(0, 7); });
  const couverts = mois3.filter(m => { const P = periode(m); return P.encaisse > 0 && P.encaisse >= P.depenses; }).length;
  const A = { ok: vendues.length >= 3, v: Math.min(vendues.length, 3), max: 3, txt: `${vendues.length} mission(s) vendue(s) et validée(s) sur 3` };
  const B = { ok: vendues.length >= 10 && marge > 0, v: Math.min(vendues.length, 10), max: 10, txt: `${vendues.length} mission(s) vendue(s) sur 10 · marge ${FCFA(marge)}` };
  const C = { ok: couverts === 3, v: couverts, max: 3, txt: `${couverts} mois sur les 3 derniers où les encaissements couvrent les dépenses` };
  const etape = !A.ok ? (ordres().length ? 1 : 0) : !B.ok ? 2 : !C.ok ? 3 : 4;
  return { A, B, C, etape, vendues: vendues.length, marge };
}

    }

  const NS = 'xmlns:w="http://schemas.openxmlformats.org/wordprocessingml/2006/main" xmlns:r="http://schemas.openxmlformats.org/officeDocument/2006/relationships"';

function pinForm(all){

async function savePin(){
  const r = val('pin_r'), p = val('pin_n'); if (!/^\d{4,8}$/.test(p)) return toast('4 à 8 chiffres');

}
function saveSociete(){
  Object.assign(DATA.societe, { nom: val('s_nom'), sigle: val('s_sig'), forme: val('s_fo'), capital: num(val('s_ca')), rccm: val('s_rc'), cc: val('s_cc'), adresse: val('s_ad'), tel: val('s_te'), email: val('s_em'), banque: val('s_ba'), rib: val('s_ri'), tvaTaux: num(val('s_tv')) || 18, tvaDefaut: $('#s_td').checked, mentions: val('s_me') });

}

/* ----- exports ----- */
function saveFile(name, mime, text){
  if (window.AndroidBridge && AndroidBridge.saveFile){ AndroidBridge.saveFile(name, mime, btoa(unescape(encodeURIComponent(text)))); return; }
  const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([text], { type: mime })); a.download = name; document.body.appendChild(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 500);
}
function exportCSV(kind){
  const q = v => '"' + String(v ?? '').replace(/"/g, '""') + '"';
  let rows;
  if (kind === 'factures') rows = [['Numéro','Date','Échéance','Client','Objet','HT','TVA','TTC','Encaissé','Reste','État'], ...DATA.factures.map(f => { const t = totaux(f), e = etatF(f); return [f.num, dfr(f.date), dfr(f.echeance), cli(f.clientId).nom, f.objet, t.base, t.tva, t.ttc, payeF(f), e.reste || 0, e.t]; })];
  else if (kind === 'paiements') rows = [['Date','Facture','Client','Mode','Référence','Montant'], ...DATA.paiements.map(p => { const f = get('factures', p.factureId) || {}; return [dfr(p.date), f.num, cli(f.clientId).nom, p.mode, p.ref, p.montant]; })];
  else rows = [['Date','Catégorie','Description','Fournisseur','Mode','Montant'], ...DATA.depenses.map(d => [dfr(d.date), d.cat, d.desc, d.fournisseur, d.mode, d.montant])];
  saveFile(`IGC_${kind}_${today()}.csv`, 'text/csv', '﻿' + rows.map(r => r.map(q).join(';')).join('\r\n'));
  toast('Fichier Excel prêt');
}
function exportJSON(){ saveFile(`IGC_sauvegarde_${today()}.json`, 'application/json', JSON.stringify(DATA, null, 1)); toast('Sauvegarde téléchargée'); }
function importJSON(file){
  if (!file) return;
  const r = new FileReader();
  r.onload = () => { try { const d = JSON.parse(r.result); if (!d.societe) throw 0; if (!confirm('Fusionner cette sauvegarde avec les données actuelles ?')) return; mergeData(d); save('Restauration d\'une sauvegarde'); toast('Sauvegarde restaurée'); render(); } catch(e){ toast('Fichier invalide'); } };
  r.readAsText(file);
}
